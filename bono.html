<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de bono — Valtia Analytics</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0E1830">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Ficha de bono — mismo lenguaje editorial que Noticias / Ficha de activo:
     página blanca, Playfair + Plex Sans + Plex Mono, nav navy, hairlines. ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0E1830;--navy2:#0B1327;--navy3:#14213D;
  --gold:#B08A3E;--gold2:#8A6A2F;--gold-claro:#E8CE96;
  --bg:#fff;--bg2:#F6F3EC;--bg3:#F6F3EC;
  --text:#101010;--sub:#57534A;--muted:#8B8375;
  --border:#E7E3DA;--card:#fff;
  --ink:#101010;--mut:#8B8375;--line:#E7E3DA;--marfil:#F6F3EC;
  --up:#1F7A4D;--dn:#B23A3A;--greenTx:#1F7A4D;--redTx:#B23A3A;
}
html{scroll-behavior:smooth}
body{background:#fff;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}

/* nav global (navy, igual a Noticias) */
nav{position:sticky;top:0;z-index:200;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;background:rgba(14,24,48,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,206,150,.14)}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:.06em;color:#fff}
.nav-name em{color:#E8CE96;font-style:italic}
.nav-sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.nav-links{display:flex;align-items:center;gap:26px}
.nav-links a{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.nav-links a:hover,.nav-links a.active{color:#E8CE96}
.nav-cta{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#0E1830;background:#E8CE96;padding:9px 22px;border-radius:8px;text-decoration:none}
.nav-cta:hover{background:#fff;color:#0E1830}
@media(max-width:1100px){.nav-links{display:none}}


/* barra superior: volver + acceso al panel (misma columna de 980px que el contenido) */
.top-volver{width:100%;max-width:1084px;margin:0 auto;padding:22px 52px 16px;display:flex;gap:16px;align-items:center;position:relative}
.top-volver::after{content:'';position:absolute;left:52px;right:52px;bottom:0;height:1px;background:var(--line)}
.top-volver a{font-weight:600;margin-left:auto;text-align:right}
.top-volver a:hover{color:var(--gold)!important}
.volver{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);background:none;border:none;border-radius:0;padding:0;white-space:nowrap;cursor:pointer}
.volver:hover{color:var(--gold)}

/* columna de contenido de 980px; el footer (que pinta el JS dentro de <main>) va a sangre */
main{flex:1 0 auto;display:grid;grid-template-columns:minmax(52px,1fr) minmax(0,980px) minmax(52px,1fr);grid-template-rows:repeat(12,auto) 1fr;padding-top:24px}
main>*{grid-column:2;min-width:0}

/* cabecera del bono (como .head de la ficha de activo) */
.eye{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-bottom:8px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:24px}
h1{font:700 clamp(28px,3.4vw,40px) 'Playfair Display',serif;font-variant-numeric:lining-nums;line-height:1.05;letter-spacing:.01em;color:var(--ink)}
.ley{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:0;padding:4px 8px;color:var(--sub);vertical-align:middle;margin-left:12px;white-space:nowrap}
.ley.ny{color:var(--gold2);border-color:var(--gold)}
.px{text-align:right}
.px .v{font:600 clamp(22px,2.6vw,30px) 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.px .s{font:400 11.5px 'IBM Plex Sans',sans-serif;font-variant-numeric:tabular-nums;color:var(--sub);margin-top:7px;line-height:1.5}
.px .s span{font-weight:600}
.pos{color:var(--up)!important}.neg{color:var(--dn)!important}.mut{color:var(--mut)!important}

/* tiles de métricas: tarjeta recta con hairline y acento dorado arriba */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:0;padding:15px 16px 14px;position:relative;min-width:0}
.tile::before{content:'';position:absolute;top:-1px;left:16px;width:22px;height:2px;background:var(--gold)}
.tile .l{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.tile .v{font:600 clamp(15px,1.5vw,18px) 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.tile .s{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--sub);margin-top:6px;line-height:1.45}

/* título de sección: patrón .sec-h de Informes (Playfair + hairline que se estira) */
.sec{display:flex;align-items:center;gap:14px;margin:34px 0 18px;font:700 17px 'Playfair Display',serif;line-height:1.25;color:var(--ink)}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.dos{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:start}
.dos>*{min-width:0}
@media(max-width:760px){.dos{grid-template-columns:1fr}}

/* tabla de flujos */
.panel{background:#fff;border:1px solid var(--line);border-radius:0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:700 10px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:12px 16px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line);font:500 12.5px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--marfil)}
.num{text-align:right}

/* calculadora: bloque destacado marfil con filete dorado */
.calc{background:var(--marfil);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0;padding:18px 20px}
.calc label{display:block;font:700 10px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-bottom:9px;line-height:1.5}
.calc input{width:100%;max-width:180px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:0;color:var(--ink);font:500 14px 'IBM Plex Mono',monospace;outline:none}
.calc input:focus{border-color:var(--gold)}
.calc .out{margin-top:14px;font-size:13.5px;color:var(--sub);line-height:1.8}
.calc .out b{color:var(--ink);font:600 14px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

.state{border:1px dashed var(--line);border-radius:0;text-align:center;padding:60px 20px;color:var(--sub);font-size:14px;line-height:1.9;margin:30px 0 70px}
.state b{color:var(--ink);font:600 13.5px 'IBM Plex Mono',monospace}
.nota{font-size:12px;color:var(--sub);line-height:1.7;margin-top:12px;max-width:70ch}

/* footer de Noticias (navy2) — a sangre, con el texto alineado a la columna de contenido */
footer{margin-top:48px;background:#0B1327;padding:28px max(52px,calc(50% - 490px));font:400 11px 'IBM Plex Sans',sans-serif;line-height:1.9;color:rgba(255,255,255,.55)}
main>footer{grid-column:1/-1;grid-row:13;align-self:end}
footer a{color:inherit}
footer a:hover{color:#E8CE96}

@media(max-width:880px){
  .top-volver{padding-left:20px;padding-right:20px}
  .top-volver::after{left:20px;right:20px}
  main{grid-template-columns:minmax(20px,1fr) minmax(0,980px) minmax(20px,1fr)}
  footer{padding-left:20px;padding-right:20px}
}
@media(max-width:600px){.px{text-align:left}}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">
    <svg width="32" height="32" viewBox="0 0 34 34" fill="none"><rect width="34" height="34" rx="4" fill="#1A3A5C"/><polyline points="5,25 11,14 17,20 23,9 29,13" stroke="#B8975A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="9" r="2.5" fill="#B8975A"/></svg>
    <div><div class="nav-name">VAL<em>T</em>IA</div><div class="nav-sub">Analytics</div></div>
  </a>
  <div class="nav-links">
    <a href="/">Inicio</a>
    <a href="/cartera">Carteras</a>
    <a href="/mercados">Mercados</a>
    <a href="/noticias">Noticias</a>
    <a href="/informes">Informes</a>
    <a href="/herramientas">Herramientas</a>
    <a href="/planes">Planes</a>
  </div>
  <div class="nav-right">
    <a href="/?login=1" class="nav-cta">Ingresar / Crear cuenta</a>
  </div>
</nav>
<!-- cotizaciones en vivo (módulo único del sitio: cotizaciones.js) -->
<div id="valtia-cot"></div>
<div class="top-volver">
  <button class="volver" onclick="volver()">← Volver</button>
  <a href="/herramientas" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);text-decoration:none">Panel de bonos completo →</a>
</div>
<main id="main">
  <div class="state">Cargando la ficha…</div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyCxKNw0995b8a7XXyENiMjDQbfRCe9IBlw',
  authDomain: 'valtia-analytics.firebaseapp.com',
  projectId: 'valtia-analytics',
});
const db = getFirestore(app);

window.volver = () => {
  try {
    if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
      history.back();
      return;
    }
  } catch (e) {}
  location.href = '/herramientas';
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const n2 = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const n1 = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtPct = v => (v >= 0 ? "+" : "") + n2.format(v) + "%";
const cls = v => v > 0.004 ? "pos" : v < -0.004 ? "neg" : "mut";
const fverde = f => { const [a, m, d] = String(f).slice(0, 10).split("-"); return `${d}/${m}/${a.slice(2)}`; };

/* TIR anual efectiva por bisección sobre los flujos (espejo de bonos_lib.xirr) */
function xirr(fls, precio, hoyMs) {
  if (!fls.length || !(precio > 0)) return null;
  const van = y => fls.reduce((s, [f, m]) =>
    s + m / Math.pow(1 + y, (new Date(f) - hoyMs) / 86400000 / 365), 0) - precio;
  let lo = -0.6, hi = 8.0;
  if (van(lo) < 0 || van(hi) > 0) return null;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    if (van(mid) > 0) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

/* tasas de una letra a descuento (espejo de bonos_lib.metricas_letra) */
function tasasLetra(precio, vpv, dias) {
  if (!(precio > 0) || !(vpv > 0) || !(dias >= 5)) return null;
  const r = vpv / precio;
  return { tem: (Math.pow(r, 30 / dias) - 1) * 100,
           tna: (r - 1) * 365 / dias * 100,
           tirea: (Math.pow(r, 365 / dias) - 1) * 100 };
}

const tile = (l, v, s) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;

async function render() {
  // El '.BA' se saca ANTES de limpiar la puntuación: si no, AL30.BA quedaba
  // como "AL30BA" y la ficha decía que la especie no existe (misma regla que
  // canon() de activos.js). `e` puede cambiar abajo si el panel la lista por
  // su versión en dólares.
  let e = (new URLSearchParams(location.search).get("e") || "").trim().toUpperCase()
    .replace(/\.BA$/, "").replace(/[^A-Z0-9]/g, "");
  if (!e) { $("#main").innerHTML = `<div class="state">Elegí una especie desde el <a href="/herramientas" style="color:var(--gold)">panel de bonos →</a></div>`; return; }
  document.title = e + " — Ficha de bono · Valtia Analytics";

  let panel = null, flujos = null, asof = null;
  try {
    const [p, f] = await Promise.all([
      getDoc(doc(db, "bonosPanel", "latest")),
      getDoc(doc(db, "bonosFlujos", "latest")),
    ]);
    if (p.exists()) { panel = JSON.parse(p.data().json || "{}"); asof = p.data().actualizado_utc; }
    if (f.exists()) flujos = JSON.parse(f.data().json || "{}");
  } catch (err) {}
  if (!panel) { $("#main").innerHTML = `<div class="state">No se pudo cargar el panel de bonos. Probá de nuevo en un rato.</div>`; return; }

  const TIPOS = [
    ["soberanos", "Bono soberano · USD"],
    ["bopreal", "Bopreal (BCRA) · USD"],
    ["tasa_fija", "Letra / Boncap a tasa fija · $"],
    ["cer", "Bono CER · $ ajusta por inflación"],
    ["dolar_linked", "Dólar linked · $ ajusta por A3500"],
  ];
  let b = null, tipo = null, tipoNombre = "";
  // El panel lista soberanos y Bopreal por la especie en dólares (AL30D). Quien
  // llega con AL30 —o con AL30C, que es el mismo título liquidado por cable—
  // tiene que caer en esa ficha, no en "no encontramos la especie".
  const candidatas = [e, e + "D", e.replace(/[CD]$/, "") + "D"].filter((x, i, a) => x && a.indexOf(x) === i);
  buscar:
  for (const cand of candidatas) {
    for (const [k, nom] of TIPOS) {
      const hit = (panel[k] || []).find(x => x.s === cand);
      if (hit) { b = hit; tipo = k; tipoNombre = nom; e = cand; break buscar; }
    }
  }
  if (b) document.title = e + " — Ficha de bono · Valtia Analytics";
  if (!b) { $("#main").innerHTML = `<div class="state">No encontramos la especie <b>${esc(e)}</b> en el panel.<br><br><a href="/herramientas" style="color:var(--gold)">Ver el panel completo →</a></div>`; return; }

  const enUSD = tipo === "soberanos" || tipo === "bopreal";
  const mon = enUSD ? "US$" : "$";
  const fls = (flujos && (flujos[e] || (e.endsWith("D") ? flujos[e.slice(0, -1)] : null))) || null;
  const hoyMs = Date.now();

  let tiles = "";
  if (tipo === "tasa_fija") {
    tiles = [
      b.tirea != null ? tile("TIREA", n1.format(b.tirea) + "%", b.vpv_estimado ? "efectiva anual · sobre pago estimado" : "efectiva anual, de mercado") : "",
      b.tem != null ? tile("TEM", n2.format(b.tem) + "%", "efectiva mensual") : "",
      b.tna != null ? tile("TNA", n1.format(b.tna) + "%", "simple, 365 días") : "",
      b.vpv != null ? tile("Paga al vencimiento", "$" + n2.format(b.vpv), b.vpv_estimado ? "por cada 100 VN · estimado, sin dato oficial" : "por cada 100 VN") : "",
      b.dias != null ? tile("Días", b.dias, b.vence ? "al " + fverde(b.vence) : "") : (b.vence ? tile("Vence", fverde(b.vence), "") : ""),
      b.tem_lic ? tile("TEM de licitación", n2.format(b.tem_lic) + "%", "tasa de emisión") : "",
    ].join("");
  } else if (enUSD) {
    tiles = [
      b.tir != null ? tile("TIR", n1.format(b.tir) + "%", "efectiva anual (TIREA)") : "",
      b.paridad != null ? tile("Paridad", n1.format(b.paridad) + "%", "precio / valor técnico") : "",
      b.md != null ? tile("Duration mod.", n2.format(b.md), "sensibilidad a la tasa") : "",
      b.dur != null ? tile("Duration", n2.format(b.dur), "Macaulay, años") : "",
      b.cy != null ? tile("Current yield", n1.format(b.cy) + "%", "cupón vigente / precio") : "",
      tile("Vence", fverde(b.vence), ""),
    ].join("");
  } else {
    tiles = [
      tile("Último", mon + n2.format(b.p), "por 100 VN"),
      b.vence ? tile("Vence", fverde(b.vence), "") : "",
    ].join("");
  }

  const filasFlujo = fls ? (() => {
    let acum = 0;
    return fls.flujos.map(([f, m]) => {
      acum += m;
      return `<tr><td>${fverde(f)}</td><td class="num">US$ ${n2.format(m)}</td><td class="num mut">US$ ${n2.format(acum)}</td></tr>`;
    }).join("");
  })() : "";

  const calc = (tipo === "tasa_fija" && b.vpv != null) || (enUSD && fls) ? `
    <div class="calc">
      <label>TIR a mi precio — ¿y si pago otra cosa?</label>
      <input type="number" step="any" min="0" id="mi-precio" value="${b.p}">
      <div class="out" id="mi-out"></div>
      <div class="nota">Misma matemática del panel: ${tipo === "tasa_fija" ? (b.vpv_estimado ? "tasas sobre un pago final ESTIMADO (sin dato oficial todavía)" : "tasas sobre el pago final oficial de la letra") : "TIR efectiva anual (act/365) por bisección sobre los flujos oficiales"}, valuada a hoy.</div>
    </div>` : "";

  $("#main").innerHTML = `
    <div class="eye">${tipoNombre}</div>
    <div class="head">
      <h1>${esc(e)}${b.ley ? `<span class="ley${b.ley === "NY" ? " ny" : ""}">Ley ${b.ley === "NY" ? "Nueva York" : "Argentina"}</span>` : ""}</h1>
      <div class="px">
        <div class="v">${mon}${n2.format(b.p)}</div>
        <div class="s"><span class="${cls(b.v)}">${fmtPct(b.v)} hoy</span> · por 100 VN${asof ? " · " + new Date(asof.seconds ? asof.seconds * 1000 : asof).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + " hs" : ""}</div>
      </div>
    </div>
    <div class="tiles">${tiles}</div>
    ${tipo === "cer" || tipo === "dolar_linked" ? `<p class="nota">Las tasas reales de los ${tipo === "cer" ? "bonos CER" : "dólar linked"} van a aparecer acá cuando haya una fuente oficial de condiciones de emisión — en Valtia no se estiman a mano.</p>` : ""}
    ${fls || calc ? `<div class="sec">${fls ? "Flujos de fondos y calculadora" : "Calculadora"}</div>
    <div class="dos">
      ${fls ? `<div class="panel"><table>
        <thead><tr><th>Fecha de pago</th><th class="num">Por 100 VN</th><th class="num">Acumulado</th></tr></thead>
        <tbody>${filasFlujo}</tbody></table></div>` : ""}
      ${calc}
    </div>
    ${fls ? `<p class="nota">Cronograma oficial (Dto. 701/2020 / prospecto BCRA): cupones + amortizaciones futuras por cada 100 de valor nominal.</p>` : ""}` : ""}
    <footer>Análisis de carácter general y educativo — no constituye asesoramiento financiero ni recomendación de compra o venta.
    Datos: BYMA vía IOL · condiciones de letras de la Secretaría de Finanzas vía ArgentinaDatos.
    · <a href="/terminos" style="text-decoration:underline">Términos</a> · <a href="/privacidad" style="text-decoration:underline">Privacidad</a></footer>`;

  const inp = $("#mi-precio"), out = $("#mi-out");
  if (inp && out) {
    const recalc = () => {
      const px = parseFloat(inp.value);
      if (!(px > 0)) { out.innerHTML = "Poné un precio mayor a cero."; return; }
      if (tipo === "tasa_fija") {
        const t = tasasLetra(px, b.vpv, b.dias);
        out.innerHTML = t
          ? `A $${n2.format(px)}: TIREA <b>${n1.format(t.tirea)}%</b> · TEM <b>${n2.format(t.tem)}%</b> · TNA <b>${n1.format(t.tna)}%</b>`
          : "Sin tasa: la letra está al borde del vencimiento.";
      } else {
        const y = xirr(fls.flujos, px, hoyMs);
        out.innerHTML = y != null
          ? `A US$${n2.format(px)}: TIR efectiva anual <b>${n1.format(y * 100)}%</b>`
          : "La TIR no converge con ese precio.";
      }
    };
    inp.addEventListener("input", recalc);
    recalc();
  }
}
render();
</script>

<script type="module" src="cotizaciones.js?v=3"></script>
