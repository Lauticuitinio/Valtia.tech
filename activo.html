document.title = `${emp.nombre} (${t}) — Valtia Analytics`;
const sectorN = (SECTORES.find(s => s.k === emp.sector) || {}).n || "";
S.nombre = emp.nombre;
S.claves = emp.claves || [];
// el índice de referencia del gráfico: Nasdaq 100 para tecnología, S&P 500
// para el resto (los dos tienen histórico propio en historialInformes)
const BENCH = t === "SPY" ? "QQQ" : t === "QQQ" ? "SPY" : t === "ETH" ? "BTC" : emp.sector === "tech" ? "QQQ" : "SPY";
const BENCH_NOM = { SPY: "S&P 500 (SPY)", QQQ: "Nasdaq 100 (QQQ)", BTC: "Bitcoin" }[BENCH];

try {
  const [pxSnap, histSnap, radarSnap, radarProSnap, infSnap, notSnap, calSnap, benchSnap] = await Promise.all([
    getDoc(doc(db, "preciosInformes", "latest")).catch(() => null),
    getDoc(doc(db, "historialInformes", t)).catch(() => null),
    getDoc(doc(db, "radar", "latest")).catch(() => null),
    getDoc(doc(db, "radarPro", "latest")).catch(() => null),   // 403 si no es cliente
    emp.slug ? getDoc(doc(db, "informes", emp.slug)).catch(() => null) : Promise.resolve(null),
    getDocs(query(collection(db, "noticias"), where("estado", "==", "publicado"))).catch(() => null),
    getDoc(doc(db, "calendario", "latest")).catch(() => null),
    getDoc(doc(db, "historialInformes", BENCH)).catch(() => null),
  ]);

  // precio en vivo: p y d, apertura (o), rango del día (h/l), cierre anterior
  // (pc), volumen (v), volumen promedio 3M (vp), 52 semanas (h52/l52) y
  // medias de 50 y 200 ruedas (s50/s200)
  const precios = pxSnap && pxSnap.exists() ? JSON.parse(pxSnap.data().json || "{}") : {};
  const px = precios[t] || {};
  const ts = pxSnap && pxSnap.exists() ? pxSnap.data().actualizado_utc : null;
  S.precioUsd = Number(px.p) > 0 ? Number(px.p) : null;

  // radar: lo público (veredicto, precio, RSI, recomendación, salud) más lo
  // PRO (múltiplos, fundamentos, objetivo, precio justo) cuando las reglas
  // dejaron leerlo. Va en una función porque el primer getDoc puede correr
  // antes de que Firestore conozca la sesión: al detectar PRO se vuelve a
  // pedir el doc y se repintan las partes que dependen de él.
  const radarPub = radarSnap && radarSnap.exists() ? JSON.parse(radarSnap.data().json || "{}") : {};
  let radarProDoc = radarProSnap && radarProSnap.exists() ? JSON.parse(radarProSnap.data().json || "{}") : null;
  let ra = null, conRatios = false;
  const armarRadar = () => {
    const _m = mergeRadar(radarPub, radarProDoc);
    conRatios = _m.pro;
    S.radar = _m.activos || [];
    ra = S.radar.find(a => a.sym === radarSym(t)) || null;
    S.ra = ra;
  };
  armarRadar();
  if (conRatios) S.pro = true;

  // informe (si las reglas lo dejan leer; si no, la tarjeta bloqueada)
  const inf = infSnap && infSnap.exists() ? infSnap.data() : null;
  S.inf = inf;
  const cover = `img/${emp.slug}.svg`;

  // histórico (2 años): cada fila es [fecha, cierre ajustado, apertura,
  // máximo, mínimo, volumen, cierre real]. Los índices 1 a 4 vienen ajustados
  // por dividendos; el 6 es el cierre tal como se operó. Todo lo que se
  // compara con el precio de hoy (que es sin ajustar) usa el cierre real:
  // con el ajustado, cada dividendo pagado se sumaba a la variación (en KO,
  // más de 5 % en dos años). Las velas pasan a precios reales con el mismo
  // factor del día. Los docs viejos traen solo [fecha, cierre]: ahí el
  // índice 1 ya es el cierre real.
  const serie = histSnap && histSnap.exists() ? JSON.parse(histSnap.data().json || "[]") : [];
  const filaReal = p => {
    const c = Number(p.length > 6 && p[6] != null ? p[6] : p[1]);
    const f = Number(p[1]) > 0 ? c / Number(p[1]) : 1;
    const ok = p.length >= 5 && p[2] > 0 && p[3] > 0 && p[4] > 0;
    return { f: String(p[0]), c, o: ok ? p[2] * f : c, h: ok ? p[3] * f : c, l: ok ? p[4] * f : c, v: Number(p[5]) || 0, ohlc: ok };
  };
  const filas = serie.map(filaReal).filter(r => esISO(r.f) && isFinite(r.c) && r.c > 0);
  // la vela del último precio: el histórico se baja una vez por día. Si el
  // precio en vivo es de un día posterior a la última fila (la rueda de hoy,
  // o la del viernes mirada un sábado), se suma esa vela.
  (() => {
    const tsDia = ts && ts.toDate ? diaAR(ts.toDate()) : null;
    const ult = filas.length ? filas[filas.length - 1] : null;
    if (tsDia && ult && tsDia > ult.f && px.p > 0 && px.o > 0 && px.h > 0 && px.l > 0)
      filas.push({ f: tsDia, c: px.p, o: px.o, h: Math.max(px.h, px.p, px.o), l: Math.min(px.l, px.p, px.o), v: px.v || 0, ohlc: true });
  })();
  const cierres = filas.map(r => r.c);
  const ult52 = filas.filter(r => r.f >= haceDias(365)).map(r => r.c);
  // 52 semanas: del precio en vivo (incluye el intradía) si el sync ya lo
  // publica; si no, de los cierres reales del histórico
  const r52 = (() => {
    const min = Number(px.l52) || (ult52.length >= 20 ? Math.min(...ult52) : 0);
    const max = Number(px.h52) || (ult52.length >= 20 ? Math.max(...ult52) : 0);
    if (!(min > 0 && max >= min)) return null;
    return { min, max };
  })();
  // variación desde el último cierre real anterior (o igual) a una fecha de
  // corte hasta el último precio; sin histórico que llegue tan atrás, null
  const varDesde = corte => {
    let ancla = null;
    for (const r of filas) { if (r.f <= corte) ancla = r.c; else break; }
    const ultC = cierres.length ? cierres[cierres.length - 1] : null;
    return ancla && ultC ? (ultC / ancla - 1) * 100 : null;
  };
  const seisM = varDesde(haceDias(182));
  // cierre real del día del informe (o el último anterior, si salió sin rueda)
  const cierreEn = fecha => { let v = null; for (const r of filas) { if (r.f > fecha) break; v = r.c; } return v; };

  // ── rango del día, medias móviles y análisis técnico ──
  // la cripto publica el rango de la rueda UTC pero el precio corre las 24 h:
  // si el precio se escapó del rango, el rango se estira hasta el precio
  const dia = px.h > 0 && px.l > 0 && px.h >= px.l ? (() => {
    const min = px.p > 0 ? Math.min(px.l, px.p) : px.l, max = px.p > 0 ? Math.max(px.h, px.p) : px.h;
    return { min, max };
  })() : null;
  const esCripto = /^(BTC|ETH)$/.test(t);
  const volTxt = v => (esCripto ? "US$" : "") + compacto.format(v);
  // ETF y cripto están en el radar (precio, RSI) pero no tienen balance:
  // sin veredicto no se muestran números de fundamentos vacíos
  const fundOk = !!(ra && ra.veredicto && ra.veredicto !== "Sin cobertura");
  const sma = n => cierres.length >= n ? cierres.slice(-n).reduce((a, b) => a + b, 0) / n : null;
  const s20 = sma(20), s50 = Number(px.s50) || sma(50), s200 = Number(px.s200) || sma(200);
  const tec = (() => {
    if (cierres.length < 60) return null;
    // las medias se comparan contra el precio en vivo
    const ult = px.p > 0 ? px.p : cierres[cierres.length - 1];
    let rsi = ra && ra.rsi != null ? Number(ra.rsi) : null;
    if (rsi == null) {
      let g = 0, l = 0;
      for (let i = cierres.length - 14; i < cierres.length; i++) { const d = cierres[i] - cierres[i - 1]; if (d > 0) g += d; else l -= d; }
      rsi = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    const ema = (xs, n) => { const k = 2 / (n + 1); let e = xs[0]; const out = [e]; for (let i = 1; i < xs.length; i++) { e = xs[i] * k + e * (1 - k); out.push(e); } return out; };
    const e12 = ema(cierres, 12), e26 = ema(cierres, 26);
    const macd = e12.map((v, i) => v - e26[i]);
    const senal = ema(macd, 9);
    const histo = macd[macd.length - 1] - senal[senal.length - 1];
    const sig = [];
    const medias = [[20, s20], [50, s50], [200, s200]].filter(([, m]) => m);
    const arriba = medias.filter(([, m]) => ult > m).map(([n]) => n), abajo = medias.filter(([, m]) => ult <= m).map(([n]) => n);
    if (arriba.length) sig.push({ v: arriba.length, t: `sobre la media de ${arriba.join(", ")} ruedas` });
    if (abajo.length) sig.push({ v: -abajo.length, t: `bajo la media de ${abajo.join(", ")} ruedas` });
    // mismas zonas que el radar (35 / 50 / 65). Los extremos no suman ni
    // restan (pueden seguir o revertir) y entre 45 y 55 el RSI no dice nada.
    const zr = rsi < 35 ? "sobrevendido" : rsi < 50 ? "débil" : rsi <= 65 ? "firme" : "sobrecomprado";
    sig.push({ v: rsi >= 55 && rsi <= 65 ? 1 : rsi >= 35 && rsi <= 45 ? -1 : 0, t: `RSI ${Math.round(rsi)} ${zr}` });
    sig.push(histo >= 0 ? { v: 1, t: "MACD positivo" } : { v: -1, t: "MACD negativo" });
    const score = sig.reduce((a, s) => a + s.v, 0);        // -5 … 5
    // tendencia, no orden: el resumen describe los indicadores, no dice qué hacer
    const label = score >= 3 ? "Señales mayormente alcistas" : score >= 1 ? "Sesgo alcista" : score <= -3 ? "Señales mayormente bajistas" : score <= -1 ? "Sesgo bajista" : "Señales mixtas";
    return { score, label, rsi, detalle: sig.map(s => s.t).join(" · ") };
  })();
  const recoTxt = () => ra && RECO[ra.reco] ? RECO[ra.reco] : null;
  // por qué no hay precio justo (lo decide el pipeline, radar_core.radar_calcular)
  const MOTIVO = {
    moneda: ["balance en otra moneda", "El balance está en otra moneda que la cotización: los múltiplos mezclarían monedas y el número engañaría."],
    sin_ganancias: ["sin ganancias para comparar", "No tiene ganancias ni EBITDA positivos suficientes para compararla con su familia."],
    pocos_multiplos: ["pocos comparables", "Hay pocos múltiplos o pocos pares comparables para estimarlo con solidez."],
    contradictorio: ["múltiplos contradictorios", "Sus múltiplos cuentan historias opuestas: por uno parece barata y por otro cara. Un promedio escondería esa diferencia."],
    extremo_caro: ["muy por encima de su familia", "Cotiza muy por encima de su familia en todos los múltiplos. Con una distancia así, un número de precio justo sería más ruido que información."],
    extremo_barato: ["muy por debajo de su familia", "Cotiza muy por debajo de su familia en todos los múltiplos. Suele haber un motivo (riesgo, ciclo, otro tipo de negocio) que un múltiplo no captura."],
  };
  const motivoCorto = m => (MOTIVO[m] || ["sin precio justo publicado"])[0];
  const motivoLargo = m => (MOTIVO[m] || [null, "No hay precio justo publicado para este activo."])[1];
  const nivel = () => ra && ra.calidadNivel >= 1 && ra.calidadNivel <= 5 ? Math.round(ra.calidadNivel) : null;
  const usdC = v => v == null || !isFinite(v) ? null : (v < 0 ? "−" : "") + "US$" + compacto.format(Math.abs(v));
  const cal = (() => { try { return calSnap && calSnap.exists() ? (JSON.parse(calSnap.data().json || "{}").earnings || []) : []; } catch (e) { return []; } })();
  const conVer = () => !!(ra && ra.veredicto && ra.veredicto !== "Sin cobertura");

  // ── Los números ──
  // Arriba, lo que se lee para decidir; el resto, en "Más números". Sin PRO
  // los múltiplos NO viajaron al navegador: la muestra desenfocada no tiene
  // datos, solo los nombres de lo que se desbloquea.
  const fx1 = v => n1.format(v) + "×";
  const fpc = v => n1.format(v) + "%";
  const numerosHtml = () => {
    const vis = [], mas = [];
    const add = (l, v, s, c, extra) => { if (v == null || v === "—" || v === "") return; (extra ? mas : vis).push({ l, v, s: s || "", c: c || "" }); };
    const mult = (campo, l, fmt, dir, pal, sinMed, extra) => {
      if (ra[campo] == null || !isFinite(ra[campo])) return;
      const v = Number(ra[campo]);
      const f = frente(v, medSector(campo, dir < 0), dir, fmt, pal);
      add(l, fmt(v), f.s || sinMed || "", f.c, extra);
    };
    const MULT = ["más barata", "más cara"], MEJOR = ["mejor que el sector", "debajo del sector"];
    if (conRatios && fundOk) {
      mult("per", "P/E últimos 12 meses", fx1, -1, MULT, "Precio sobre ganancias");
      mult("pb", "Precio / Valor libro", fx1, -1, MULT);
      mult("evebitda", "EV / EBITDA", fx1, -1, MULT, "Valor de la empresa sobre EBITDA");
      mult("fcfy", "Flujo libre / precio", fpc, 1, MEJOR, "Caja libre sobre capitalización");
      mult("deudaEbitda", "Deuda / EBITDA", fx1, -1, ["menos deuda", "más deuda"], ra.deudaEbitda < 1 ? "Baja" : ra.deudaEbitda > 3 ? "Alta" : "Manejable");
      mult("margen", "Margen operativo", fpc, 1, MEJOR);
      mult("growth", "Ventas vs. año anterior", v => (v > 0 ? "+" : "") + n1.format(v) + "%", 1, MEJOR, "Interanual");
      mult("roe", "ROE", fpc, 1, MEJOR, "Ganancia sobre patrimonio");
      add("Precio justo", ra.justo ? "US$" + nf.format(ra.justo) : null,
        ra.justo ? `${signo(ra.justoUpside)} · entre ${nf.format(ra.justoMin)} y ${nf.format(ra.justoMax)} según el múltiplo` : "",
        ra.justo ? (ra.justoUpside >= 15 ? "b" : ra.justoUpside <= -15 ? "a" : "") : "");
      if (!ra.justo && ra.justoMotivo) add("Precio justo", "Sin número", motivoCorto(ra.justoMotivo), "", true);
    }
    if (r52) {
      const pos = px.p > 0 ? px.p / r52.max * 100 : null;
      add("Máx / mín 52 semanas", `${usd0(r52.max)} / ${usd0(r52.min)}`, pos != null ? `Está al ${Math.round(pos)}% del máximo` : "",
        pos != null && pos >= 95 ? "a" : "");
    }
    numerosPublicos(ra, (l, v, s, c) => add(l, v, s, c));
    if (tec) add("Análisis técnico", tec.label, tec.detalle, tec.score >= 1 ? "b" : tec.score <= -1 ? "a" : "");
    if (s200 && px.p) add("Media de 200 ruedas", signo((px.p / s200 - 1) * 100), `El precio frente a la media (${usd(s200)})`, "");
    if (dia) add("Rango del día", `${usd(dia.min)} – ${usd(dia.max)}`,
      [px.o ? `abrió en ${usd(px.o)}` : "", px.pc ? `cierre anterior ${usd(px.pc)}` : ""].filter(Boolean).join(" · ").replace(/^./, m => m.toUpperCase()), "", true);
    if (px.v) add("Volumen de hoy", volTxt(px.v), px.vp ? `${Math.round(px.v / px.vp * 100)}% de un día promedio (${volTxt(px.vp)})` : "", "", true);
    if (s50 && px.p) add("Media de 50 ruedas", signo((px.p / s50 - 1) * 100), `El precio frente a la media (${usd(s50)})`, "", true);
    if (conRatios && fundOk) {
      mult("ps", "Precio / Ventas", fx1, -1, MULT, "", true);
      mult("margenNeto", "Margen neto", fpc, 1, MEJOR, "", true);
      mult("roa", "ROA", fpc, 1, MEJOR, "Ganancia sobre activos", true);
      if (ra.liquidez != null) add("Liquidez", fx1(ra.liquidez), "Activo corriente / pasivo corriente", "", true);
      add("Ingresos", usdC(ra.ingresos), "Últimos 12 meses", "", true);
      add("Ganancia neta", usdC(ra.gananciaNeta), "Últimos 12 meses", "", true);
      add("EBITDA", usdC(ra.ebitda), "Últimos 12 meses", "", true);
      if (ra.eps != null) add("Ganancia por acción", "US$" + nf.format(ra.eps), "Últimos 12 meses", "", true);
      if (ra.acciones) add("Acciones en circulación", compacto.format(ra.acciones), "", "", true);
      if (ra.divAnios || (ra.divYield > 0 && ra.divAnios === 0)) add("Dividendo en alza", ra.divAnios ? ra.divAnios + (ra.divAnios === 1 ? " año" : " años") : "No",
        "Años seguidos subiendo el dividendo anual", "", true);
      if (ra.nAnalistas && ra.target) add("Objetivo de analistas", "US$" + nf.format(ra.target),
        `${signo(ra.upside)} · ${ra.nAnalistas} analistas${ra.targetBajo && ra.targetAlto ? ` · entre ${nf.format(ra.targetBajo)} y ${nf.format(ra.targetAlto)}` : ""}`, "", true);
    }
    // beta: SIEMPRE con su R2 al lado. Una beta que explica el 3% de la
    // variación no dice nada, y sin el R2 se lee como si dijera todo.
    if (conRatios && ra && ra.beta != null) add("Beta (2 años)", ra.betaR2 != null && ra.betaR2 >= 0.10 ? n1.format(ra.beta) : "—",
      ra.betaR2 < 0.10 ? `No sigue al S&P (explica ${Math.round(ra.betaR2 * 100)}%)` : `El S&P explica el ${Math.round(ra.betaR2 * 100)}%`, "", true);
    if (conRatios && ra && ra.volAnual != null) add("Volatilidad", n1.format(ra.volAnual) + "%", "Anualizada, 2 años", "", true);

    const lock = !conRatios && fundOk ? `<div class="lock">
        <div class="preview-blur va-nums" aria-hidden="true">${["P/E últimos 12 meses", "Precio / Valor libro", "EV / EBITDA", "Flujo libre / precio",
          "Deuda / EBITDA", "Margen operativo", "Ventas vs. año anterior", "Precio justo"]
          .map(l => tarjeta({ l, v: "··,·", s: "Sector ··,·", c: "" })).join("")}</div>
        <div class="pro-overlay">${S.pro
          // sesión PRO pero el radar PRO no se pudo leer: no se le ofrece el plan que ya tiene
          ? `<h4>No pudimos leer los múltiplos ahora</h4>
          <p>Tu plan los incluye: probá recargar la página en un rato.</p>`
          : `<h4>Los múltiplos con la mediana del sector son PRO</h4>
          <p>P/E, EV/EBITDA, flujo libre, deuda, márgenes, crecimiento y el precio justo, cada uno frente a su familia.</p>
          <a href="/planes" class="btn">Ver planes</a>`}</div></div>` : "";
    const notaArs = conRatios && ra && ra.monedaBalance === "ARS"
      ? `<p class="va-nota-num">Balance en pesos: P/Ventas, EV/EBITDA, ingresos, ganancia y crecimiento no se publican porque mezclarían un precio en dólares con números en pesos.</p>` : "";
    const sinRadar = !ra ? `<p class="va-nota-num">Este activo todavía no está en el radar de valuación: por ahora van los números del precio.</p>` : "";
    return (vis.length ? `<div class="va-nums">${vis.map(tarjeta).join("")}</div>` : "")
      + lock
      + (mas.length ? `<details class="va-mas-num"><summary>Más números (${mas.length})</summary><div class="va-nums">${mas.map(tarjeta).join("")}</div></details>` : "")
      + notaArs + sinRadar
      + `<div class="va-tips-t">Lecturas automáticas</div><div class="tips">${tipsHtml()}</div>`;
  };

  // ── lecturas automáticas en una frase, con los datos de la ficha. Lo gratis
  // se arma con lo público; con PRO se suman las de valor. ──
  const tipsHtml = () => {
    const tips = [];
    const tip = (c, h) => tips.push(`<div class="tip ${c}"><i></i><div>${h}</div></div>`);
    if (r52 && px.p) {
      const dMax = (px.p / r52.max - 1) * 100, dMin = (px.p / r52.min - 1) * 100;
      if (dMax >= -5) tip("n", `<b>Cerca del máximo del año.</b> Cotiza a ${signo(dMax)} del techo de 52 semanas. Estar arriba en el año no dice si está cara: eso lo mide la lectura Valtia.`);
      else if (dMin <= 10) tip("n", `<b>Cerca del mínimo del año.</b> Está a ${signo(dMin)} del piso de 52 semanas. Que esté abajo en el año no significa que esté barata en valor: son lecturas distintas.`);
    }
    if (tec) tip(tec.score >= 1 ? "b" : tec.score <= -1 ? "m" : "n", `<b>${tec.label}.</b> ${tec.detalle.charAt(0).toUpperCase() + tec.detalle.slice(1)}. Es un resumen automático de indicadores: describe el precio, no dice qué hacer.`);
    if (ra && ra.entrada && tec && tec.score <= -1) tip("n", `<b>Valor y precio van por caminos distintos.</b> Frente a su familia cotiza barata, pero el precio viene en baja. Son dos lecturas automáticas distintas y ninguna es una recomendación.`);
    if (ra && ra.rsi != null && ra.rsi > 70) tip("m", `<b>Sobrecomprado.</b> RSI ${Math.round(ra.rsi)}: subió mucho en pocas ruedas. Después de subas así es común que el precio se tome un respiro, aunque no siempre pasa.`);
    else if (ra && ra.rsi != null && ra.rsi < 30) tip("b", `<b>Sobrevendido.</b> RSI ${Math.round(ra.rsi)}: cayó mucho en pocas ruedas. A veces rebota y a veces sigue cayendo, si hay un motivo de fondo.`);
    if (conVer()) tip(ra.veredicto === "Infravalorada" ? "b" : ra.veredicto === "Estirada" ? "m" : "n", `<b>${esc(ra.veredicto)} frente a su familia.</b> ${ra.score != null ? `Puntaje Valtia ${Math.round(ra.score)}/100: ` : ""}qué tan barata cotiza dentro de su estilo, no si es buena empresa.`);
    if (ra && ra.pierdePlata) tip("m", `<b>No gana plata.</b> ROE o margen neto negativos. El puntaje mide qué tan barata cotiza, no si el negocio es rentable.`);
    if (nivel()) tip(nivel() >= 4 ? "b" : nivel() <= 2 ? "m" : "n", `<b>Calidad: ${SALUD[nivel()].toLowerCase()} del radar.</b> Deuda frente a su familia, y crecimiento y margen frente al resto del radar${conRatios && ra.calidadScore != null ? ` (${Math.round(ra.calidadScore)}/100)` : ""}. Es una posición relativa, no un diagnóstico de la empresa.`);
    if (recoTxt()) tip(/buy/.test(ra.reco) ? "b" : /sell/.test(ra.reco) ? "m" : "n", `<b>Consenso de analistas: ${recoTxt().toLowerCase()}.</b> Promedio de las recomendaciones de ${conRatios && ra.nAnalistas ? ra.nAnalistas + " analistas" : "los analistas"} que cubren la acción, no una opinión de Valtia${conRatios && ra.target ? `; objetivo promedio US$${nf.format(ra.target)} (${signo(ra.upside)})` : ""}.`);
    if (ra && ra.divYield >= 0.1) tip("n", `<b>Paga dividendos.</b> ${dy(ra.divYield)} anual${conRatios && ra.divAnios ? `, y lo subió ${ra.divAnios} ${ra.divAnios === 1 ? "año" : "años"} seguidos` : ""}.`);
    if (conRatios && fundOk) {
      if (ra.justo) tip(ra.justoUpside >= 15 ? "b" : ra.justoUpside <= -15 ? "m" : "n", `<b>Precio justo US$${nf.format(ra.justo)} (${signo(ra.justoUpside)}).</b> Lo que valdría a los múltiplos medianos de su familia; entre ${nf.format(ra.justoMin)} y ${nf.format(ra.justoMax)} según el múltiplo. Es relativo: si toda la familia está cara, este número también.`);
      else if (ra.justoMotivo) tip("n", `<b>Sin precio justo.</b> ${motivoLargo(ra.justoMotivo)}`);
      if (ra.deudaEbitda != null) tip(ra.deudaEbitda < 1 ? "b" : ra.deudaEbitda > 3 ? "m" : "n", `<b>Deuda ${ra.deudaEbitda < 1 ? "baja" : ra.deudaEbitda > 3 ? "alta" : "manejable"}.</b> ${n1.format(ra.deudaEbitda)} años de EBITDA para cancelarla.`);
      if (ra.fcfy != null) tip(ra.fcfy >= 5 ? "b" : ra.fcfy < 0 ? "m" : "n", `<b>${ra.fcfy < 0 ? "Quema caja" : ra.fcfy >= 5 ? "Genera mucha caja" : "Genera caja"}.</b> FCF yield ${n1.format(ra.fcfy)}%: caja libre sobre lo que vale en bolsa.`);
      if (ra.roe != null) tip(ra.roe >= 20 ? "b" : ra.roe < 5 ? "m" : "n", `<b>ROE ${n1.format(ra.roe)}%.</b> ${ra.roe >= 20 ? "Rentabilidad alta" : ra.roe < 5 ? "Rentabilidad baja" : "Rentabilidad razonable"} sobre el patrimonio.`);
      if (ra.growth != null) tip(ra.growth >= 15 ? "b" : ra.growth < 0 ? "m" : "n", `<b>Ingresos ${ra.growth >= 0 ? "crecen" : "caen"} ${signo(ra.growth)}</b> interanual.`);
    } else if (fundOk && !S.pro) {
      tip("n", `<b>Con PRO</b> se suman las lecturas de precio justo, deuda, caja libre, ROE y crecimiento. <a href="/planes">Ver planes →</a>`);
    }
    return tips.length ? tips.join("") : '<div class="va-vacio">Sin lecturas todavía: faltan datos del radar para este activo.</div>';
  };

  // ── el último informe, destacado: portada, fecha, título, resumen, precio
  // en el informe y variación desde entonces ──
  pintarDestacado = () => {
    const d = S.inf;
    if (!emp.slug) return `<div class="va-dest">
        <div class="img" style="background-image:linear-gradient(135deg,#14213D,#B08A3E)" aria-hidden="true"></div>
        <div style="min-width:0"><div class="eb">Informe Valtia · próximamente</div>
          <div class="tt">Todavía no publicamos el informe de ${esc(emp.nombre)}</div>
          <p>Vamos sumando análisis fundamentales a pedido de los clientes: tesis, KPIs, valuación por año, FODA y riesgos. Si querés que ${esc(emp.nombre)} sea el próximo, decínoslo.</p>
          <div class="pie"><a class="va-link" href="mailto:soporte@valtia.tech?subject=Quiero%20el%20informe%20de%20${encodeURIComponent(emp.nombre)}">Pedir este análisis →</a><a class="va-link" href="/informes">Ver los publicados →</a></div>
        </div></div>`;
    const img = d && d.imagen ? String(d.imagen) : cover;
    if (!d) return `<div class="va-dest">
        <div class="img" style="background-image:url('${esc(cover)}')" aria-hidden="true"></div>
        <div style="min-width:0"><div class="eb">Informe Valtia · PRO</div>
          <div class="tt">Análisis fundamental de ${esc(emp.nombre)}</div>
          <p>Tesis, KPIs, valuación por año, FODA y riesgos. El informe completo es para clientes de Valtia.</p>
          <div class="pie">${S.user ? "" : `<a class="va-link" href="/?login=1">Ingresá con tu cuenta →</a>`}<a class="va-link" href="/planes">Ver planes →</a></div>
        </div></div>`;
    const f = fdate(d.fecha);
    const pp = Number(d.precio_pub) > 0 ? Number(d.precio_pub) : (esISO(f) ? cierreEn(f) : null);
    const dsd = pp && px.p ? (px.p / pp - 1) * 100 : null;
    return `<div class="va-dest">
        <a class="img" href="#informe" style="background-image:url('${esc(img)}')" aria-label="Leer el informe"></a>
        <div style="min-width:0">
          <div class="eb">Último informe · ${esc(fLarga(f))}${d.visibilidad === "publico" ? " · gratis" : ""}</div>
          <div class="tt">${esc(d.titulo)}</div>
          ${d.resumen ? `<p>${esc(d.resumen)}</p>` : ""}
          <div class="pie">${pp ? `<span class="pp">Precio en el informe <b>${usd(pp)}</b>${dsd != null ? ` · desde entonces <b class="${clase(dsd)}">${signo(dsd)}</b>` : ""}</span>` : ""}<a class="va-link" href="#informe">Leer informe →</a></div>
        </div></div>`;
  };

  // ── Precio: rangos, línea del activo, índice punteado y la fecha del informe ──
  const conVelas = filas.filter(r => r.ohlc).length >= 30;
  const anios = filas.length > 1 ? (Date.parse(filas[filas.length - 1].f) - Date.parse(filas[0].f)) / 864e5 / 365.25 : 0;
  // el histórico es de dos años: el último rango dice lo que de verdad cubre
  // (con "2A" se corta a 730 días si el histórico llega: misma base que "2
  // años" de la tabla de abajo; si no llega, va entero)
  const aniosR = Math.floor(anios + 0.1);
  const RANGOS = [["1M", 30], ["3M", 91], ["6M", 182], ["1A", 365],
    anios >= 4.5 ? ["5A", 1826] : anios >= 1.9 ? [aniosR + "A", filas[0].f <= haceDias(aniosR * 365) ? aniosR * 365 : 0] : ["Todo", 0]];
  const precioCard = `<section class="va-card" id="grafico">
      <div class="va-ch-top"><h2 class="va-h">Precio</h2>
        ${filas.length ? `<div class="va-sel">${conVelas ? `<span class="va-sel" id="tipo"><button type="button" data-t="linea" class="on" aria-pressed="true">Línea</button><button type="button" data-t="velas" aria-pressed="false">Velas</button></span><span class="va-sep" aria-hidden="true"></span>` : ""}
          <span class="va-sel" id="rangos">${RANGOS.map(([l, d]) => `<button type="button" data-d="${d}"${l === "6M" ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"'}>${l}</button>`).join("")}</span></div>` : ""}
      </div>
      <div class="va-chart"><canvas id="chart" role="img" aria-label="Precio de ${esc(emp.nombre)} contra ${esc(BENCH_NOM)}"></canvas></div>
      <div class="va-leg" id="va-leg"></div>
      <div id="desglose-periodos"></div>
    </section>`;

  const meta = metaDe([{ etf: "ETF", cripto: "Cripto", arg: "Acción argentina" }[emp.sector] || "Acción",
    (ra && sectorTxt(ra.sector)) || sectorN,
    emp.sector === "cripto" ? "Se opera las 24 h" : [BOLSA_NOM[BOLSA[t]], emp.sector === "arg" ? "BYMA" : ""].filter(Boolean).join(" y ")]);

  ficha.innerHTML = cabecera({ tk: t, nombre: emp.nombre, meta, precio: px.p ? usd(px.p) : "—", d: px.d != null ? px.d : null, hora: horaPrecio(ts) }) + `
  <div class="va-body"><div class="va-in">
    ${lecturaHtml(ra, !ra && tec ? tec.rsi : null)}
    <div id="mi-pos"></div>
    <div class="va-grid">
      <div class="va-col">
        ${precioCard}
        <section class="va-card" id="numeros">
          <h2 class="va-h" id="estadisticas">Los números</h2>
          <p class="va-sub">Lo que miro antes de decidir, con la mediana de su familia en el radar al lado cuando hay con quién comparar.</p>
          <div id="numeros-box">${numerosHtml()}</div>
        </section>
        <section class="va-card" id="escribimos">
          <div class="va-esc-top"><h2 class="va-h">Lo que escribimos sobre ${esc(t)}</h2><a class="va-link" href="/informes">Todos los informes →</a></div>
          <div id="escribimos-box"></div>
        </section>
      </div>
      <aside class="va-col" aria-label="Más sobre ${esc(t)}">
        ${columnaDerecha()}
      </aside>
    </div>
    <div id="informe-full"></div>
    ${DISCLAIMER}
  </div></div>`;

  // las partes que cambian cuando aparece el doc PRO (ver onAuthStateChanged)
  const repintarPro = () => {
    const el = document.getElementById("numeros-box");
    if (el) el.innerHTML = numerosHtml();
  };

  // ── cuánto rindió, por período (debajo del gráfico) ──
  // Es la variación del PRECIO, no "lo que ganaste": eso depende de cuándo
  // compraste y va en "Tu posición". El día sale del precio en vivo y el resto
  // de los cierres REALES del histórico, con la misma base que los rangos del
  // gráfico (el último cierre anterior al corte). desglosePeriodos ya no se
  // usa: lo calcula el sync con el cierre ajustado, que suma los dividendos
  // pagados (en KO, "1 año" daba +37 % contra +33 % del precio).
  (() => {
    const box = document.getElementById("desglose-periodos");
    if (!box) return;
    const anioAR = +hoyAR.slice(0, 4);
    const P = [["1 día", px.d], ["1 semana", varDesde(haceDias(7))], ["1 mes", varDesde(haceDias(30))], ["3 meses", varDesde(haceDias(91))],
               ["6 meses", seisM], ["En el año", varDesde(`${anioAR - 1}-12-31`)], ["1 año", varDesde(haceDias(365))], ["2 años", varDesde(haceDias(730))]];
    if (!P.some(([, v]) => v != null)) return;
    box.innerHTML = `<div class="va-rend">${P.map(([l, v]) => `<div class="r"><div class="rl">${l}</div>
        <div class="rv ${v == null ? "" : clase(v)}">${v == null ? "—" : signo(v)}</div></div>`).join("")}</div>
      <div class="va-rend-nota">Variación del precio en dólares, con los cierres tal como se operaron (sin sumar dividendos)${filas.length ? `, con datos desde el ${filas[0].f.split("-").reverse().join("/")}` : ""}.
        Si lo tenés en pesos (CEDEAR o acción local), el porcentaje de tu posición es otro: lo ves en Mi cartera.</div>`;
  })();

  // ── informe embebido en la ficha (una sola página por activo): /activo?t=X#informe ──
  const renderInforme = d => {
    const full = document.getElementById("informe-full");
    if (!full || !d) return;
    S.inf = d;
    pintarEscribimos();
    if (typeof S.redibujar === "function") S.redibujar();
    full.innerHTML = `<div class="fsr-reader" id="informe">
      <div class="fsr-rhead">
        <div style="display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap"><span class="fsr-badge">${esc(d.tipo || "Informe")}</span>${d.categorias ? `<span class="fsr-tag">${esc(d.categorias)}</span>` : ""}</div>
        <h1>${esc(d.titulo)}</h1>
        <div class="inf-meta" style="margin:12px 0 0">${venc(fdate(d.fecha))} · ${esc(d.autor || "Lautaro Cuitiño · Valtia Analytics")}</div>
      </div>
      ${d.contenido_html || ""}
    </div>`;
    if (location.hash === "#informe") full.scrollIntoView();
  };
  // informe vedado: sin sesión se invita a ingresar; con sesión (y sin PRO)
  // solo a los planes, porque ingresar ya no lo destapa
  const pintarVedado = () => {
    const full = document.getElementById("informe-full");
    if (!full || S.inf) return;
    full.innerHTML = `<div class="fsr-state" id="informe">El informe completo de ${esc(emp.nombre)} es exclusivo para clientes de Valtia.<br>
       ${S.user ? `Con tu plan actual no se puede leer: conocé los <a href="/planes">planes</a>.`
                : `<a href="/?login=1">Ingresá con tu cuenta</a> para leerlo — o conocé los <a href="/planes">planes</a>.`}</div>`;
  };
  if (inf) renderInforme(inf);
  else if (emp.slug) {
    pintarVedado();
    if (location.hash === "#informe") document.getElementById("informe").scrollIntoView();
  }
  // Con #informe la página baja al informe apenas se pinta, pero las cajas que
  // llegan después (carteras, cómo comprarlo, noticias) lo empujan hacia abajo:
  // mientras la persona no toque nada, se lo vuelve a buscar cada vez que la
  // ficha cambia de alto (como mucho 10 segundos).
  if (location.hash === "#informe" && "ResizeObserver" in window) {
    let movio = false;
    const hasta = Date.now() + 10000;
    ["wheel", "touchstart", "keydown", "mousedown"].forEach(ev => addEventListener(ev, () => { movio = true; }, { once: true, passive: true }));
    const ro = new ResizeObserver(() => {
      if (movio || Date.now() > hasta) { ro.disconnect(); return; }
      const el = document.getElementById("informe");
      if (el) el.scrollIntoView();
    });
    ro.observe(ficha);
  }

  montarTopRow();
  pintarEscribimos();
  llenarViene(cal, t);
  llenarNoticias(notSnap, S.claves, null);
  llenarCarteras(conRatios);
  llenarComo(null);
  llenarOtrosInformes(conRatios, emp.slug || null);

  // ── gráfico: línea del precio (cierres reales) contra el índice de
  // referencia rebasado al mismo punto de partida, o velas con volumen ──
  const canvas = document.getElementById("chart");
  if (filas.length > 1 && typeof Chart !== "undefined") {
    let chart = null, tipo = "linea", dias = 182;
    const bench = (() => {
      const b = benchSnap && benchSnap.exists() ? JSON.parse(benchSnap.data().json || "[]") : [];
      return b.map(p => [String(p[0]), Number(p.length > 6 && p[6] != null ? p[6] : p[1])]).filter(([f, v]) => esISO(f) && v > 0);
    })();
    // el índice en las fechas del activo (la cripto opera también el fin de semana: se arrastra el último cierre)
    const benchEn = datos => { const out = []; let j = 0, ult = null; for (const r of datos) { while (j < bench.length && bench[j][0] <= r.f) { ult = bench[j][1]; j++; } out.push(ult); } return out; };
    const fmtX = (f, d) => !esISO(f) ? f : d && d <= 91 ? fDM(f) : d && d <= 365 ? MES[+f.slice(5, 7) - 1] : `${MES[+f.slice(5, 7) - 1]} ${f.slice(2, 4)}`;
    const fmtY = usd0;
    const dibujar = () => {
      // los rangos se cortan por FECHA: la cripto cotiza todos los días y 126
      // filas no son 6 meses. Arranca en el último cierre anterior al corte,
      // la misma base que "6 meses" de la tabla de abajo.
      const desde = dias ? haceDias(dias) : "";
      const i0 = desde ? Math.max(0, filas.findIndex(r => r.f > desde) - 1) : 0;
      const datos = desde && filas[filas.length - 1].f <= desde ? filas.slice(-2) : filas.slice(i0);
      if (datos.length < 2) return;
      const labels = datos.map(r => r.f);
      const fInf = S.inf ? fdate(S.inf.fecha) : "";
      // un informe de hoy (o de un día sin rueda después del último cierre) va
      // en el último punto; uno anterior al rango no se dibuja
      const iInf = !esISO(fInf) || fInf < datos[0].f ? -1
        : fInf > datos[datos.length - 1].f ? datos.length - 1 : datos.findIndex(r => r.f >= fInf);
      if (chart) chart.destroy();
      const escalas = {
        x: { grid: { display: false }, border: { color: "#D9DCE1" },
             ticks: { color: "#8B8375", maxTicksLimit: 5, maxRotation: 0, autoSkipPadding: 18, font: { size: 12 },
                      callback: function (v) { return fmtX(this.getLabelForValue(v), dias); } } },
        y: { position: "left", beginAtZero: false, grace: "4%", grid: { color: "#F0F1F4" }, border: { display: false },
             ticks: { color: "#8B8375", maxTicksLimit: 5, font: { size: 12 }, callback: fmtY } },
      };
      const base = { responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false }, scales: escalas };
      const tooltip = { backgroundColor: "#0E1830", titleColor: "#E8CE96", bodyColor: "#fff", padding: 10, cornerRadius: 8,
                        titleFont: { weight: "600" }, displayColors: false };
      const c0 = datos[0].c, cN = datos[datos.length - 1].c;
      let bLinea = null, bAl = null, b0 = null;
      if (tipo === "linea") {
        bAl = benchEn(datos); b0 = bAl.find(v => v != null) || null;
        bLinea = b0 ? bAl.map(v => v == null ? null : v / b0 * c0) : null;
        chart = new Chart(canvas, { type: "line", plugins: [lineaInforme],
          data: { labels, datasets: [
            { data: datos.map(r => r.c), borderColor: "#14213D", borderWidth: 2.5, pointRadius: 0, pointHitRadius: 8,
              fill: "start", backgroundColor: "rgba(20,33,61,.06)", tension: 0, order: 1 },
            ...(bLinea ? [{ data: bLinea, borderColor: "#B9BEC8", borderWidth: 1.5, borderDash: [5, 4], pointRadius: 0,
              pointHitRadius: 0, fill: false, tension: 0, order: 2, spanGaps: true }] : []) ] },
          options: { ...base, plugins: { legend: { display: false }, tooltip: { ...tooltip,
            filter: it => it.datasetIndex === 0 || (!!bAl && bAl[it.dataIndex] != null), callbacks: {
            title: items => fLarga(items[0].label),
            label: ctx => ctx.datasetIndex === 0
              ? `${t} ${usd(ctx.raw)} (${signo((ctx.raw / c0 - 1) * 100)})`
              : bAl[ctx.dataIndex] != null ? `${BENCH_NOM} ${signo((bAl[ctx.dataIndex] / b0 - 1) * 100)}` : "" } } } } });
      } else {
        const vol = datos.map(r => r.v);
        const hayVol = vol.some(v => v > 0);
        const colores = datos.map(r => r.c >= r.o ? "#1F7A4D" : "#B23A3A");
        if (hayVol) escalas.y2 = { display: false, min: 0, max: Math.max(...vol) * 4 };
        chart = new Chart(canvas, { type: "bar", plugins: [lineaInforme],
          data: { labels, datasets: [
            { data: datos.map(r => [r.l, r.h]), backgroundColor: colores, grouped: false, order: 2, barPercentage: 0.16, categoryPercentage: 1, borderWidth: 0 },
            { data: datos.map(r => [Math.min(r.c, r.o), Math.max(r.c, r.o)]), backgroundColor: colores, grouped: false, order: 1, barPercentage: 0.72, categoryPercentage: 1, minBarLength: 1, borderWidth: 0 },
            ...(hayVol ? [{ type: "bar", yAxisID: "y2", order: 3, data: vol, grouped: false, barPercentage: 0.8, categoryPercentage: 1,
              backgroundColor: datos.map(r => r.c >= r.o ? "rgba(31,122,77,.16)" : "rgba(178,58,58,.16)") }] : []) ] },
          options: { ...base, plugins: { legend: { display: false }, tooltip: { ...tooltip, filter: it => it.datasetIndex === 1, callbacks: {
            title: items => fLarga(items[0].label),
            label: ctx => { const r = datos[ctx.dataIndex];
              return [`Apertura ${usd(r.o)}`, `Máximo ${usd(r.h)}`, `Mínimo ${usd(r.l)}`, `Cierre ${usd(r.c)}`]
                .concat(r.v ? [`Volumen ${compacto.format(r.v)}`] : []); } } } } } });
      }
      chart.$vaInforme = iInf;
      chart.update("none");
      // leyenda: activo, índice (en línea), fecha del informe y la variación del período
      const leg = document.getElementById("va-leg");
      if (leg) {
        const bN = bAl ? [...bAl].reverse().find(v => v != null) : null;
        leg.innerHTML = `<span><i style="height:2px;background:#14213D"></i>${esc(t)}</span>`
          + (bLinea ? `<span><i style="height:0;border-top:2px dashed #B9BEC8"></i>${esc(BENCH_NOM)}</span>` : "")
          + (iInf >= 0 ? `<span><i style="height:0;border-top:1px dashed #B08A3E"></i>Último informe de Valtia · ${esc(fLarga(fInf))}</span>`
             : esISO(fInf) ? `<span style="color:#8B8375">El último informe (${esc(fLarga(fInf))}) es anterior a este rango</span>` : "")
          + `<span class="per">En el período: <b class="${clase((cN / c0 - 1) * 100)}">${esc(t)} ${signo((cN / c0 - 1) * 100)}</b>${bLinea && b0 && bN ? ` · ${esc(BENCH.replace(/-.*/, ""))} ${signo((bN / b0 - 1) * 100)}` : ""}</span>`;
      }
    };
    S.redibujar = dibujar;
    dibujar();
    const marcar = (sel, b) => document.querySelectorAll(sel + " button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", String(x === b)); });
    document.querySelectorAll("#rangos button").forEach(b => b.addEventListener("click", () => { marcar("#rangos", b); dias = Number(b.dataset.d); dibujar(); }));
    document.querySelectorAll("#tipo button").forEach(b => b.addEventListener("click", () => { marcar("#tipo", b); tipo = b.dataset.t; dibujar(); }));
  } else if (canvas) {
    canvas.parentElement.innerHTML = '<div class="va-vacio">El histórico de precios se está generando — volvé en unos minutos.</div>';
  }

  // ── sesión: destape PRO, carteras PRO, informe, sentimiento y tu posición ──
  let primera = true;
  onAuthStateChanged(getAuth(app), async user => {
    S.user = user;
    pintarSentimiento(user);
    if (!user && primera) { primera = false; return; }   // sin sesión ya está todo pintado
    primera = false;
    let pro = false;
    if (user) {
      // destape PRO: los candados de esta ficha se crean DESPUÉS de que
      // nav-auth pinta (los datos llegan async), así que acá se re-aplica
      const esperar = ms => new Promise(r => setTimeout(r, ms));
      for (let i = 0; i < 20 && !window.valtiaEsPro; i++) await esperar(150);
      try { pro = !!(window.valtiaEsPro && await window.valtiaEsPro(user)); } catch (e) { pro = false; }
    }
    S.pro = pro;
    if (pro) {
      // el primer getDoc de radarPro pudo correr antes de que Firestore
      // conociera la sesión: se vuelve a pedir y se repintan las partes PRO
      if (!conRatios) {
        try {
          const s = await getDoc(doc(db, "radarPro", "latest"));
          if (s.exists()) { radarProDoc = JSON.parse(s.data().json || "{}"); armarRadar(); }
        } catch (e) {}
      }
      // con los múltiplos leídos el candado desaparece solo; si no se pudieron
      // leer, queda la muestra desenfocada con el aviso (sin destaparla: son
      // tarjetas de muestra, no datos)
      repintarPro();
    }
    // el getDoc inicial corre sin sesión: si el informe estaba vedado,
    // reintentar ahora que Firestore conoce al usuario
    if (user && emp.slug && !S.inf) {
      try {
        const s2 = await getDoc(doc(db, "informes", emp.slug));
        if (s2.exists()) renderInforme(s2.data());
      } catch (e) {}
      if (!S.inf) { pintarVedado(); pintarEscribimos(); }
    }
    llenarCarteras(pro);
    llenarComo(user);
    llenarTenencia(user, true);
    if (pro) llenarOtrosInformes(true, emp.slug || null);
  });
} catch (e) {
  ficha.innerHTML = '<div class="empty-state">No pudimos cargar la ficha. <a href="/informes">Volver a Informes</a></div>';
}
</script>
<script type="module" src="nav-auth.js?v=10"></script>
<script src="nav-menu.js?v=11"></script>
</body>
</html>
