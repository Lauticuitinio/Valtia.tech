<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de activo — Valtia Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Ficha de activo: todo lo del activo en un solo lugar ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#101010;--sub:#57534A;--mut:#8B8375;--navy:#0E1830;--gold:#B08A3E;--gold2:#8A6A2F;--line:#E7E3DA;--marfil:#F6F3EC;--up:#1F7A4D;--dn:#B23A3A}
html{scroll-behavior:smooth}
body{background:#fff;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink)}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}
img{max-width:100%}

nav{position:sticky;top:0;z-index:200;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;background:rgba(14,24,48,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,206,150,.14)}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:.06em;color:#fff}
.nav-name em{color:#E8CE96;font-style:italic}
.nav-sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.nav-links{display:flex;align-items:center;gap:26px}
.nav-links a{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.nav-links a:hover,.nav-links a.active{color:#E8CE96}
.nav-cta{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#0E1830;background:#E8CE96;padding:9px 22px;border-radius:8px;text-decoration:none}
.nav-cta:hover{background:#fff;color:#0E1830}
@media(max-width:880px){.nav-links{display:none}}

.wrap{max-width:1240px;margin:0 auto;padding:26px 52px 60px}

/* barra superior: volver + buscador de activos */
.top-row{display:flex;gap:16px;align-items:center;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.volver{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);white-space:nowrap;cursor:pointer}
.volver:hover{color:var(--gold)}
.bx{position:relative;flex:1;max-width:430px}
.bx input{width:100%;padding:11px 14px;border:1px solid var(--line);background:#fff;font:400 13.5px 'IBM Plex Sans',sans-serif;color:var(--ink);outline:none}
.bx input:focus{border-color:var(--gold)}
.bx-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);box-shadow:0 14px 40px rgba(16,16,16,.12);max-height:380px;overflow-y:auto;z-index:150;display:none}
.bx-panel.open{display:block}
.bx-g{font:700 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);padding:10px 14px 5px;background:var(--marfil)}
.bx-it{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;cursor:pointer;font:400 13px 'IBM Plex Sans',sans-serif}
.bx-it:hover{background:var(--marfil)}
.bx-it .tk{font:600 11px 'IBM Plex Mono',monospace;color:var(--mut)}

/* cabecera del activo */
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:24px}
.head .sec{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-bottom:8px}
.head h1{font:700 clamp(30px,3.4vw,42px) 'Playfair Display',serif;line-height:1.05}
.head h1 span{font:600 18px 'IBM Plex Mono',monospace;color:var(--mut);margin-left:12px}
.head .px{text-align:right}
.head .px .p{font:600 34px 'IBM Plex Sans',sans-serif;font-variant-numeric:tabular-nums}
.head .px .d{font:600 15px 'IBM Plex Sans',sans-serif;font-variant-numeric:tabular-nums}
.head .px .h{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--mut);margin-top:3px}
.up{color:var(--up)}.dn{color:var(--dn)}

/* ── ficha v2: estado, dos columnas, puntuación, rendimientos ── */
.head-meta{font:400 11.5px 'IBM Plex Sans',sans-serif;color:var(--mut);margin-top:8px}
.head .px .p{font-size:40px;line-height:1}
.head .px .d{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:4px;font-size:14px}
.head .px .d.up{background:#E4F3EA}.head .px .d.dn{background:#F8E5E5}
.estado{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:22px}
.estado .et{background:#fff;padding:14px 18px;min-width:0;position:relative;overflow:hidden}
.estado .l{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.estado .v{font:600 15px 'IBM Plex Sans',sans-serif;margin-top:7px;font-variant-numeric:tabular-nums}
.estado .s{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--sub);margin-top:5px;line-height:1.5}
.barra{position:relative;height:6px;background:var(--marfil);border-radius:3px;margin:11px 0 6px}
.barra i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:linear-gradient(90deg,#B23A3A,#B08A3E 50%,#1F7A4D)}
.barra i.neutra{background:linear-gradient(90deg,#E7E3DA,#B08A3E)}
.barra b{position:absolute;top:-4px;width:3px;height:14px;background:var(--navy);transform:translateX(-50%);border-radius:1px}
.barra-l{display:flex;justify-content:space-between;gap:6px;font:500 9.5px 'IBM Plex Mono',monospace;color:var(--mut)}
.ficha-grid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
.col-main>.card-w+.card-w,.col-side>.card-w+.card-w{margin-top:22px}
.rend{display:grid;grid-template-columns:repeat(8,1fr);border-top:1px solid var(--line)}
.rend .r{padding:10px 6px;text-align:center;border-right:1px solid var(--line);min-width:0}
.rend .r:last-child{border-right:none}
.rend .rl{font:600 8.5px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.rend .rv{font:600 13px 'IBM Plex Mono',monospace;margin-top:4px;font-variant-numeric:tabular-nums}
.rend-nota{padding:8px 18px 12px;font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--mut);line-height:1.5;border-top:1px solid var(--line)}
.punt{padding:4px 18px 8px;position:relative}
.punt .pr{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.punt .lock .pr:last-child{border-bottom:none}
.punt .pl{font:600 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.punt .pv{font:600 15px 'IBM Plex Sans',sans-serif;margin-top:3px}
.punt .ps{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--sub);margin-top:2px;line-height:1.45}
.gauge{width:84px;height:50px;display:block}
.stg{border-top:1px solid var(--line)}
.stg:first-child{border-top:none}
.stg-t{font:700 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);padding:12px 18px 8px}
.lock{position:relative}
@media(max-width:960px){.ficha-grid{grid-template-columns:minmax(0,1fr)}.rend{grid-template-columns:repeat(4,1fr)}.rend .r:nth-child(4){border-right:none}.estado{grid-template-columns:1fr 1fr}}

/* ── ficha v3: sub-navegación, rango del día, velas, salud, sentimiento, lo que importa ── */
.subnav{display:flex;gap:2px;margin:-6px 0 22px;border-bottom:1px solid var(--line);overflow:auto hidden;scrollbar-width:none}
.subnav a{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);padding:10px 14px;white-space:nowrap;border-bottom:2px solid transparent}
.subnav a:hover{color:var(--gold)}
.subnav a.on{color:var(--navy);border-bottom-color:var(--gold)}
.card-w,#general,#informe{scroll-margin-top:84px}
.head .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
.btn-acc{display:inline-block;font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;border:1px solid var(--navy);color:var(--navy);text-decoration:none;cursor:pointer;background:#fff}
.btn-acc.prim{background:var(--navy);color:#fff}
.btn-acc:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.estado .s b{color:var(--ink);font-weight:600}
.card-h .der{display:flex;align-items:center;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.rangos.tipo{margin-right:8px;padding-right:10px;border-right:1px solid var(--line)}
.salud{display:flex;gap:3px;margin:6px 0 5px;max-width:150px}
.salud i{flex:1;height:7px;background:var(--marfil);border-radius:2px}
.salud i.on{background:var(--up)}.salud.n1 i.on,.salud.n2 i.on{background:var(--dn)}.salud.n3 i.on{background:var(--gold)}
.sent{display:flex;gap:8px;margin-top:8px}
.sent button{flex:1;font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;padding:8px 6px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--sub)}
.sent button.alc.on{background:#E4F3EA;border-color:var(--up);color:var(--up)}
.sent button.baj.on{background:#F8E5E5;border-color:var(--dn);color:var(--dn)}
.sent button:hover{border-color:var(--gold)}
.sent button:disabled{opacity:.5;cursor:wait}
.sent-bar{display:flex;height:7px;margin-top:8px;border-radius:3px;overflow:hidden;background:var(--marfil)}
.sent-bar i{display:block;height:100%}
.tips{padding:4px 18px 8px}
.tip{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font:400 12.5px 'IBM Plex Sans',sans-serif;line-height:1.5;color:#2E2A24}
.tip:last-child{border-bottom:none}
.tip i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--mut)}
.tip.b i{background:var(--up)}.tip.m i{background:var(--dn)}.tip.n i{background:var(--gold)}
.tip b{color:var(--ink);font-weight:600}
@media(max-width:600px){.estado{grid-template-columns:1fr}.head .acc{justify-content:flex-start}.card-h{flex-wrap:wrap}.card-h .der{justify-content:flex-start}.rangos{flex-wrap:wrap}.rangos button{padding:5px 8px}.rangos.tipo{margin-right:2px;padding-right:6px}}

/* tu posición (solo cliente logueado con tenencia) */
.mi-pos{background:var(--marfil);border:1px solid var(--line);border-left:3px solid var(--gold);padding:15px 20px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:10px 36px;align-items:baseline}
.mi-pos .tt{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);width:100%}
.mi-pos .l{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.mi-pos .v{font:600 17px 'IBM Plex Mono',monospace;margin-top:3px;font-variant-numeric:tabular-nums}
.mi-pos .s{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--sub);margin-top:2px}

/* tarjetas */
.card-w{background:#fff;border:1px solid var(--line)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.card-h .t{font:700 12px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.card-h .s{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--mut)}

/* gráfico */
.chart-box{height:330px;position:relative;padding:16px}
.rangos{display:flex;gap:6px}
.rangos button{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;cursor:pointer;padding:5px 12px;border:1px solid var(--line);background:#fff;color:var(--sub)}
.rangos button.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* grilla radar + informe */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.dp-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin:18px 0}
.dp-t{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.dp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:12px}
.dp-chip{text-align:center}
.dp-l{font-size:10.5px;color:var(--muted);margin-bottom:4px}
.dp-v{font-family:'Cormorant Garamond',serif;font-size:21px;line-height:1}
.dp-v.pos{color:#4caf50}.dp-v.neg{color:#ef5350}
.dp-nota{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.stats .st{background:#fff;padding:14px 16px}
.stats .l{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.stats .v{font:600 16px 'IBM Plex Mono',monospace;margin-top:5px;font-variant-numeric:tabular-nums}
.stats .z{font:400 10px 'IBM Plex Sans',sans-serif;color:var(--sub);margin-top:2px}
.veredicto{position:relative;border-top:1px solid var(--line)}
.veredicto .inner{padding:18px}
.ver-tag{display:inline-block;font:700 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;color:#fff;background:var(--gold2)}
.ver-tag.infra{background:var(--up)}.ver-tag.cara{background:var(--dn)}
.scores{display:flex;gap:22px;margin-top:14px}
.scores .sc{flex:1}
.scores .n{font:600 20px 'IBM Plex Mono',monospace}
.scores .e{font:400 10px 'IBM Plex Sans',sans-serif;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.entrada{margin-top:12px;font:600 12px 'IBM Plex Sans',sans-serif;color:var(--up)}
.preview-blur{filter:blur(6px);pointer-events:none;user-select:none}
.pro-overlay{position:absolute;inset:0;background:rgba(246,243,236,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:5}
.pro-overlay h4{font:400 19px 'Playfair Display',serif}
.pro-overlay p{font-size:12px;color:var(--sub);max-width:250px;text-align:center;line-height:1.5}
.pro-overlay .btn{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#fff;padding:9px 20px}

/* informe */
.inf-cover{display:block}
.inf-cover img{width:100%;display:block}
.inf-body{padding:16px 18px}
.inf-body h3{font:700 19px 'Playfair Display',serif;line-height:1.25;margin-bottom:8px}
.inf-body p{font:400 12.5px 'IBM Plex Sans',sans-serif;color:var(--sub);line-height:1.65;margin-bottom:12px}
.inf-meta{font:500 10px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.inf-desde{font:600 13px 'IBM Plex Sans',sans-serif;margin-bottom:14px;font-variant-numeric:tabular-nums}
.btn-leer{display:inline-block;font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;background:#0E1830;color:#fff;padding:11px 22px}
.btn-leer:hover{background:var(--gold);color:#fff}
.badge{font:700 9px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px}
.b-free{background:#E4F3EA;color:var(--up)}.b-cli{background:#0E1830;color:#E8CE96}

/* noticias del activo */
.act-news{margin-top:22px}
.act-news a{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);color:var(--ink);align-items:center}
.act-news a:last-child{border-bottom:none}
.act-news .im{aspect-ratio:16/10;background:linear-gradient(135deg,#14213D,#B08A3E);background-size:cover;background-position:center}
.act-news .tt{font:600 14px 'IBM Plex Sans',sans-serif;line-height:1.4}
.act-news a:hover .tt{text-decoration:underline;text-decoration-color:rgba(176,138,62,.55);text-underline-offset:3px}
.act-news .f{font:500 10px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.vacio{padding:22px 18px;font:400 12.5px 'IBM Plex Sans',sans-serif;color:var(--mut)}

.empty-state{padding:80px 52px;text-align:center;font:400 15px 'IBM Plex Sans',sans-serif;color:var(--sub)}


/* ── estilos del lector de informes (compartidos con informes.html) ── */
.fsr-badge{font:600 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;background:var(--gold);color:#fff;padding:4px 10px;text-transform:uppercase}
.fsr-tag{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;border:1px solid var(--line);padding:3px 8px;color:var(--sub);text-transform:uppercase}
.fsr-state{border:1px dashed var(--line);text-align:center;padding:44px 20px;color:var(--sub);line-height:1.9;font-size:14px}
/* lector de registros (research completo) — clases usadas por el módulo */
.fsr-crumb{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-bottom:22px}
.fsr-crumb a{color:var(--sub)}
.fsr-crumb a:hover{color:var(--gold)}
.fsr-reader{background:#fff;border:1px solid var(--line);padding:clamp(24px,4vw,50px);max-width:860px;margin:0 auto}
.fsr-rhead{border-bottom:2px solid var(--gold);padding-bottom:22px;margin-bottom:8px}
.fsr-rhead h1{font:700 clamp(28px,4vw,40px) 'Playfair Display',serif;line-height:1.15;color:var(--ink)}
.fsr-rhead .meta{font:500 11px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:12px}
.fsr-reader h2{font:700 26px 'Playfair Display',serif;margin:42px 0 14px;padding-top:26px;border-top:1px solid var(--line);color:var(--ink)}
.fsr-reader h3{font:600 15.5px 'IBM Plex Sans',sans-serif;margin:24px 0 8px;color:var(--ink)}
.fsr-reader p{margin:11px 0;font-size:14.5px;line-height:1.85;color:#2E2A24}
.fsr-reader p strong,.fsr-reader li strong{color:var(--ink);font-weight:600}
.fsr-reader ul{margin:10px 0 10px 22px}
.fsr-reader li{margin:7px 0;font-size:14px;line-height:1.8;color:#2E2A24}
.fsr-reader .kicker{color:var(--mut);font-style:italic}
.fsr-reader .tag{display:inline-block;font:600 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--gold);padding:3px 9px;margin:18px 0 4px}
.fsr-reader .tag.bull{background:#1F7A4D}
.fsr-reader .tag.bear{background:#B23A3A}
.fsr-reader .tag.neutral{background:#b7791f}
.fsr-reader .fecha{font:500 11px 'IBM Plex Sans',sans-serif;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.fsr-reader table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px;display:block;overflow-x:auto}
.fsr-reader th{text-align:left;background:var(--marfil);color:var(--ink);padding:10px 12px;font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.fsr-reader td{padding:10px 12px;border-bottom:1px solid var(--line);color:#2E2A24;vertical-align:top;line-height:1.7;min-width:130px}
.fsr-reader td strong{color:var(--ink)}
.fsr-reader .card{background:var(--marfil);border:1px solid var(--line);border-left:3px solid var(--gold);padding:16px 20px;margin:18px 0;font-size:13.5px;line-height:1.8;color:#2E2A24}
.fsr-reader .card.warn{border-left-color:#b7791f}
.fsr-reader .card.risk{border-left-color:#B23A3A}
.fsr-reader .card.ok{border-left-color:#1F7A4D}
.fsr-reader .card strong{color:var(--ink)}
.fsr-reader .disclaimer{margin-top:44px;padding:18px 22px;background:var(--marfil);font-size:11.5px;color:var(--mut);line-height:1.7}
/* KPIs del informe (tiles) */
.fsr-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 8px}
.fsr-kpi{background:var(--marfil);border:1px solid var(--line);padding:12px 14px;min-width:0}
.fsr-kpi .l{font:600 8.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.fsr-kpi .v{font:600 15.5px 'IBM Plex Mono',monospace;color:var(--ink);white-space:nowrap}
.fsr-kpi .s{font-size:10px;color:var(--sub);margin-top:3px;line-height:1.4}
@media(max-width:700px){.fsr-kpis{grid-template-columns:repeat(2,1fr)}}

/* barras de valuación por año */
.fsr-bars{display:flex;gap:12px;align-items:flex-end;height:130px;margin:18px 0 4px;padding:0 2px}
.fsr-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.fsr-bar .col{width:100%;max-width:66px;background:#B08A3E;min-height:4px}
.fsr-bar.est .col{background:repeating-linear-gradient(45deg,#B08A3E,#B08A3E 5px,#D9BE85 5px,#D9BE85 10px)}
.fsr-bar .n{font:600 11px 'IBM Plex Mono',monospace;color:var(--ink)}
.fsr-bar .y{font:600 9.5px 'IBM Plex Sans',sans-serif;color:var(--mut)}
.fsr-caption{font-size:10.5px;color:var(--mut);margin:6px 0 18px}

/* rango de precios objetivos del consenso */
.fsr-rango{margin:20px 0 8px}
.fsr-rango .track{position:relative;height:8px;background:linear-gradient(90deg,#E7E3DA,#B08A3E)}
.fsr-rango .mark{position:absolute;top:-6px;width:3px;height:20px;background:#0E1830}
.fsr-rango .mark span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:700 10px 'IBM Plex Mono',monospace;color:#0E1830;white-space:nowrap}
.fsr-rango .labels{display:flex;justify-content:space-between;font:500 10px 'IBM Plex Mono',monospace;color:var(--sub);margin-top:8px}

/* FODA 2×2 */
.fsr-foda{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.fsr-foda .q{border:1px solid var(--line);border-top:3px solid var(--c);padding:14px 16px;min-width:0}
.fsr-foda h4{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin:0 0 8px;border:none;padding:0}
.fsr-foda ul{margin:0 0 0 16px}
.fsr-foda li{font-size:12.5px;line-height:1.65;color:#2E2A24;margin:6px 0}
@media(max-width:700px){.fsr-foda{grid-template-columns:1fr}}

footer{background:#0B1327;padding:28px 52px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:46px}
.footer-copy{font:400 11px 'IBM Plex Sans',sans-serif;color:rgba(255,255,255,.35)}
.footer-links{display:flex;gap:20px}
.footer-links a{font:500 11px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.55);text-transform:uppercase}
.wa-float{position:fixed;bottom:28px;left:28px;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:100;transition:transform .2s;text-decoration:none}
.wa-float:hover{transform:scale(1.1)}

@media(max-width:960px){.dos{grid-template-columns:1fr}}
@media(max-width:880px){.wrap,footer{padding-left:20px;padding-right:20px}}
@media(max-width:600px){.head .px{text-align:left}.stats{grid-template-columns:1fr 1fr}}

<script type="module">
/* ── Ficha de activo: precio + gráfico + radar + informe + noticias ── */
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, query, where, getCountFromServer, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { EMPRESAS, SECTORES } from './empresas.js?v=3';
import { radarSym, tickerFicha, mergeRadar } from './activos.js?v=6';

const app = getApps().length ? getApp() : initializeApp({
  apiKey: 'AIzaSyCxKNw0995b8a7XXyENiMjDQbfRCe9IBlw',
  authDomain: 'valtia-analytics.firebaseapp.com',
  projectId: 'valtia-analytics',
});
const db = getFirestore(app);

// símbolo del radar: radarSym() de activos.js (PAM -> PAMP, YPF -> YPFD)
const t = (new URLSearchParams(location.search).get("t") || "NVDA").toUpperCase();
const emp = EMPRESAS.find(e => e.ticker === t);
const ficha = document.getElementById("ficha");
if (!emp) location.replace("informes.html");

const nf = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const n1 = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const compacto = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
// se redondea antes de formatear: -0,04 no puede verse como "-0,0%" en rojo
const r1 = v => Math.round(v * 10) / 10 || 0;
const signo = v => { v = r1(v); return (v > 0 ? "+" : "") + n1.format(v) + "%"; };
const clase = v => r1(v) > 0 ? "up" : r1(v) < 0 ? "dn" : "";
const venc = v => v ? `${String(v).slice(8, 10)}/${String(v).slice(5, 7)}/${String(v).slice(2, 4)}` : "";
const fdate = v => v && v.toDate ? v.toDate().toISOString().slice(0, 10) : String(v || "").slice(0, 10);

document.title = `${emp.nombre} (${t}) — Valtia Analytics`;
const sectorN = (SECTORES.find(s => s.k === emp.sector) || {}).n || "";

try {
  const [pxSnap, histSnap, radarSnap, radarProSnap, infSnap, notSnap, desgSnap, calSnap] = await Promise.all([
    getDoc(doc(db, "preciosInformes", "latest")).catch(() => null),
    getDoc(doc(db, "historialInformes", t)).catch(() => null),
    getDoc(doc(db, "radar", "latest")).catch(() => null),
    getDoc(doc(db, "radarPro", "latest")).catch(() => null),   // 403 si no es cliente
    emp.slug ? getDoc(doc(db, "informes", emp.slug)).catch(() => null) : Promise.resolve(null),
    getDocs(query(collection(db, "noticias"), where("estado", "==", "publicado"))).catch(() => null),
    getDoc(doc(db, "desglosePeriodos", "latest")).catch(() => null),
    getDoc(doc(db, "calendario", "latest")).catch(() => null),
  ]);

  // precio en vivo: p y d, y desde la ficha v3 también apertura (o), rango
  // del día (h/l), cierre anterior (pc), volumen (v), volumen promedio 3M
  // (vp), 52 semanas (h52/l52) y medias de 50 y 200 ruedas (s50/s200)
  const precios = pxSnap && pxSnap.exists() ? JSON.parse(pxSnap.data().json || "{}") : {};
  const px = precios[t] || {};
  const ts = pxSnap && pxSnap.exists() ? pxSnap.data().actualizado_utc : null;
  const hora = ts && ts.toDate ? ts.toDate().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false }) : "";

  // radar: lo público (veredicto, precio, RSI, recomendación, salud) más lo
  // PRO (múltiplos, fundamentals, objetivo, precio justo) cuando las reglas
  // dejaron leerlo. Va en una función porque el primer getDoc puede correr
  // antes de que Firestore conozca la sesión: al detectar PRO se vuelve a
  // pedir el doc y se repintan las partes que dependen de él.
  const radarPub = radarSnap && radarSnap.exists() ? JSON.parse(radarSnap.data().json || "{}") : {};
  let radarProDoc = radarProSnap && radarProSnap.exists() ? JSON.parse(radarProSnap.data().json || "{}") : null;
  let ra = null, conRatios = false;
  const armarRadar = () => {
    const _m = mergeRadar(radarPub, radarProDoc);
    conRatios = _m.pro;
    ra = (_m.activos || []).find(a => a.sym === radarSym(t)) || null;
  };
  armarRadar();

  // informe (si las reglas lo dejan leer; si no, tarjeta genérica bloqueada)
  const inf = infSnap && infSnap.exists() ? infSnap.data() : null;
  const cover = `img/${emp.slug}.svg`;

  // histórico (2 años): cada fila es [fecha, cierre, apertura, máximo,
  // mínimo, volumen]; los docs viejos traen solo [fecha, cierre]
  const serie = histSnap && histSnap.exists() ? JSON.parse(histSnap.data().json || "[]") : [];
  // la vela de HOY: el histórico se baja una vez por día (con el cierre de
  // ayer). Si el precio en vivo es de hoy, se suma la vela de la rueda en curso.
  (() => {
    const diaAr = d => new Date(d.getTime() - 3 * 3600e3).toISOString().slice(0, 10);
    const tsDia = ts && ts.toDate ? diaAr(ts.toDate()) : null;
    const ultFila = serie.length ? serie[serie.length - 1] : null;
    if (tsDia && ultFila && ultFila.length >= 5 && tsDia === diaAr(new Date()) && String(ultFila[0]) < tsDia
        && px.p > 0 && px.o > 0 && px.h > 0 && px.l > 0)
      serie.push([tsDia, px.p, px.o, Math.max(px.h, px.p, px.o), Math.min(px.l, px.p, px.o), px.v || 0]);
  })();
  const haceDias = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
  const ult52 = serie.filter(p => String(p[0]) >= haceDias(365)).map(p => Number(p[1])).filter(v => isFinite(v) && v > 0);
  // 52 semanas: del precio en vivo (incluye el intradía) si el sync ya lo
  // publica; si no, de los cierres del histórico
  const r52 = (() => {
    const min = Number(px.l52) || (ult52.length >= 20 ? Math.min(...ult52) : 0);
    const max = Number(px.h52) || (ult52.length >= 20 ? Math.max(...ult52) : 0);
    if (!(min > 0 && max >= min)) return null;
    return { min, max, pos: px.p && max > min ? Math.max(0, Math.min(100, (px.p - min) / (max - min) * 100)) : null };
  })();
  const cierre = i => serie.length > i ? Number(serie[serie.length - 1 - i][1]) : null;
  const seisM = (() => {
    let ancla = null;
    for (const p of serie) { if (String(p[0]) <= haceDias(182)) ancla = Number(p[1]); else break; }
    return ancla && cierre(0) ? (cierre(0) / ancla - 1) * 100 : null;
  })();

  // ── rango del día, medias móviles y análisis técnico ──
  // El rango, la apertura, el cierre anterior y el volumen vienen del mismo
  // fast_info que el precio (cero costo). Las medias y el MACD se calculan
  // acá con el histórico público: no hay nada que ocultar.
  // la cripto publica el rango de la rueda UTC pero el precio corre las 24 h:
  // si el precio se escapó del rango, el rango se estira hasta el precio
  const dia = px.h > 0 && px.l > 0 && px.h >= px.l ? (() => {
    const min = px.p > 0 ? Math.min(px.l, px.p) : px.l, max = px.p > 0 ? Math.max(px.h, px.p) : px.h;
    return { min, max, pos: px.p > 0 && max > min ? (px.p - min) / (max - min) * 100 : 50 };
  })() : null;
  const esCripto = /^(BTC|ETH)$/.test(t);
  const volTxt = v => (esCripto ? "US$" : "") + compacto.format(v);
  // ETF y cripto están en el radar (precio, RSI) pero no tienen balance:
  // sin veredicto no se muestran filas de fundamentals vacías
  const fundOk = !!(ra && ra.veredicto && ra.veredicto !== "Sin cobertura");
  const cierres = serie.map(p => Number(p[1])).filter(v => isFinite(v) && v > 0);
  const sma = n => cierres.length >= n ? cierres.slice(-n).reduce((a, b) => a + b, 0) / n : null;
  const s20 = sma(20), s50 = Number(px.s50) || sma(50), s200 = Number(px.s200) || sma(200);
  const tec = (() => {
    if (cierres.length < 60) return null;
    // las medias se comparan contra el precio en vivo, igual que en Estadísticas
    const ult = px.p > 0 ? px.p : cierres[cierres.length - 1];
    let rsi = ra && ra.rsi != null ? Number(ra.rsi) : null;
    if (rsi == null) {
      let g = 0, l = 0;
      for (let i = cierres.length - 14; i < cierres.length; i++) { const d = cierres[i] - cierres[i - 1]; if (d > 0) g += d; else l -= d; }
      rsi = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    const ema = (xs, n) => { const k = 2 / (n + 1); let e = xs[0]; const out = [e]; for (let i = 1; i < xs.length; i++) { e = xs[i] * k + e * (1 - k); out.push(e); } return out; };
    const e12 = ema(cierres, 12), e26 = ema(cierres, 26);
    const macd = e12.map((v, i) => v - e26[i]);
    const senal = ema(macd, 9);
    const histo = macd[macd.length - 1] - senal[senal.length - 1];
    const sig = [];
    const medias = [[20, s20], [50, s50], [200, s200]].filter(([, m]) => m);
    const arriba = medias.filter(([, m]) => ult > m).map(([n]) => n), abajo = medias.filter(([, m]) => ult <= m).map(([n]) => n);
    if (arriba.length) sig.push({ v: arriba.length, t: `sobre la media de ${arriba.join(", ")} ruedas` });
    if (abajo.length) sig.push({ v: -abajo.length, t: `bajo la media de ${abajo.join(", ")} ruedas` });
    // mismas zonas que el radar (35 / 50 / 65) para que la ficha no se
    // contradiga. Los extremos no suman ni restan (pueden seguir o revertir)
    // y entre 45 y 55 el RSI no dice nada.
    const zr = rsi < 35 ? "sobrevendido" : rsi < 50 ? "débil" : rsi <= 65 ? "firme" : "sobrecomprado";
    sig.push({ v: rsi >= 55 && rsi <= 65 ? 1 : rsi >= 35 && rsi <= 45 ? -1 : 0, t: `RSI ${Math.round(rsi)} ${zr}` });
    sig.push(histo >= 0 ? { v: 1, t: "MACD positivo" } : { v: -1, t: "MACD negativo" });
    const score = sig.reduce((a, s) => a + s.v, 0);        // -5 … 5
    // tendencia, no orden: el resumen describe los indicadores, no dice qué hacer
    const label = score >= 3 ? "Señales mayormente alcistas" : score >= 1 ? "Sesgo alcista" : score <= -3 ? "Señales mayormente bajistas" : score <= -1 ? "Sesgo bajista" : "Señales mixtas";
    return { score, label, rsi, detalle: sig.map(s => s.t).join(" · "), gauge: (score + 5) / 10 * 100 };
  })();
  const RECO = { strong_buy: "Compra fuerte", buy: "Compra", hold: "Mantener", sell: "Venta", strong_sell: "Venta fuerte" };
  // por qué no hay precio justo (lo decide el pipeline, radar_core.radar_calcular)
  const MOTIVO = {
    moneda: ["balance en otra moneda", "El balance está en otra moneda que la cotización: los múltiplos mezclarían monedas y el número engañaría."],
    sin_ganancias: ["sin ganancias para comparar", "No tiene ganancias ni EBITDA positivos suficientes para compararla con su familia."],
    pocos_multiplos: ["pocos comparables", "Hay pocos múltiplos o pocos pares comparables para estimarlo con solidez."],
    contradictorio: ["múltiplos contradictorios", "Sus múltiplos cuentan historias opuestas: por uno parece barata y por otro cara. Un promedio escondería esa diferencia."],
    extremo_caro: ["muy por encima de su familia", "Cotiza muy por encima de su familia en todos los múltiplos. Con una distancia así, un número de precio justo sería más ruido que información."],
    extremo_barato: ["muy por debajo de su familia", "Cotiza muy por debajo de su familia en todos los múltiplos. Suele haber un motivo (riesgo, ciclo, otro tipo de negocio) que un múltiplo no captura."],
  };
  const motivoCorto = m => (MOTIVO[m] || ["sin precio justo publicado"])[0];
  const motivoLargo = m => (MOTIVO[m] || [null, "No hay precio justo publicado para este activo."])[1];
  const zona = z => z === "Debil" ? "Débil" : (z || "");
  const dy = v => (v > 0 && v < 1 ? nf : n1).format(v) + "%";
  // valor razonable en el medidor: -60 % a la izquierda, 0 al centro, +150 % a la derecha
  const gaugeJusto = up => up == null ? null : up < 0 ? 50 + Math.max(-60, up) / 60 * 50 : 50 + Math.min(150, up) / 150 * 50;
  const RECO_G = { strong_buy: 92, buy: 72, hold: 50, sell: 30, strong_sell: 8 };
  const recoTxt = () => ra && RECO[ra.reco] ? RECO[ra.reco] : null;
  // posición relativa dentro del radar (quintiles), no un diagnóstico de la empresa
  const SALUD = [null, "Entre las más bajas", "Por debajo del medio", "En el medio", "Por encima del medio", "Entre las más altas"];
  const nivel = () => ra && ra.calidadNivel >= 1 && ra.calidadNivel <= 5 ? Math.round(ra.calidadNivel) : null;
  const saludHtml = n => n ? `<div class="salud n${n}">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</div>` : "";
  const usdC = v => v == null || !isFinite(v) ? "—" : (v < 0 ? "−" : "") + "US$" + compacto.format(Math.abs(v));
  const numC = v => v == null || !isFinite(v) ? "—" : compacto.format(v);
  const cal = (() => { try { return calSnap && calSnap.exists() ? (JSON.parse(calSnap.data().json || "{}").earnings || []) : []; } catch (e) { return []; } })();
  // días calendario de Argentina: "hoy" solo el mismo día y nunca una fecha pasada
  const hoyAR = new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
  const proxRes = cal.find(e => (e.ficha === t || e.sym === radarSym(t) || e.sym === t) && String(e.fecha) >= hoyAR) || null;
  const enDias = f => Math.round((Date.parse(f) - Date.parse(hoyAR)) / 864e5);

  // estadísticas, agrupadas como se leen: mercado (gratis), y con PRO la
  // valuación, la rentabilidad y la solidez. Sin PRO esos números NO
  // viajaron al navegador: se explica el límite, no se tapa con blur.
  const fila = (l, v, z) => `<div class="st"><div class="l">${l}</div><div class="v">${v}</div>${z ? `<div class="z">${z}</div>` : ""}</div>`;
  const grupo = (tit, filas) => filas.length ? `<div class="stg"><div class="stg-t">${tit}</div><div class="stats">${filas.join("")}</div></div>` : "";
  const pct1 = v => v == null ? "—" : signo(v);
  const desdeMedia = m => m && px.p ? `precio ${signo((px.p / m - 1) * 100)} respecto de la media` : "";
  // sin acceso PRO los múltiplos NO están en la página: no hay blur que
  // sacar con devtools ni JSON que pedir por REST — el dato no viajó
  const proHtml = `<div class="stg" style="text-align:center;padding:22px 18px">
      <div style="font:400 20px 'Playfair Display',serif;color:var(--text)">Los números detrás de la lectura son PRO</div>
      <p style="font-size:12.5px;color:var(--sub);max-width:420px;margin:6px auto 12px;line-height:1.6">
        El precio, el rango, el volumen, la lectura, la calidad relativa y el consenso de los analistas son gratis. Con PRO ves
        PER, P/Libro, EV/EBITDA, FCF yield, ROE, ROA, ingresos, ganancia, BPA, deuda, beta, el precio justo y el objetivo de los analistas.</p>
      <a class="btn" href="planes.html" style="display:inline-block;font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#fff;padding:10px 22px;text-decoration:none;border-radius:4px">Ver planes</a>
    </div>`;
  // beta: SIEMPRE con su R2 al lado. Una beta que explica el 3% de la
  // variación no dice nada, y sin el R2 se lee como si dijera todo.
  const filaBeta = () => fila("Beta (2 años)",
    ra.beta != null && ra.betaR2 != null && ra.betaR2 >= 0.10 ? n1.format(ra.beta) : "—",
    ra.beta == null ? "" : ra.betaR2 < 0.10
      ? "no sigue al S&P (explica " + Math.round(ra.betaR2 * 100) + "%)"
      : "el S&P explica el " + Math.round(ra.betaR2 * 100) + "%");
  const filaVol = () => fila("Volatilidad", ra.volAnual != null ? n1.format(ra.volAnual) + "%" : "—", "anualizada, 2 años");
  const statsHtml = () => !ra ? '<div class="vacio">Este activo todavía no está en el radar de valuación.</div>' : grupo("Precio y mercado", [
      fila("Último precio", px.p ? "US$" + nf.format(px.p) : "—", hora ? "actualizado " + hora + " hs" : ""),
      fila("Hoy", px.d != null ? `<span class="${clase(px.d)}">${signo(px.d)}</span>` : "—", "contra el cierre anterior"),
      fila("Cierre anterior", px.pc ? "US$" + nf.format(px.pc) : "—", ""),
      fila("Apertura", px.o ? "US$" + nf.format(px.o) : "—", ""),
      fila("Rango del día", dia ? `${nf.format(dia.min)} – ${nf.format(dia.max)}` : "—", "mínimo y máximo de la rueda"),
      fila("52 semanas", r52 ? `${nf.format(r52.min)} – ${nf.format(r52.max)}` : "—", "mínimo y máximo, en dólares"),
      fila("Volumen", px.v ? volTxt(px.v) : "—", esCripto ? "en dólares, en el día (UTC)" : "acumulado de la rueda"),
      fila("Vol. promedio 3M", px.vp ? volTxt(px.vp) : "—", px.v && px.vp ? `hoy lleva ${Math.round(px.v / px.vp * 100)}% de un día promedio` : "por día"),
      fila("Market cap", ra.mktcap ? "US$" + compacto.format(ra.mktcap) : "—", ""),
      fila("Div. yield", ra.divYield != null ? dy(ra.divYield) : "—", ra.divYield > 0 ? "dividendo anual / precio" : ""),
      fila("RSI (14)", ra.rsi != null ? n1.format(ra.rsi) : "—", esc(zona(ra.rsiZona))),
      fila("Media 50 ruedas", s50 ? "US$" + nf.format(s50) : "—", desdeMedia(s50)),
      fila("Media 200 ruedas", s200 ? "US$" + nf.format(s200) : "—", desdeMedia(s200)),
      ...(fundOk ? [fila("Próximos resultados", proxRes ? venc(proxRes.fecha) : "—", proxRes ? (enDias(proxRes.fecha) === 0 ? "hoy" : enDias(proxRes.fecha) === 1 ? "mañana" : `en ${enDias(proxRes.fecha)} días`) : "sin fecha publicada")] : []),
    ]) + (conRatios && !fundOk ? grupo("Riesgo", [filaBeta(), filaVol()])
      + `<div class="stg"><div class="vacio">${esc(emp.nombre)} no tiene balance que valuar (es un ETF o una cripto): no hay múltiplos, precio justo ni calidad relativa.</div></div>`
    : conRatios ? grupo("Valuación", [
      fila("P/E", ra.per != null ? n1.format(ra.per) + "x" : "—", "precio / ganancias"),
      fila("P/Libro", ra.pb != null ? n1.format(ra.pb) + "x" : "—", ""),
      fila("P/Ventas", ra.ps != null ? n1.format(ra.ps) + "x" : "—", ""),
      fila("EV/EBITDA", ra.evebitda != null ? n1.format(ra.evebitda) + "x" : "—", "valor empresa / EBITDA"),
      fila("FCF yield", ra.fcfy != null ? n1.format(ra.fcfy) + "%" : "—", "caja libre / market cap"),
      fila("Precio justo", ra.justo ? "US$" + nf.format(ra.justo) : "—", ra.justo ? `${signo(ra.justoUpside)} · entre ${nf.format(ra.justoMin)} y ${nf.format(ra.justoMax)} según el múltiplo` : motivoCorto(ra.justoMotivo)),
    ]) + grupo("Rentabilidad y crecimiento", [
      fila("ROE", ra.roe != null ? n1.format(ra.roe) + "%" : "—", "ganancia / patrimonio"),
      fila("ROA", ra.roa != null ? n1.format(ra.roa) + "%" : "—", "ganancia / activos"),
      fila("Margen operativo", ra.margen != null ? n1.format(ra.margen) + "%" : "—", ""),
      fila("Margen neto", ra.margenNeto != null ? n1.format(ra.margenNeto) + "%" : "—", ""),
      fila("Crec. ingresos", pct1(ra.growth), "interanual"),
      fila("Ingresos", usdC(ra.ingresos), "últimos 12 meses"),
      fila("Ganancia neta", usdC(ra.gananciaNeta), "últimos 12 meses"),
      fila("EBITDA", usdC(ra.ebitda), "últimos 12 meses"),
      fila("BPA", ra.eps != null ? "US$" + nf.format(ra.eps) : "—", "ganancia por acción, 12 meses"),
      fila("Calidad", ra.calidadScore != null ? Math.round(ra.calidadScore) + "/100" : "—", "deuda, crecimiento y margen"),
    ]) + grupo("Solidez y riesgo", [
      fila("Deuda / EBITDA", ra.deudaEbitda != null ? n1.format(ra.deudaEbitda) + "x" : "—", "años de EBITDA para cancelar la deuda"),
      fila("Liquidez", ra.liquidez != null ? n1.format(ra.liquidez) + "x" : "—", "activo corriente / pasivo corriente"),
      filaBeta(),
      filaVol(),
      fila("Acciones en circulación", numC(ra.acciones), ""),
      fila("Dividendo en alza", ra.divAnios ? ra.divAnios + (ra.divAnios === 1 ? " año" : " años") : ra.divYield > 0 && ra.divAnios === 0 ? "no" : "—",
        ra.divAnios || ra.divYield > 0 ? "años seguidos subiendo el dividendo anual" : "no paga dividendos o no hay datos"),
      fila("Consenso", pct1(ra.upside), ra.nAnalistas && ra.target ? `objetivo US$${nf.format(ra.target)} de ${ra.nAnalistas} analistas${ra.targetBajo && ra.targetAlto ? ` (${nf.format(ra.targetBajo)} – ${nf.format(ra.targetAlto)})` : ""}` : ra.nAnalistas ? "objetivo de " + ra.nAnalistas + " analistas" : ""),
    ]) + (ra.monedaBalance === "ARS" ? `<div class="stg"><div class="vacio">Balance en pesos: P/Ventas, EV/EBITDA, ingresos, ganancia y crecimiento no se publican porque mezclarían un precio en dólares con números en pesos.</div></div>` : "")
    : fundOk ? proHtml : "");

  const verClase = () => ra && ra.veredicto === "Infravalorada" ? " infra" : ra && ra.veredicto === "Estirada" ? " cara" : "";
  const conVer = () => !!(ra && ra.veredicto && ra.veredicto !== "Sin cobertura");

  // medidor de medio arco: el punto marca dónde cae el valor entre 0 y 100
  const gauge = v => {
    const arco = `<path d="M8 50 A42 42 0 0 1 92 50" fill="none" stroke-width="7" stroke-linecap="round"`;
    if (v == null || !isFinite(v)) return `<svg class="gauge" viewBox="0 0 100 56">${arco} stroke="#E7E3DA"/></svg>`;
    const p = Math.max(0, Math.min(1, v / 100)), a = Math.PI * (1 - p);
    const x = 50 + 42 * Math.cos(a), y = 50 - 42 * Math.sin(a);
    return `<svg class="gauge" viewBox="0 0 100 56"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#B23A3A"/><stop offset=".5" stop-color="#B08A3E"/><stop offset="1" stop-color="#1F7A4D"/></linearGradient></defs>
      ${arco} stroke="url(#gg)" opacity=".4"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="#0E1830" stroke="#fff" stroke-width="2"/></svg>`;
  };

  // ── estado: valor razonable, rango del día, 52 semanas y consenso ──
  const estadoHtml = () => `<div class="estado">
    <div class="et"><div class="l">Valor razonable · Lectura Valtia</div>
      ${conVer() ? `<div class="v"><span class="ver-tag${verClase()}">${esc(ra.veredicto)}</span>${ra.entrada ? '<span class="entrada" style="margin:0 0 0 10px" title="Puntaje de valor de 60 o más y RSI debajo de 45. Lectura automática, no una recomendación.">● barata y con RSI bajo</span>' : ""}${ra.pierdePlata ? ' <span class="ver-tag" style="background:rgba(224,169,62,.15);color:#E0A93E;margin-left:6px" title="El puntaje mide qué tan barata cotiza, no si gana dinero">no gana plata</span>' : ""}</div>
        <div class="barra"><i style="width:100%"></i>${ra.score != null ? `<b style="left:${Math.max(0, Math.min(100, ra.score))}%"></b>` : ""}</div>
        <div class="barra-l"><span>estirada</span><span>puntaje ${ra.score != null ? Math.round(ra.score) : "—"}/100</span><span>barata</span></div>
        <div class="s">${conRatios
          ? (ra.justo ? `Precio justo <b>US$${nf.format(ra.justo)}</b> (<span class="${clase(ra.justoUpside)}">${signo(ra.justoUpside)}</span>): lo que valdría a los múltiplos medianos de su familia. Entre ${nf.format(ra.justoMin)} y ${nf.format(ra.justoMax)} según el múltiplo.`
                      : `Sin precio justo. ${motivoLargo(ra.justoMotivo)}`) + " Lectura automática, no una recomendación."
          : `Qué tan barata cotiza frente a su familia sectorial, según el modelo de Valtia. Lectura automática, no una recomendación. El precio justo por múltiplos es <a href="planes.html">PRO</a>.`}</div>`
      : `<div class="v">Sin cobertura</div><div class="s">${ra ? "No aplica: es un ETF o una cripto, sin balance que valuar." : "Este activo todavía no está en el radar de valuación de Valtia."}</div>`}
    </div>
    <div class="et"><div class="l">Rango del día</div>
      ${dia ? `<div class="v">US$${nf.format(dia.min)} – US$${nf.format(dia.max)}</div>
        <div class="barra"><i class="neutra" style="width:100%"></i><b style="left:${dia.pos.toFixed(1)}%"></b></div>
        <div class="barra-l"><span>mínimo</span><span>${px.p ? "hoy US$" + nf.format(px.p) : ""}</span><span>máximo</span></div>
        <div class="s">${px.o ? `Abrió en US$${nf.format(px.o)}` : ""}${px.pc ? `${px.o ? " · " : ""}cierre anterior US$${nf.format(px.pc)}` : ""}${px.v ? ` · volumen ${volTxt(px.v)}${px.vp ? ` (prom. 3M ${volTxt(px.vp)})` : ""}` : ""}</div>`
      : `<div class="v">—</div><div class="s">El rango de la rueda se completa con la próxima actualización de precios (cada 15 min en rueda).</div>`}
    </div>
    <div class="et"><div class="l">Rango de 52 semanas</div>
      ${r52 ? `<div class="v">US$${nf.format(r52.min)} – US$${nf.format(r52.max)}</div>
        <div class="barra"><i class="neutra" style="width:100%"></i>${r52.pos != null ? `<b style="left:${r52.pos.toFixed(1)}%"></b>` : ""}</div>
        <div class="barra-l"><span>mínimo</span><span>${px.p ? "hoy US$" + nf.format(px.p) : ""}</span><span>máximo</span></div>
        <div class="s">${px.p ? `${signo((px.p / r52.min - 1) * 100)} desde el mínimo · ${signo((px.p / r52.max - 1) * 100)} desde el máximo` : "Cierres diarios de los últimos 12 meses."}</div>`
      : `<div class="v">—</div><div class="s">El histórico de precios se está generando.</div>`}
    </div>
    <div class="et"><div class="l">Consenso de analistas</div>
      ${recoTxt() ? `<div class="v"><span class="ver-tag${/buy/.test(ra.reco) ? " infra" : /sell/.test(ra.reco) ? " cara" : ""}">${recoTxt()}</span></div>` : `<div class="v">${ra ? "Sin consenso publicado" : "—"}</div>`}
      ${conRatios
        ? `<div class="s">${ra && ra.nAnalistas && ra.target ? `Objetivo promedio <b>US$${nf.format(ra.target)}</b> (<span class="${clase(ra.upside)}">${signo(ra.upside)}</span>) de ${ra.nAnalistas} analistas${ra.targetBajo && ra.targetAlto ? `, entre ${nf.format(ra.targetBajo)} y ${nf.format(ra.targetAlto)}` : ""}.`
            : ra && ra.nAnalistas && ra.upside != null ? `${signo(ra.upside)} al objetivo promedio de ${ra.nAnalistas} analistas.`
            : recoTxt() ? "Recomendación promedio de los analistas que cubren la acción." : fundOk ? "Ningún consenso publicado para este activo." : "No aplica: este activo no tiene cobertura de analistas."}</div>`
        : !fundOk ? `<div class="s">${recoTxt() ? "Promedio de las recomendaciones de analistas de terceros." : "No aplica: este activo no tiene cobertura de analistas."}</div>`
        : `<div class="lock" style="margin-top:6px"><div class="preview-blur"><div class="s">Objetivo promedio US$ ··· (+··%) de ·· analistas, entre ··· y ···.</div></div>
           <div class="pro-overlay" style="background:transparent"><a href="planes.html" class="btn" style="padding:6px 14px">Objetivo: PRO</a></div></div>`}
    </div>
  </div>`;

  // ── puntuación: cada lectura con su medidor ──
  const filaP = (l, v, z, g) => `<div class="pr"><div><div class="pl">${l}</div><div class="pv">${v}</div>${z ? `<div class="ps">${z}</div>` : ""}</div>${g}</div>`;
  const puntHtml = () => !ra ? '<div class="vacio">Este activo todavía no está en el radar de valuación.</div>' : `<div class="punt">
      ${fundOk
        ? filaP("Puntaje Valtia", ra.score != null ? Math.round(ra.score) + "/100" : "—", "qué tan barata cotiza frente a su familia sectorial: múltiplos y caja libre", gauge(ra.score))
          + filaP("Calidad relativa", nivel() ? SALUD[nivel()] : "—", nivel() ? saludHtml(nivel()) + (conRatios && ra.calidadScore != null ? `calidad ${Math.round(ra.calidadScore)}/100 · ` : "") + "deuda frente a su familia; crecimiento y margen frente al radar. Es una posición relativa, no un diagnóstico" : "faltan datos: hacen falta 2 de 3 entre deuda, crecimiento y margen", gauge(!nivel() ? null : conRatios && ra.calidadScore != null ? ra.calidadScore : nivel() * 20 - 10))
        : filaP("Puntaje Valtia", "—", "sin valuación: es un ETF o una cripto, no hay balance que comparar", gauge(null))}
      ${filaP("Análisis técnico", tec ? tec.label : "—", tec ? tec.detalle + " · resumen automático de indicadores, no es una recomendación" : "hacen falta 60 ruedas de histórico", gauge(tec ? tec.gauge : null))}
      ${fundOk || recoTxt() ? filaP("Opinión de analistas", recoTxt() || "—", conRatios && ra.nAnalistas && ra.target ? `promedio de ${ra.nAnalistas} analistas de terceros · objetivo US$${nf.format(ra.target)} (${signo(ra.upside)})` : recoTxt() ? `promedio de los analistas que la cubren · el objetivo es <a href="planes.html">PRO</a>` : "sin consenso publicado", gauge(ra.reco ? RECO_G[ra.reco] : null)) : ""}
      ${!fundOk ? "" : `<div class="lock">${conRatios
        ? filaP("Valor razonable", ra.justo ? "US$" + nf.format(ra.justo) : "—", ra.justo ? `${signo(ra.justoUpside)} al precio de hoy · múltiplos medianos de su familia · entre ${nf.format(ra.justoMin)} y ${nf.format(ra.justoMax)}` : motivoLargo(ra.justoMotivo), gauge(gaugeJusto(ra.justoUpside)))
        : `<div class="preview-blur">${filaP("Valor razonable", "US$ · ·", "precio justo por múltiplos frente a su familia", gauge(null))}</div>
           <div class="pro-overlay" style="background:rgba(246,243,236,.35)"><a href="planes.html" class="btn">Precio justo: PRO</a></div>`}
      </div>`}
    </div>`;

  // ── lo que importa: lecturas automáticas en una frase, con los datos de la
  // ficha. Lo gratis se arma con lo público; con PRO se suman las de valor.
  const tipsHtml = () => {
    const tips = [];
    const tip = (c, h) => tips.push(`<div class="tip ${c}"><i></i><div>${h}</div></div>`);
    if (r52 && px.p) {
      const dMax = (px.p / r52.max - 1) * 100, dMin = (px.p / r52.min - 1) * 100;
      if (dMax >= -5) tip("n", `<b>Cerca del máximo del año.</b> Cotiza a ${signo(dMax)} del techo de 52 semanas. Estar arriba en el año no dice si está cara: eso lo mide la lectura Valtia.`);
      else if (dMin <= 10) tip("n", `<b>Cerca del mínimo del año.</b> Está a ${signo(dMin)} del piso de 52 semanas. Que esté abajo en el año no significa que esté barata en valor: son lecturas distintas.`);
    }
    if (tec) tip(tec.score >= 1 ? "b" : tec.score <= -1 ? "m" : "n", `<b>${tec.label}.</b> ${tec.detalle.charAt(0).toUpperCase() + tec.detalle.slice(1)}. Es un resumen automático de indicadores: describe el precio, no dice qué hacer.`);
    if (ra && ra.entrada && tec && tec.score <= -1) tip("n", `<b>Valor y precio van por caminos distintos.</b> Frente a su familia cotiza barata, pero el precio viene en baja. Son dos lecturas automáticas distintas y ninguna es una recomendación.`);
    if (ra && ra.rsi != null && ra.rsi > 70) tip("m", `<b>Sobrecomprado.</b> RSI ${Math.round(ra.rsi)}: subió mucho en pocas ruedas. Después de subas así es común que el precio se tome un respiro, aunque no siempre pasa.`);
    else if (ra && ra.rsi != null && ra.rsi < 30) tip("b", `<b>Sobrevendido.</b> RSI ${Math.round(ra.rsi)}: cayó mucho en pocas ruedas. A veces rebota y a veces sigue cayendo, si hay un motivo de fondo.`);
    if (conVer()) tip(ra.veredicto === "Infravalorada" ? "b" : ra.veredicto === "Estirada" ? "m" : "n", `<b>${esc(ra.veredicto)} frente a su familia.</b> ${ra.score != null ? `Puntaje Valtia ${Math.round(ra.score)}/100: ` : ""}qué tan barata cotiza dentro de su estilo, no si es buena empresa.`);
    if (ra && ra.pierdePlata) tip("m", `<b>No gana plata.</b> ROE o margen neto negativos. El puntaje mide qué tan barata cotiza, no si el negocio es rentable.`);
    if (nivel()) tip(nivel() >= 4 ? "b" : nivel() <= 2 ? "m" : "n", `<b>Calidad: ${SALUD[nivel()].toLowerCase()} del radar.</b> Deuda frente a su familia, y crecimiento y margen frente al resto del radar${conRatios && ra.calidadScore != null ? ` (${Math.round(ra.calidadScore)}/100)` : ""}. Es una posición relativa, no un diagnóstico de la empresa.`);
    if (recoTxt()) tip(/buy/.test(ra.reco) ? "b" : /sell/.test(ra.reco) ? "m" : "n", `<b>Consenso de analistas: ${recoTxt().toLowerCase()}.</b> Promedio de las recomendaciones de ${conRatios && ra.nAnalistas ? ra.nAnalistas + " analistas" : "los analistas"} que cubren la acción, no una opinión de Valtia${conRatios && ra.target ? `; objetivo promedio US$${nf.format(ra.target)} (${signo(ra.upside)})` : ""}.`);
    if (ra && ra.divYield >= 0.1) tip("n", `<b>Paga dividendos.</b> ${dy(ra.divYield)} anual${conRatios && ra.divAnios ? `, y lo subió ${ra.divAnios} ${ra.divAnios === 1 ? "año" : "años"} seguidos` : ""}.`);
    if (conRatios && fundOk) {
      if (ra.justo) tip(ra.justoUpside >= 15 ? "b" : ra.justoUpside <= -15 ? "m" : "n", `<b>Precio justo US$${nf.format(ra.justo)} (${signo(ra.justoUpside)}).</b> Lo que valdría a los múltiplos medianos de su familia; entre ${nf.format(ra.justoMin)} y ${nf.format(ra.justoMax)} según el múltiplo. Es relativo: si toda la familia está cara, este número también.`);
      else if (ra.justoMotivo) tip("n", `<b>Sin precio justo.</b> ${motivoLargo(ra.justoMotivo)}`);
      if (ra.deudaEbitda != null) tip(ra.deudaEbitda < 1 ? "b" : ra.deudaEbitda > 3 ? "m" : "n", `<b>Deuda ${ra.deudaEbitda < 1 ? "baja" : ra.deudaEbitda > 3 ? "alta" : "manejable"}.</b> ${n1.format(ra.deudaEbitda)} años de EBITDA para cancelarla.`);
      if (ra.fcfy != null) tip(ra.fcfy >= 5 ? "b" : ra.fcfy < 0 ? "m" : "n", `<b>${ra.fcfy < 0 ? "Quema caja" : ra.fcfy >= 5 ? "Genera mucha caja" : "Genera caja"}.</b> FCF yield ${n1.format(ra.fcfy)}%: caja libre sobre lo que vale en bolsa.`);
      if (ra.roe != null) tip(ra.roe >= 20 ? "b" : ra.roe < 5 ? "m" : "n", `<b>ROE ${n1.format(ra.roe)}%.</b> ${ra.roe >= 20 ? "Rentabilidad alta" : ra.roe < 5 ? "Rentabilidad baja" : "Rentabilidad razonable"} sobre el patrimonio.`);
      if (ra.growth != null) tip(ra.growth >= 15 ? "b" : ra.growth < 0 ? "m" : "n", `<b>Ingresos ${ra.growth >= 0 ? "crecen" : "caen"} ${signo(ra.growth)}</b> interanual.`);
    } else if (fundOk) {
      tip("n", `<b>Con PRO</b> se suman las lecturas de precio justo, deuda, caja libre, ROE y crecimiento. <a href="planes.html">Ver planes →</a>`);
    }
    return tips.length ? tips.join("") : '<div class="vacio">Sin lecturas todavía: faltan datos del radar para este activo.</div>';
  };

  ficha.innerHTML = `
  <div class="top-row">
    <span class="volver" id="volver">← Volver</span>
    <div class="bx">
      <input id="bx-input" type="search" placeholder="Buscar activo — NVDA, Apple, Bitcoin…" autocomplete="off">
      <div class="bx-panel" id="bx-panel"></div>
    </div>
  </div>
  <div class="head">
    <div>
      <div class="sec">${esc(sectorN)}</div>
      <h1>${esc(emp.nombre)}<span>${t}</span></h1>
      <div class="head-meta">Cotiza en dólares${emp.slug ? " · con informe Valtia" : ""}${conVer() ? " · en el radar de valuación" : ""}</div>
    </div>
    <div class="px">
      <div class="p">${px.p ? "US$" + nf.format(px.p) : "—"}</div>
      ${px.d != null ? `<div class="d ${clase(px.d)}">${signo(px.d)} hoy</div>` : ""}
      ${hora ? `<div class="h">Actualizado ${hora} hs · cada 15 min en rueda</div>` : ""}
      <div class="acc"><a class="btn-acc prim" href="index.html?agregar=${encodeURIComponent(t)}#panel/micartera">+ Agregar a Mi cartera</a></div>
    </div>
  </div>
  <div class="subnav" id="subnav"><a href="#general" class="on">General</a><a href="#grafico">Gráfico</a><a href="#tecnico">Técnico</a><a href="#estadisticas">Estadísticas</a>${emp.slug ? '<a href="#informe">Informe</a>' : ""}<a href="#noticias">Noticias</a></div>

  <div id="mi-pos"></div>
  <div id="general">${estadoHtml()}</div>

  <div class="ficha-grid">
  <div class="col-main">
    <div class="card-w" id="grafico">
      <div class="card-h"><span class="t">Evolución del precio</span>
        <div class="der">

  const pintarLista = q => {

  // noticias del activo
  const lista = document.getElementById("act-news-list");

  lista.innerHTML = notas.length ? notas.map(nn => `

  // ── gráfico: velas con volumen (o línea), de 1 semana a 2 años ──
  // Cada fila del histórico es [fecha, cierre, apertura, máximo, mínimo,
  // volumen]; si el doc todavía es de cierres solos, se queda en la línea.
  const canvas = document.getElementById("chart");
  if (serie.length && typeof Chart !== "undefined") {
    let chart = null;
    const conVelas = serie.filter(p => p.length >= 5 && p[2] > 0 && p[3] > 0 && p[4] > 0).length >= 30;
    let tipo = conVelas ? "velas" : "linea", dias = 91;
    if (!conVelas) { const bt = document.getElementById("tipo"); if (bt) bt.style.display = "none"; }
    const dibujar = () => {
      // los rangos se cortan por FECHA: la cripto cotiza todos los días y 126 filas no son 6 meses
      const datos = dias ? serie.filter(p => String(p[0]) >= haceDias(dias)) : serie;
      const labels = datos.map(p => p[0]);
      const vol = datos.map(p => Number(p[5]) || 0);
      const hayVol = vol.some(v => v > 0);
      const ohlc = p => p.length >= 5 && p[2] > 0 && p[3] > 0 && p[4] > 0 ? p : [p[0], p[1], p[1], p[1], p[1]];
      const sube = p => { const q = ohlc(p); return q[1] >= q[2]; };
      if (chart) chart.destroy();
      const escalas = {
        x: { grid: { display: false }, ticks: { color: "#8B8375", maxTicksLimit: 7, maxRotation: 0,
             callback: function (v) { return venc(this.getLabelForValue(v)); }, font: { size: 10 } } },
        y: { position: "right", beginAtZero: false, grace: "4%", grid: { color: "#EFECE4" }, ticks: { color: "#8B8375", font: { size: 10 },
             callback: v => "US$" + compacto.format(v) } },
      };
      const extra = [];
      if (hayVol) {
        // el volumen va en su propio eje (oculto), aplastado al cuarto inferior
        escalas.y2 = { display: false, min: 0, max: Math.max(...vol) * 4 };
        extra.push({ type: "bar", yAxisID: "y2", order: 3, data: vol, grouped: false, barPercentage: 0.8, categoryPercentage: 1,
          backgroundColor: datos.map(p => sube(p) ? "rgba(31,122,77,.16)" : "rgba(178,58,58,.16)") });
      }
      const base = { responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false }, scales: escalas };
      if (tipo === "velas") {
        const colores = datos.map(p => sube(p) ? "#1F7A4D" : "#B23A3A");
        chart = new Chart(canvas, { type: "bar",
          data: { labels, datasets: [
            { data: datos.map(p => { const q = ohlc(p); return [q[4], q[3]]; }), backgroundColor: colores, grouped: false, order: 2, barPercentage: 0.16, categoryPercentage: 1, borderWidth: 0 },
            { data: datos.map(p => { const q = ohlc(p); return [Math.min(q[1], q[2]), Math.max(q[1], q[2])]; }), backgroundColor: colores, grouped: false, order: 1, barPercentage: 0.72, categoryPercentage: 1, minBarLength: 1, borderWidth: 0 },
            ...extra ] },
          options: { ...base, plugins: { legend: { display: false }, tooltip: { filter: it => it.datasetIndex === 1, callbacks: {
            title: items => venc(items[0].label),
            label: ctx => { const p = datos[ctx.dataIndex], q = ohlc(p);
              return [`Apertura US$${nf.format(q[2])}`, `Máximo US$${nf.format(q[3])}`, `Mínimo US$${nf.format(q[4])}`, `Cierre US$${nf.format(q[1])}`]
                .concat(p[5] ? [`Volumen ${compacto.format(p[5])}`] : []); } } } } } });
      } else {
        chart = new Chart(canvas, { type: "line",
          data: { labels, datasets: [{ data: datos.map(p => p[1]), borderColor: "#B08A3E", borderWidth: 1.8, pointRadius: 0, pointHitRadius: 8,
            fill: true, backgroundColor: "rgba(176,138,62,.07)", tension: 0.15, order: 1 }, ...extra] },

  const pintarSentimiento = async user => {
    const box = document.getElementById("sentimiento");
    if (!box) return;
    const cab = `<div class="pl">Sentimiento de la comunidad</div>`;
    if (!user) {
      box.innerHTML = `<div class="pr" style="grid-template-columns:1fr;border-bottom:none"><div>${cab}<div class="pv">¿Alcista o bajista?</div>

    // se cuenta con agregaciones (1 lectura cada 1.000 votos) y se lee solo el voto propio
    const col = collection(db, "sentimiento", t, "votos");
    let mio = null, alc = 0, baj = 0;
    try {
      const [m, a, b] = await Promise.all([
        getDoc(doc(col, user.uid)),

      ${tot >= MIN ? `<div class="sent-bar"><i style="width:${pa}%;background:var(--up)"></i><i style="width:${100 - pa}%;background:var(--dn)"></i></div>` : ""}
      <div class="sent"><button class="alc${votoDe("alcista")}" data-voto="alcista">▲ Alcista${tot >= MIN ? " · " + alc : ""}</button><button class="baj${votoDe("bajista")}" data-voto="bajista">▼ Bajista${tot >= MIN ? " · " + baj : ""}</button></div>
      <div class="ps" data-sent-msg>${mio ? `Votaste ${mio.voto === "alcista" ? "alcista" : "bajista"}.${espera ? ` Podés cambiarlo en ${espera} min.` : " Podés cambiarlo una vez por hora."}` : "¿Cómo lo ves para las próximas semanas? Un voto por persona."}${tot && tot < MIN ? ` El porcentaje se muestra desde ${MIN} votos.` : ""} Es la opinión de usuarios registrados, no un dato de mercado.</div></div></div>`;
    box.querySelectorAll("[data-voto]").forEach(btn => btn.onclick = async () => {
      const msg = box.querySelector("[data-sent-msg]");
      if (mio && mio.voto === btn.dataset.voto) return;
      if (!user.emailVerified) { msg.innerHTML = `<span class="dn">Verificá tu email para votar.</span>`; return; }
      if (espera) { msg.innerHTML = `<span class="dn">Votaste hace poco: podés cambiar el voto en ${espera} min.</span>`; return; }
      box.querySelectorAll("[data-voto]").forEach(x => x.disabled = true);

  // ── sesión: destape PRO, sentimiento y tu posición ──
  onAuthStateChanged(getAuth(app), async user => {
    pintarSentimiento(user);
    // destape PRO: los candados de esta ficha se crean DESPUÉS de que
    // nav-auth pinta (los datos llegan async), así que acá se re-aplica
    if (user) {
      const esperar = ms => new Promise(r => setTimeout(r, ms));
      for (let i = 0; i < 20 && !window.valtiaEsPro; i++) await esperar(150);
      try {
        if (window.valtiaEsPro && await window.valtiaEsPro(user)) {
          // el primer getDoc de radarPro pudo correr antes de que Firestore
          // conociera la sesión: se vuelve a pedir y se repintan las partes PRO
          if (!conRatios) {

      if (emp.slug && !inf && !document.querySelector("#informe-full .fsr-reader")) {

      }
    }
    const cont = document.getElementById("mi-pos");
    if (!user || !user.email || !cont) return;
    try {
      const snap = await getDocs(collection(db, "inversores", user.email, "cartera"));
      // lotes de este activo en cualquier forma (BTC / BTC-USD, PAM / PAMP);
      // los .BA cotizan en pesos y no se valúan con el precio en dólares
      const lotes = snap.docs.map(x => x.data())
        .filter(p => tickerFicha(p.ticker) === t && !String(p.ticker || "").toUpperCase().endsWith(".BA"));
      if (!lotes.length) return;
      const cant = lotes.reduce((a, p) => a + (Number(p.cantidad) || 0), 0);
      const conCosto = lotes.filter(p => Number(p.precioCompra) > 0);
      const cantCosto = conCosto.reduce((a, p) => a + Number(p.cantidad), 0);
      const costo = conCosto.reduce((a, p) => a + Number(p.cantidad) * Number(p.precioCompra), 0);
      const ppc = cantCosto ? costo / cantCosto : null;
      const valor = px.p ? cant * px.p : null;
      const pnlPct = ppc && px.p ? (px.p / ppc - 1) * 100 : null;
      const pnlUsd = ppc && px.p ? (px.p - ppc) * cantCosto : null;
      const item = (l, v, s) => `<div><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
      cont.innerHTML = `<div class="mi-pos">
        <div class="tt">Tu posición en ${esc(emp.nombre)}</div>
        ${item("Tenencia", nf.format(cant) + " u.", "")}
        ${valor != null ? item("Valor hoy", "US$" + nf.format(valor), "al último precio") : ""}
        ${ppc != null ? item("Precio promedio", "US$" + nf.format(ppc), cantCosto < cant ? "sobre los lotes con costo cargado" : "") : ""}
        ${pnlPct != null ? item("Resultado", `<span class="${clase(pnlPct)}">${signo(pnlPct)}</span>`,
          (pnlUsd >= 0 ? "+" : "−") + "US$" + nf.format(Math.abs(pnlUsd))) : ""}
      </div>`;
    } catch (e) {}
  });
} catch (e) {
  ficha.innerHTML = '<div class="empty-state">No pudimos cargar la ficha. <a href="informes.html">Volver a Informes</a></div>';
}
</script>
