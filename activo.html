<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de activo — Valtia Analytics</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0E1830">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Ficha de activo — etapa 8 del rediseño: el prototipo "Valtia Activo"
     sección por sección (encabezado blanco, franja "Lectura de Valtia",
     Precio, Los números, Lo que escribimos y la columna de la derecha), con
     los valores literales del prototipo. Las reglas globales (nav, barra de
     cotizaciones, Plex Sans con números tabulares, botón de mail, ancho de
     1340) vienen de sitio.css. ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#101010;--sub:#57534A;--mut:#8B8375;--navy:#0E1830;--navy3:#14213D;--gold:#B08A3E;--gold2:#8A6A2F;--line:#E7E3DA;--marfil:#F6F3EC;--up:#1F7A4D;--dn:#B23A3A;--amb:#B7791F;
  --va-borde:#E6E8EC;--va-div:#F0F1F4}
html{scroll-behavior:smooth}
body{background:#fff;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink)}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}
img{max-width:100%}
.up{color:var(--up)}.dn{color:var(--dn)}

/* ── encabezado blanco (prototipo: #va-mh) ── */
.va-mh{background:#fff;padding:24px var(--v-gutter) 6px}
.va-in{max-width:var(--v-ancho);margin:0 auto}
.va-top{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.va-back{font:500 12px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8A6A2F}
.va-back:hover{color:#101010}
.va-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 40px;align-items:end;margin-top:14px}
.va-id{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.va-tk{font:700 13.5px 'IBM Plex Sans',sans-serif;color:#fff;background:#0E1830;padding:4px 10px;border-radius:99px}
.va-meta{font:500 12px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#8B8375}
.va-head h1{font:700 clamp(28px,3vw,36px)/1.1 'IBM Plex Sans',sans-serif;color:#101010;margin:10px 0 0}
.va-px{text-align:right}
.va-px .p{font:600 34px/1 'IBM Plex Sans',sans-serif;color:#101010}
.va-px .d{display:flex;gap:6px 14px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px;font:500 13.5px 'IBM Plex Sans',sans-serif}
.va-px .d .c{color:#8B8375}

/* buscador de otros activos (el de la ficha anterior, en la línea de volver) */
.bx{position:relative;flex:0 1 340px;min-width:0}
.bx input{width:100%;padding:8px 12px;border:1px solid var(--va-borde);border-radius:8px;background:#fff;font:400 14px 'IBM Plex Sans',sans-serif;color:var(--ink);outline:none}
.bx input:focus{border-color:var(--gold)}
.bx-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--va-borde);border-radius:10px;box-shadow:0 14px 40px rgba(16,16,16,.12);max-height:380px;overflow-y:auto;z-index:150;display:none}
.bx-panel.open{display:block}
.bx-g{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);padding:10px 14px 5px;background:var(--marfil)}
.bx-it{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;cursor:pointer;font:400 14px 'IBM Plex Sans',sans-serif}
.bx-it:hover{background:var(--marfil)}
.bx-it .tk{font:600 12px 'IBM Plex Sans',sans-serif;color:var(--mut)}

/* ── cuerpo (prototipo: #va-body) ── */
.va-body{background:#fff;padding:18px var(--v-gutter) 70px}
.va-card{background:#fff;border:1px solid var(--va-borde);border-radius:10px;padding:20px 22px;min-width:0}
.va-card[hidden]{display:none}
.va-h{font:600 17.5px 'IBM Plex Sans',sans-serif;color:#101010;margin-bottom:10px}
.va-sub{font-size:14px;line-height:1.55;color:#57534A;margin:-6px 0 14px}
.va-vacio{font-size:14px;line-height:1.55;color:#8B8375;padding:6px 0}
.va-link{display:inline-block;font:600 11.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.va-mas{margin-top:10px}

/* franja "Lectura de Valtia" */
.va-lect{background:#fff;border:1px solid var(--va-borde);border-radius:10px;padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:14px}
.va-lect>div{min-width:0}
.va-lect .l{font-size:12.5px;color:#57534A}
.va-lect .v{font:600 17px 'IBM Plex Sans',sans-serif;color:#101010;margin-top:6px}
.va-lect .v .de{font-size:13.5px;font-weight:400;color:#8B8375}
.va-lect .s{font-size:13.5px;line-height:1.45;color:#8B8375;margin-top:4px}
.va-ver{display:flex;align-items:center;gap:8px;margin-top:6px}
.va-ver .v{margin-top:0}
.va-dot{width:10px;height:10px;border-radius:50%;display:block;flex:none}
.va-bar{height:4px;background:#EEF0F3;border-radius:2px;margin-top:8px}
.va-bar i{display:block;height:4px;background:#14213D;border-radius:2px}
.va-cta{display:flex;flex-direction:column;justify-content:center;gap:8px}
.va-btn{display:block;font:600 12px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#14213D;padding:11px 16px;border-radius:8px;text-align:center;text-wrap:balance}
.va-btn:hover{background:#0E1830;color:#fff}
.va-cta .s{font-size:12.5px;color:#8B8375;text-align:center;margin:0;min-height:1.45em}

/* tu posición (solo con sesión y tenencia en dólares) */
.mi-pos{background:var(--marfil);border:1px solid var(--va-borde);border-left:3px solid var(--gold);border-radius:10px;padding:15px 20px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px 36px;align-items:baseline}
.mi-pos .tt{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);width:100%}
.mi-pos .l{font-size:12.5px;color:var(--sub)}
.mi-pos .v{font:600 17px 'IBM Plex Sans',sans-serif;margin-top:3px}
.mi-pos .s{font-size:12.5px;color:var(--mut);margin-top:2px}

/* dos columnas (prototipo: #va-grid) */
.va-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:14px;align-items:start}
.va-col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* Precio: selector de rango con la regla de botones del sitio, gráfico,
   leyenda y variación por período */
.va-ch-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.va-ch-top .va-h{margin:0}
.va-sel{display:inline-flex;gap:2px;align-items:center;flex-wrap:wrap}
.va-sel button{font:500 12.5px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;padding:6px 10px;cursor:pointer;color:#57534A;border:1px solid rgba(176,138,62,.4);border-radius:8px;background:#fff;white-space:nowrap;transition:color .15s,border-color .15s,background .15s}
.va-sel button:hover{color:#101010}
.va-sel button.on{color:#101010;border-color:#B08A3E;background:#FBF5E8}
.va-sep{width:1px;height:20px;background:var(--va-borde);margin:0 8px}
.va-chart{position:relative;height:clamp(220px,28vw,300px)}
.va-leg{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:13px;color:#57534A}
.va-leg>span{display:flex;align-items:center;gap:6px}
.va-leg i{width:12px;display:block;flex:none}
.va-leg .per{margin-left:auto;color:#8B8375}
.va-rend{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));margin-top:14px;border-top:1px solid var(--va-div)}
.va-rend .r{padding:10px 4px 0;text-align:center;min-width:0}
.va-rend .rl{font-size:12px;color:#8B8375;white-space:nowrap}
.va-rend .rv{font:600 14px 'IBM Plex Sans',sans-serif;margin-top:3px}
.va-rend-nota{font-size:12.5px;line-height:1.5;color:#8B8375;margin-top:10px}

/* Los números */
.va-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.va-num{border:1px solid var(--va-borde);border-radius:8px;padding:11px 13px;min-width:0}
.va-num .l{font-size:12.5px;color:#57534A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.va-num .v{font:600 17px 'IBM Plex Sans',sans-serif;color:#101010;margin-top:5px}
.va-num .s{font-size:12.5px;line-height:1.4;color:#8B8375;margin-top:3px}
.va-num .s.b{color:#1F7A4D}.va-num .s.a{color:#B7791F}
.va-mas-num{margin-top:12px}
.va-mas-num summary{cursor:pointer;font:600 11.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);list-style:none}
.va-mas-num summary::-webkit-details-marker{display:none}
.va-mas-num summary::after{content:' ↓'}
.va-mas-num[open] summary::after{content:' ↑'}
.va-mas-num .va-nums{margin-top:12px}
.va-nota-num{font-size:12.5px;line-height:1.55;color:#8B8375;margin-top:12px}
.salud{display:flex;gap:3px;margin:7px 0 2px;max-width:130px}
.salud i{flex:1;height:6px;background:#EEF0F3;border-radius:2px}
.salud i.on{background:var(--up)}.salud.n1 i.on,.salud.n2 i.on{background:var(--dn)}.salud.n3 i.on{background:var(--gold)}
/* candado PRO: tarjetas de muestra sin datos, desenfocadas */
.lock{position:relative;margin-top:10px}
.preview-blur{filter:blur(5px);pointer-events:none;user-select:none}
.lock .preview-blur{max-height:212px;overflow:hidden}
.pro-overlay{position:absolute;inset:0;background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:5;text-align:center;padding:10px}
.pro-overlay h4{font:600 15px 'IBM Plex Sans',sans-serif;color:#101010}
.pro-overlay p{font-size:13px;color:var(--sub);max-width:360px;line-height:1.5}
.pro-overlay .btn{font:600 12px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;background:#14213D;color:#fff;padding:9px 18px;border-radius:8px}
.pro-overlay .btn:hover{background:#0E1830;color:#fff}
/* lecturas automáticas (las de "Lo que importa" de la ficha anterior) */
.va-tips-t{font:600 14px 'IBM Plex Sans',sans-serif;color:#101010;margin:18px 0 4px}
.tip{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--va-div);font-size:14px;line-height:1.55;color:#2E2A24}
.tip:last-child{border-bottom:none}
.tip i{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--mut)}
.tip.b i{background:var(--up)}.tip.m i{background:var(--dn)}.tip.n i{background:var(--gold)}
.tip b{color:var(--ink);font-weight:600}

/* Lo que escribimos */
.va-esc-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.va-esc-top .va-h{margin:0}
.va-dest{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:14px;border:1px solid var(--va-borde);border-left:3px solid #14213D;border-radius:8px;margin-bottom:12px}
.va-dest .img{aspect-ratio:4/3;background:#0E1830 center/cover no-repeat;border-radius:6px}
.va-dest .eb{font:700 11.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8A6A2F}
.va-dest .tt{font:600 18px/1.25 'IBM Plex Sans',sans-serif;color:#101010;margin:6px 0}
.va-dest p{font-size:14.5px;line-height:1.6;color:#57534A;margin:0 0 8px}
.va-dest .pie{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.va-dest .pp{font:500 13px 'IBM Plex Sans',sans-serif;color:#57534A}
.va-dest .pp b{color:#101010}
.va-dest .pp b.up{color:var(--up)}.va-dest .pp b.dn{color:var(--dn)}
.va-nota{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:11px 0;border-bottom:1px solid var(--va-div);align-items:baseline;color:inherit}
.va-nota .f{font:500 12.5px 'IBM Plex Sans',sans-serif;color:#8B8375}
.va-nota .t{font:600 15px 'IBM Plex Sans',sans-serif;color:#101010}
a.va-nota:hover .t{text-decoration:underline}
.va-nota .s{font-size:13.5px;line-height:1.5;color:#8B8375;margin-top:2px}

/* columna derecha */
.va-cart{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--va-div);color:inherit}
.va-cart .cod{font:700 11.5px 'IBM Plex Sans',sans-serif;color:#fff;padding:3px 6px;border-radius:99px;min-width:52px;text-align:center;display:inline-block}
.va-cart .n{font:600 14.5px 'IBM Plex Sans',sans-serif;color:#101010}
a.va-cart:hover .n{text-decoration:underline}
.va-cart .e{font-size:12.5px;color:#8B8375}
.va-cart .w{font:600 14px 'IBM Plex Sans',sans-serif;color:#101010}
.va-ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--va-div);align-items:start}
.va-ev .d{font:600 20px/1 'IBM Plex Sans',sans-serif;color:#101010}
.va-ev .m{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8A6A2F}
.va-ev .t{font-size:14.5px;color:#101010}
.va-ev .s{font-size:13px;color:#8B8375;margin-top:2px}
.va-nw{display:block;padding:9px 0;border-bottom:1px solid var(--va-div);color:inherit}
.va-nw .f{font:500 11.5px 'IBM Plex Sans',sans-serif;color:#8B8375}
.va-nw .t{font:600 14.5px/1.4 'IBM Plex Sans',sans-serif;color:#101010;margin-top:3px}
a.va-nw:hover .t{text-decoration:underline}
.va-kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--va-div);font-size:14px}
.va-kv span{color:#57534A}
.va-kv b{font:600 14px 'IBM Plex Sans',sans-serif;color:#101010;text-align:right}
.va-fuente{font-size:12.5px;line-height:1.5;color:#8B8375;margin-top:10px}
/* sentimiento de la comunidad: un voto por persona */
.va-sent-v{font:600 17px 'IBM Plex Sans',sans-serif;color:#101010}
.va-sent-v small{font:400 13px 'IBM Plex Sans',sans-serif;color:var(--mut)}
.sent{display:flex;gap:8px;margin-top:10px}
.sent button{flex:1;font:600 12px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;padding:8px 6px;border:1px solid rgba(176,138,62,.4);border-radius:8px;background:#fff;cursor:pointer;color:#57534A}
.sent button.alc.on{background:#E4F3EA;border-color:var(--up);color:var(--up)}
.sent button.baj.on{background:#F8E5E5;border-color:var(--dn);color:var(--dn)}
.sent button:hover{border-color:var(--gold)}
.sent button:disabled{opacity:.5;cursor:wait}
.sent-bar{display:flex;height:7px;margin-top:8px;border-radius:3px;overflow:hidden;background:var(--marfil)}
.sent-bar i{display:block;height:100%}
.va-sent-s{font-size:13px;line-height:1.55;color:#8B8375;margin-top:8px}

/* widgets de TradingView (ficha de un activo del radar sin informe): la
   caja de tv.js con el borde y la esquina de las tarjetas del prototipo.
   La atribución a TradingView queda siempre a la vista. */
.va-col .vtv{border-color:var(--va-borde);border-radius:10px;margin:0}
.aviso-nf{background:var(--marfil);border:1px solid var(--va-borde);border-left:3px solid var(--gold);border-radius:10px;padding:14px 20px;margin-bottom:14px;font-size:14px;line-height:1.65;color:#2E2A24}
.aviso-nf b{display:block;margin-bottom:5px;font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
#tv-nota{margin-top:14px}

.va-disc{font-size:13px;color:#8B8375;line-height:1.7;margin:22px 0 0;max-width:820px;text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.empty-state{padding:80px 52px;text-align:center;font:400 15px 'IBM Plex Sans',sans-serif;color:var(--sub)}

/* ── estilos del lector de informes (compartidos con informes.html) ── */
.fsr-badge{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;background:var(--gold);color:#fff;padding:4px 10px;border-radius:6px;text-transform:uppercase}
.fsr-tag{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--sub);text-transform:uppercase}
.fsr-state{border:1px dashed var(--line);border-radius:12px;text-align:center;padding:44px 20px;color:var(--sub);line-height:1.9;font-size:14px}
.inf-meta{font:500 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
#informe-full{margin-top:26px}
.fsr-crumb{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-bottom:22px}
.fsr-crumb a{color:var(--sub)}
.fsr-crumb a:hover{color:var(--gold)}
.fsr-reader{background:#fff;border:1px solid var(--line);border-radius:12px;padding:clamp(24px,4vw,50px);max-width:860px;margin:0 auto}
.fsr-rhead{border-bottom:2px solid var(--gold);padding-bottom:22px;margin-bottom:8px}
.fsr-rhead h1{font:700 clamp(28px,4vw,40px) 'IBM Plex Sans',sans-serif;line-height:1.15;color:var(--ink)}
.fsr-rhead .meta{font:500 11px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:12px}
.fsr-reader h2{font:700 26px 'IBM Plex Sans',sans-serif;margin:42px 0 14px;padding-top:26px;border-top:1px solid var(--line);color:var(--ink)}
.fsr-reader h3{font:600 15.5px 'IBM Plex Sans',sans-serif;margin:24px 0 8px;color:var(--ink)}
.fsr-reader p{margin:11px 0;font-size:14.5px;line-height:1.85;color:#2E2A24;text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.fsr-reader p strong,.fsr-reader li strong{color:var(--ink);font-weight:600}
.fsr-reader ul{margin:10px 0 10px 22px}
.fsr-reader li{margin:7px 0;font-size:14px;line-height:1.8;color:#2E2A24}
.fsr-reader .kicker{color:var(--mut);font-style:italic}
.fsr-reader .tag{display:inline-block;font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--gold);padding:3px 9px;border-radius:6px;margin:18px 0 4px}
.fsr-reader .tag.bull{background:#1F7A4D}
.fsr-reader .tag.bear{background:#B23A3A}
.fsr-reader .tag.neutral{background:#b7791f}
.fsr-reader .fecha{font:500 11px 'IBM Plex Sans',sans-serif;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.fsr-reader table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px;display:block;overflow-x:auto}
.fsr-reader th{text-align:left;background:var(--marfil);color:var(--ink);padding:10px 12px;font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.fsr-reader td{padding:10px 12px;border-bottom:1px solid var(--line);color:#2E2A24;vertical-align:top;line-height:1.7;min-width:130px}
.fsr-reader td strong{color:var(--ink)}
.fsr-reader .card{background:var(--marfil);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:16px 20px;margin:18px 0;font-size:13.5px;line-height:1.8;color:#2E2A24}
.fsr-reader .card.warn{border-left-color:#b7791f}
.fsr-reader .card.risk{border-left-color:#B23A3A}
.fsr-reader .card.ok{border-left-color:#1F7A4D}
.fsr-reader .card strong{color:var(--ink)}
.fsr-reader .disclaimer{margin-top:44px;padding:18px 22px;background:var(--marfil);border-radius:10px;font-size:11.5px;color:var(--mut);line-height:1.7}
/* KPIs del informe (tiles) */
.fsr-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 8px}
.fsr-kpi{background:var(--marfil);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.fsr-kpi .l{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.fsr-kpi .v{font:600 15.5px 'IBM Plex Sans',sans-serif;color:var(--ink);white-space:nowrap}
.fsr-kpi .s{font-size:10.5px;color:var(--sub);margin-top:3px;line-height:1.4}
@media(max-width:700px){.fsr-kpis{grid-template-columns:repeat(2,1fr)}}

/* barras de valuación por año */
.fsr-bars{display:flex;gap:12px;align-items:flex-end;height:130px;margin:18px 0 4px;padding:0 2px}
.fsr-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.fsr-bar .col{width:100%;max-width:66px;background:#B08A3E;min-height:4px}
.fsr-bar.est .col{background:repeating-linear-gradient(45deg,#B08A3E,#B08A3E 5px,#D9BE85 5px,#D9BE85 10px)}
.fsr-bar .n{font:600 11px 'IBM Plex Sans',sans-serif;color:var(--ink)}
.fsr-bar .y{font:600 10.5px 'IBM Plex Sans',sans-serif;color:var(--mut)}
.fsr-caption{font-size:10.5px;color:var(--mut);margin:6px 0 18px}

/* rango de precios objetivos del consenso */
.fsr-rango{margin:20px 0 8px}
.fsr-rango .track{position:relative;height:8px;background:linear-gradient(90deg,#E7E3DA,#B08A3E)}
.fsr-rango .mark{position:absolute;top:-6px;width:3px;height:20px;background:#0E1830}
.fsr-rango .mark span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:700 10.5px 'IBM Plex Sans',sans-serif;color:#0E1830;white-space:nowrap}
.fsr-rango .labels{display:flex;justify-content:space-between;font:500 10.5px 'IBM Plex Sans',sans-serif;color:var(--sub);margin-top:8px}

/* FODA 2×2 */
.fsr-foda{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.fsr-foda .q{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:14px 16px;min-width:0}
.fsr-foda h4{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin:0 0 8px;border:none;padding:0}
.fsr-foda ul{margin:0 0 0 16px}
.fsr-foda li{font-size:12.5px;line-height:1.65;color:#2E2A24;margin:6px 0}
@media(max-width:700px){.fsr-foda{grid-template-columns:1fr}}

footer{background:#0B1327;padding:28px var(--v-gutter);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.footer-copy{font:400 12.5px 'IBM Plex Sans',sans-serif;color:rgba(255,255,255,.35)}
.footer-links{display:flex;gap:20px;flex-wrap:wrap}
.footer-links a{font:500 12.5px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.55);text-transform:uppercase}

/* responsive: las medidas del prototipo (1080 una columna, 880 encabezado apilado) */
@media(max-width:1080px){.va-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:880px){.va-head{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.va-rend{grid-template-columns:repeat(4,minmax(0,1fr))}.va-rend .r:nth-child(n+5){padding-top:12px}.va-leg .per{margin-left:0;width:100%}}
@media(max-width:560px){
  .va-card{padding:18px 16px}
  .va-lect{padding:16px}
  .bx{flex:1 1 100%}
  .va-sep{display:none}
  .va-ch-top>.va-sel{gap:6px}
  .va-dest{grid-template-columns:84px minmax(0,1fr);gap:12px;padding:12px}
  .va-nota{grid-template-columns:74px minmax(0,1fr);gap:10px}
}

<script type="module">
/* ══ Ficha de activo ═════════════════════════════════════════════════════
   De dónde sale cada cosa (nada se completa a mano):
   · preciosInformes/latest      precio, variación y rango del día, 52 semanas,
                                 medias de 50 y 200 ruedas (sync cada 15 min)
   · historialInformes/{T}       2 años de filas [fecha, cierre ajustado,
                                 apertura, máximo, mínimo, volumen, cierre real]
   · historialInformes/SPY o QQQ el índice de referencia del gráfico
   · radar/latest (+ radarPro/latest si la sesión es PRO)  lectura, puntaje,
                                 RSI, múltiplos; la mediana del sector se calcula
                                 acá con los activos de la misma familia del radar
   · informes/{slug} y los informes que la sesión puede leer
   · noticias publicadas que nombran a la empresa (empresas.js: claves)
   · la variación por período se calcula acá con los cierres reales del
     histórico (desglosePeriodos usa el ajustado: suma dividendos)
   · calendario/latest           próximos resultados
   · carterasModelo (+ posiciones e historial) que la sesión puede leer;
     carterasTeaser/latest solo para nombrar las PRO que no se pueden leer
   · inversores/{email}/cartera  "Ya la tenés" y "Tu posición" (con sesión)
   · catalogo-activos.js         CEDEAR y ratio oficial de BYMA (solo lectura)
   · precios/{S}.BA o preciosCatalogo/latest  precio en pesos (con sesión)
   · fx.js (dolarapi)            el CCL de la equivalencia                   ══ */
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, query, where, getCountFromServer, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { EMPRESAS, SECTORES } from './empresas.js?v=3';
import { radarSym, tickerFicha, mergeRadar, canon, esRentaFija, especieBono } from './activos.js?v=7';

const app = getApps().length ? getApp() : initializeApp({
  apiKey: 'AIzaSyCxKNw0995b8a7XXyENiMjDQbfRCe9IBlw',
  authDomain: 'valtia-analytics.firebaseapp.com',
  projectId: 'valtia-analytics',
});
const db = getFirestore(app);

// símbolo del radar: radarSym() de activos.js (PAM -> PAMP, YPF -> YPFD)
const t = (new URLSearchParams(location.search).get("t") || "NVDA").toUpperCase();
const emp = EMPRESAS.find(e => e.ticker === t);
const ficha = document.getElementById("ficha");

const nf = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const n1 = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const n0 = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 0 });
const nCant = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 4 });
const compacto = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
// se redondea antes de formatear: -0,04 no puede verse como "-0,0%" en rojo
const r1 = v => Math.round(v * 10) / 10 || 0;
const signo = v => { v = r1(v); return (v > 0 ? "+" : "") + n1.format(v) + "%"; };
const clase = v => r1(v) > 0 ? "up" : r1(v) < 0 ? "dn" : "";
const venc = v => v ? `${String(v).slice(8, 10)}/${String(v).slice(5, 7)}/${String(v).slice(2, 4)}` : "";
const fdate = v => v && v.toDate ? v.toDate().toISOString().slice(0, 10) : String(v || "").slice(0, 10);
const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const esISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s);
const fLarga = v => { const s = fdate(v); return esISO(s) ? `${+s.slice(8, 10)} ${MES[+s.slice(5, 7) - 1]} ${s.slice(0, 4)}` : s; };
const fDM = v => { const s = fdate(v); return esISO(s) ? `${+s.slice(8, 10)} ${MES[+s.slice(5, 7) - 1]}` : s; };
// precios con centavos (US$224,01); usd0 redondea de 100 para arriba, para
// rangos y ejes (US$237 / US$164), como el prototipo
const usd = v => "US$" + nf.format(v);
const usd0 = v => "US$" + (Math.abs(v) >= 100 ? n0 : nf).format(v);
const diaAR = d => new Date(d.getTime() - 3 * 3600e3).toISOString().slice(0, 10);
const hoyAR = diaAR(new Date());
const haceDias = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
const recorte = (s, n) => { s = String(s ?? "").trim(); return s.length > n ? s.slice(0, n).replace(/\s+\S*$/, "") + "…" : s; };
const mismoDia = f => { const d = Math.round((Date.parse(f) - Date.parse(hoyAR)) / 864e5); return d === 0 ? "hoy" : d === 1 ? "mañana" : `en ${d} días`; };

// ── estado compartido por las dos fichas (la completa y la del radar) ──
const S = { tk: t, ra: null, radar: [], precioUsd: null, user: null, pro: false,
            carteras: null, ocultas: [], tenencia: null, inf: null, otrosInf: [], claves: [] };

// Bolsa de cada símbolo, para el encabezado y para el símbolo de TradingView
// ("NASDAQ:AMD"). Si un ticker no está acá va sin prefijo: TradingView elige
// la plaza, que es peor que decírselo pero mejor que dejar el hueco vacío.
const BOLSA = {
  AAPL: "NASDAQ", AMD: "NASDAQ", AMZN: "NASDAQ", ASML: "NASDAQ", AVGO: "NASDAQ", CME: "NASDAQ",
  CRWD: "NASDAQ", DDOG: "NASDAQ", GGAL: "NASDAQ", GOOGL: "NASDAQ", INTC: "NASDAQ", KLAC: "NASDAQ",
  LRCX: "NASDAQ", MELI: "NASDAQ", META: "NASDAQ", MSFT: "NASDAQ", MU: "NASDAQ", NFLX: "NASDAQ",
  NVDA: "NASDAQ", PLTR: "NASDAQ", QQQ: "NASDAQ", SOUN: "NASDAQ", TSLA: "NASDAQ",
  AI: "NYSE", BMA: "NYSE", "BRK-B": "NYSE", CEPU: "NYSE", JNJ: "NYSE", JPM: "NYSE", KO: "NYSE",
  LLY: "NYSE", MA: "NYSE", MCD: "NYSE", NKE: "NYSE", NOW: "NYSE", PAM: "NYSE", SNOW: "NYSE",
  TGS: "NYSE", TSM: "NYSE", V: "NYSE", VIST: "NYSE", WMT: "NYSE", YPF: "NYSE",
  SPY: "AMEX", XLV: "AMEX",
};
const BOLSA_NOM = { NASDAQ: "Nasdaq", NYSE: "NYSE", AMEX: "NYSE Arca" };
// TradingView escribe las clases de acción con punto: BRK-B es BRK.B.
const simboloTV = tk => {
  const k = String(tk || "").toUpperCase();
  const s = k.replace(/-/g, ".");
  return BOLSA[k] ? BOLSA[k] + ":" + s : s;
};
// la familia del radar tal como se lee (el radar la guarda abreviada y sin tildes)
const SECTOR_RADAR = { Semis: "Semiconductores", Tecnologia: "Tecnología", eCommerce: "Comercio electrónico",
  "Bancos AR": "Bancos argentinos", "Energia AR": "Energía argentina", "ETF Salud": "ETF de salud" };
const sectorTxt = s => SECTOR_RADAR[s] || s || "";
// el mismo activo escrito de otra forma (NVDA.BA, BTC-USD, PAMP, GGAL.BA)
const idActivo = x => tickerFicha(x) || radarSym(x);
const mismo = x => !!x && idActivo(x) === idActivo(S.tk);

// ── búsqueda de otro activo (la de la ficha anterior, en la línea de volver) ──
const TOP_ROW = `<div class="va-top">
    <a class="va-back" href="/informes">← Empresas que seguimos</a>
    <div class="bx">
      <input id="bx-input" type="search" placeholder="Buscar otro activo — NVDA, Apple, AL30…" autocomplete="off" aria-label="Buscar otro activo">
      <div class="bx-panel" id="bx-panel"></div>
    </div>
  </div>`;

function montarTopRow() {
  const bxInput = document.getElementById("bx-input");
  const bxPanel = document.getElementById("bx-panel");
  if (!bxInput || !bxPanel) return;
  // bonos y letras en el buscador: se cargan del panel público la primera vez
  let BONOS_BX = null;
  async function cargarBonosBx() {
    if (BONOS_BX) return;
    BONOS_BX = [];
    try {
      const snap = await getDoc(doc(db, "bonosPanel", "latest"));
      if (!snap.exists()) return;
      const p = JSON.parse(snap.data().json || "{}");
      const meter = (arr, nom) => (arr || []).forEach(b =>
        BONOS_BX.push({ t: b.s, n: nom + (b.vence ? " · vence " + String(b.vence).slice(0, 10) : "") }));
      meter(p.soberanos, "Soberano USD");
      meter(p.bopreal, "Bopreal USD");
      meter(p.tasa_fija, "Lecap / Boncap $");
      meter(p.cer, "Bono CER $");
      meter(p.dolar_linked, "Dólar linked $");
    } catch (e) {}
  }
  const pintarLista = q => {
    q = (q || "").trim().toLowerCase();
    const items = EMPRESAS.filter(e => !q || e.ticker.toLowerCase().includes(q) || e.nombre.toLowerCase().includes(q));
    const empHtml = SECTORES.map(s => {
      const del = items.filter(e => e.sector === s.k);
      if (!del.length) return "";
      return `<div class="bx-g">${s.n}</div>` + del.map(e =>
        `<div class="bx-it" data-t="${e.ticker}"><span>${esc(e.nombre)}</span><span class="tk">${e.ticker}</span></div>`).join("");
    }).join("");
    const bonosDel = (BONOS_BX || []).filter(b => !q || b.t.toLowerCase().includes(q));
    const lim = q ? bonosDel : bonosDel.slice(0, 8);
    const bonosHtml = lim.length
      ? `<div class="bx-g">Bonos y letras</div>` + lim.map(b =>
        `<div class="bx-it" data-b="${b.t}"><span>${esc(b.n)}</span><span class="tk">${b.t}</span></div>`).join("")
      : "";
    bxPanel.innerHTML = (empHtml + bonosHtml) || '<div class="bx-it">Sin resultados — probá con el ticker (AL30, S30O6…)</div>';
    bxPanel.querySelectorAll(".bx-it[data-t]").forEach(it => it.addEventListener("mousedown", ev => {
      ev.preventDefault();
      location.href = "/activo?t=" + it.dataset.t;
    }));
    bxPanel.querySelectorAll(".bx-it[data-b]").forEach(it => it.addEventListener("mousedown", ev => {
      ev.preventDefault();
      location.href = "/bono?e=" + it.dataset.b;
    }));
  };
  const abrirLista = () => {
    pintarLista(bxInput.value);
    bxPanel.classList.add("open");
    cargarBonosBx().then(() => { if (bxPanel.classList.contains("open")) pintarLista(bxInput.value); });
  };
  bxInput.addEventListener("focus", abrirLista);
  bxInput.addEventListener("input", abrirLista);
  bxInput.addEventListener("blur", () => setTimeout(() => bxPanel.classList.remove("open"), 160));
  bxInput.addEventListener("keydown", ev => {
    if (ev.key === "Enter") {
      const it = bxPanel.querySelector(".bx-it[data-t], .bx-it[data-b]");
      if (it) location.href = it.dataset.t ? "/activo?t=" + it.dataset.t : "/bono?e=" + it.dataset.b;
    }
    if (ev.key === "Escape") bxPanel.classList.remove("open");
  });
}

// ── encabezado blanco: ← Empresas que seguimos, ticker, tipo · sector ·
// mercado, nombre; a la derecha precio, variación de hoy y hora ──
const cabecera = o => `<header class="va-mh"><div class="va-in">
    ${TOP_ROW}
    <div class="va-head">
      <div>
        <div class="va-id"><span class="va-tk">${esc(o.tk)}</span>${o.meta ? `<span class="va-meta">${esc(o.meta)}</span>` : ""}</div>
        <h1>${esc(o.nombre)}</h1>
      </div>
      <div class="va-px">
        <div class="p">${o.precio}</div>
        <div class="d">${o.d != null ? `<span class="${clase(o.d)}">${signo(o.d)} hoy</span>` : ""}${o.hora ? `<span class="c">${esc(o.hora)}</span>` : ""}</div>
      </div>
    </div>
  </div></header>`;
const metaDe = partes => partes.filter((x, i, a) => x && a.findIndex(y => String(y).toLowerCase() === String(x).toLowerCase()) === i).join(" · ");
// hora del último precio (la del sync, en la hora de Buenos Aires)
const horaPrecio = ts => {
  if (!ts || !ts.toDate) return "";
  const d = ts.toDate();
  const hh = d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "America/Argentina/Buenos_Aires" });
  return diaAR(d) === hoyAR ? `Actualizado hoy · ${hh} hs` : `Último precio · ${fDM(diaAR(d))}, ${hh} hs`;
};

// ── franja "Lectura de Valtia": veredicto, puntaje, RSI, zona y el botón ──
const VER = { Infravalorada: ["#1F7A4D", "Barata frente a su familia sectorial"],
              Estirada: ["#B23A3A", "Cara frente a su familia sectorial"],
              "En precio": ["#B7791F", "En línea con su familia sectorial"] };
// mismas zonas que el radar (35 / 50 / 65) para que la ficha no se contradiga
const rsiLect = r => r == null || !isFinite(r) ? ["#101010", "Sin dato del radar"]
  : r < 35 ? ["#1F7A4D", "Sobrevendida: cayó mucho en pocas ruedas"]
  : r > 65 ? ["#B23A3A", "Sobrecomprada: subió mucho en pocas ruedas"]
  : r >= 45 && r <= 55 ? ["#B7791F", "Ni sobrecomprada ni castigada"]
  : r < 50 ? ["#B7791F", "Débil: viene perdiendo fuerza"] : ["#B7791F", "Firme: viene ganando fuerza"];
function lecturaHtml(ra, rsiLocal) {
  const fund = !!(ra && ra.veredicto && ra.veredicto !== "Sin cobertura");
  const [vc, vs] = fund ? (VER[ra.veredicto] || ["#8A6A2F", "Lectura automática del radar"])
    : ["#8B8375", ra ? "Sin balance que valuar: es un ETF o una cripto" : "Todavía no lo sigue el radar de valuación"];
  const vTxt = fund ? ra.veredicto : ra ? "Sin cobertura" : "Fuera del radar";
  const score = fund && ra.score != null && isFinite(ra.score) ? Math.round(Math.max(0, Math.min(100, ra.score))) : null;
  const rsi = ra && ra.rsi != null ? Number(ra.rsi) : rsiLocal;
  const [rc, rt] = rsiLect(rsi);
  let zv = "No aplica", zs = "Hace falta un puntaje de valor", zc = "";
  if (fund && ra.entrada) { zv = "Adentro"; zs = "Puntaje de 60 o más y RSI debajo de 45"; zc = "#1F7A4D"; }
  else if (fund) {
    const falta = [];
    if (score == null || score < 60) falta.push("puntaje de 60 o más");
    if (rsi == null || rsi >= 45) falta.push("RSI debajo de 45");
    zv = "Afuera"; zs = falta.length ? "Le falta " + falta.join(" y ") : "Todavía no cumple las condiciones del radar";
  }
  return `<section class="va-lect" id="general" aria-label="Lectura de Valtia">
    <div><div class="l">Lectura de Valtia</div>
      <div class="va-ver"><span class="va-dot" style="background:${vc}"></span><span class="v" style="color:${vc}">${esc(vTxt)}</span></div>
      <div class="s">${vs}${ra && ra.pierdePlata ? ' · <span style="color:#B7791F" title="El puntaje mide qué tan barata cotiza, no si gana dinero">no gana plata</span>' : ""}</div></div>
    <div><div class="l">Puntaje de valor</div>
      <div class="v">${score != null ? `${score} <span class="de">/ 100</span>` : "—"}</div>
      ${score != null ? `<div class="va-bar"><i style="width:${score}%"></i></div>` : `<div class="s">${fund ? "Sin puntaje publicado" : "No aplica"}</div>`}</div>
    <div><div class="l">Momento (RSI 14)</div>

async function llenarCarteras(pro) {
  const mio = ++cartSeq;

    const snap = pro ? await getDocs(query(collection(db, "carterasModelo"), where("visibilidad", "in", ["publico", "clientes"]))).catch(() => { pro = false; return publicas(); })
                     : await publicas();
    lista = await Promise.all(snap.docs.filter(d => d.data().estado === "activa").map(async d => {
      const c = d.data();

      const pos = ps ? ps.docs.map(x => x.data()).find(p => p.estado === "activa" && mismo(p.ticker)) || null : null;

      return { id: d.id, nombre: c.nombre || d.id, codigo, color: colorDe(codigo), vis: c.visibilidad, pos, hist };

  } catch (e) { lista = null; }
  // las PRO que esta sesión no puede leer: solo se nombran (carterasTeaser es público)

}

// Cómo comprarlo desde Argentina: CEDEAR y ratio oficial de BYMA (catálogo),
// precio en pesos (solo con sesión: precios/{S}.BA o preciosCatalogo/latest)
// y la equivalencia con el CCL. Sin dato, la fila no va.
const ratioTxt = r => r >= 1 ? `${nCant.format(r)} : 1` : `1 : ${nCant.format(Math.round(1 / r))}`;
let comoSeq = 0;
async function llenarComo(user) {
  const mio = ++comoSeq;
  const card = document.getElementById("como"), box = document.getElementById("como-box");
  if (!card || !box) return;
  const cat = await import("./catalogo-activos.js?v=2").catch(() => null);
  if (!cat || typeof cat.entradasCatalogo !== "function") return;
  const tk = S.tk;
  // el CEDEAR tiene que ser DE este activo: si la nómina dice que su
  // subyacente es otro símbolo (u) no es el mismo papel, y si cotiza en otra
  // bolsa (b: B3, Xetra, Londres) el ratio no es contra este precio en dólares
  const ced = cat.entradasCatalogo(tk).find(e => e.m === "byma" && e.t === "cedear" && !e.b && (!e.u || idActivo(e.u) === idActivo(tk))) || null;
  const loc = ced ? null : cat.entradasCatalogo(radarSym(tk)).find(e => e.m === "byma" && e.t === "accion_ar") || null;
  const cri = ced || loc ? null : cat.entradasCatalogo(tk).find(e => e.m === "cripto") || null;
  if (!ced && !loc && !cri) return;
  const r = ced && Number(ced.r) > 0 ? Number(ced.r) : null;
  const clave = ced ? ced.s + ".BA" : loc ? loc.s + ".BA" : null;
  // precio en pesos: precios/{S}.BA (lo refresca el intradía) o el catálogo
  let pesos = null;
  if (user && clave) {
    try {
      const s = await getDoc(doc(db, "precios", clave));
      const d = s.exists() ? s.data() : null;
      if (d && Number(d.precio) > 0 && d.moneda === "ARS")
        pesos = { p: Number(d.precio), cuando: d.actualizado_utc && d.actualizado_utc.toDate ? fDM(diaAR(d.actualizado_utc.toDate())) : "" };
    } catch (e) {}
    if (!pesos) {
      try {
        const s = await getDoc(doc(db, "preciosCatalogo", "latest"));
        const fila = s.exists() ? (JSON.parse(s.data().json || "{}") || {})[clave] : null;
        if (Array.isArray(fila) && Number(fila[0]) > 0 && fila[2] === "ARS")
          pesos = { p: Number(fila[0]), cuando: esISO(String(fila[3] || "")) ? fDM(fila[3]) : "" };
      } catch (e) {}
    }
  }
  const fxm = await import("./fx.js?v=1").then(m => m.fxMercado()).catch(() => null);
  const ccl = fxm && Number(fxm.ccl) > 0 ? Number(fxm.ccl) : null;
  if (mio !== comoSeq) return;
  const px = S.precioUsd;
  const filas = [];
  const pesoTxt2 = p => "$" + (p >= 100 ? n0 : nf).format(p);
  if (ced) {
    filas.push(["CEDEAR en BYMA", esc(ced.s)]);
    if (r) filas.push(["Ratio de conversión", ratioTxt(r)]);
    if (pesos) filas.push([`Precio en pesos${pesos.cuando ? " (" + esc(pesos.cuando) + ")" : ""}`, pesoTxt2(pesos.p)]);
    if (r && px > 0 && ccl) filas.push(["Equivale a", `${usd(px)} × CCL $${n0.format(ccl)} ${r >= 1 ? "÷ " + nCant.format(r) : "× " + nCant.format(Math.round(1 / r))}`]);
    if (r && px > 0 && pesos) filas.push(["CCL implícito", "$" + n0.format(pesos.p * r / px)]);
    else if (r && px > 0 && ccl) filas.push(["Precio teórico en pesos", "≈ " + pesoTxt2(px * ccl / r)]);
    if (r && px > 0) filas.push(["Cada CEDEAR, en dólares", "≈ " + usd(px / r)]);
  } else if (loc) {
    filas.push(["Acción en BYMA, en pesos", esc(loc.s)]);
    if (BOLSA[tk]) filas.push([`ADR en ${BOLSA_NOM[BOLSA[tk]] || BOLSA[tk]}, en dólares`, esc(tk)]);
    if (pesos) filas.push([`Precio en pesos${pesos.cuando ? " (" + esc(pesos.cuando) + ")" : ""}`, pesoTxt2(pesos.p)]);
  } else {
    filas.push(["CEDEAR en BYMA", "No tiene"]);
    filas.push(["Dónde se opera", "Exchanges de cripto"]);
  }
  const notas = [];
  if (ced && r) notas.push(`Ratio oficial de la nómina de CEDEARs de BYMA: ${r >= 1 ? `${nCant.format(r)} CEDEARs equivalen a una acción` : `un CEDEAR equivale a ${nCant.format(Math.round(1 / r))} acciones`}.`);
  if (ccl && ced && r && px > 0) notas.push(`CCL de dolarapi (el de la barra de cotizaciones).`);
  if (!user && clave) notas.push(`<a href="/?login=1">Ingresá</a> para ver el precio en pesos de BYMA.`);
  box.innerHTML = filas.map(([l, v]) => `<div class="va-kv"><span>${l}</span><b>${v}</b></div>`).join("")
    + (notas.length ? `<div class="va-fuente">${notas.join(" ")}</div>` : "");
  card.hidden = false;
}

// "Ya la tenés" y "Tu posición": solo con sesión, de inversores/{email}/cartera
async function llenarTenencia(user, conPosicion) {
  let lotes = [];
  if (user && user.email) {
    try {
      const snap = await getDocs(collection(db, "inversores", user.email, "cartera"));
      lotes = snap.docs.map(x => x.data()).filter(p => mismo(p.ticker) && Number(p.cantidad) > 0);
    } catch (e) { lotes = []; }
  }
  const esBA = p => /\.BA$/i.test(String(p.ticker || ""));
  const suma = l => l.reduce((a, p) => a + (Number(p.cantidad) || 0), 0);
  const ba = lotes.filter(esBA), ext = lotes.filter(p => !esBA(p));
  S.tenencia = !lotes.length ? null
    : ba.length && ext.length ? `${lotes.length} posiciones`
    : ba.length ? `${nCant.format(suma(ba))} ${emp && emp.sector === "arg" ? "acciones" : "CEDEARs"}`
    : `${nCant.format(suma(ext))} ${/^(BTC|ETH)$/.test(S.tk) ? S.tk : "u."}`;
  pintarCta();
  const cont = document.getElementById("mi-pos");
  if (!conPosicion || !cont) return;
  // los .BA cotizan en pesos y no se valúan con el precio en dólares
  const px = S.precioUsd;
  if (!ext.length) { cont.innerHTML = ""; return; }
  const cant = suma(ext);
  const conCosto = ext.filter(p => Number(p.precioCompra) > 0);
  const cantCosto = conCosto.reduce((a, p) => a + Number(p.cantidad), 0);
  const costo = conCosto.reduce((a, p) => a + Number(p.cantidad) * Number(p.precioCompra), 0);
  const ppc = cantCosto ? costo / cantCosto : null;
  const valor = px ? cant * px : null;
  const pnlPct = ppc && px ? (px / ppc - 1) * 100 : null;
  const pnlUsd = ppc && px ? (px - ppc) * cantCosto : null;
  const item = (l, v, s) => `<div><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
  cont.innerHTML = `<div class="mi-pos">
    <div class="tt">Tu posición en ${esc(S.nombre || S.tk)}</div>
    ${item("Tenencia", nCant.format(cant) + " u.", "")}
    ${valor != null ? item("Valor hoy", "US$" + nf.format(valor), "al último precio") : ""}
    ${ppc != null ? item("Precio promedio", "US$" + nf.format(ppc), cantCosto < cant ? "sobre los lotes con costo cargado" : "") : ""}
    ${pnlPct != null ? item("Resultado", `<span class="${clase(pnlPct)}">${signo(pnlPct)}</span>`,
      (pnlUsd >= 0 ? "+" : "−") + "US$" + nf.format(Math.abs(pnlUsd))) : ""}
  </div>`;
}

  box.innerHTML = `<div class="va-sent-v">${tot >= MIN ? `${pa}% alcista <small>· ${tot} votos</small>` : tot ? `${tot} ${tot === 1 ? "voto" : "votos"} por ahora` : "Todavía nadie votó"}</div>

    <div class="sent"><button class="alc${votoDe("alcista")}" data-voto="alcista">▲ Alcista${tot >= MIN ? " · " + alc : ""}</button><button class="baj${votoDe("bajista")}" data-voto="bajista">▼ Bajista${tot >= MIN ? " · " + baj : ""}</button></div>
    <div class="va-sent-s" data-sent-msg>${mio ? `Votaste ${mio.voto === "alcista" ? "alcista" : "bajista"}.${espera ? ` Podés cambiarlo en ${espera} min.` : " Podés cambiarlo una vez por hora."}` : "¿Cómo lo ves para las próximas semanas? Un voto por persona."}${tot && tot < MIN ? ` El porcentaje se muestra desde ${MIN} votos.` : ""} Es la opinión de usuarios registrados, no un dato de mercado.</div>`;
  box.querySelectorAll("[data-voto]").forEach(btn => btn.onclick = async () => {
    const msg = box.querySelector("[data-sent-msg]");
    if (mio && mio.voto === btn.dataset.voto) return;
    if (!user.emailVerified) { msg.innerHTML = `<span class="dn">Verificá tu email para votar.</span>`; return; }
    if (espera) { msg.innerHTML = `<span class="dn">Votaste hace poco: podés cambiar el voto en ${espera} min.</span>`; return; }
    box.querySelectorAll("[data-voto]").forEach(x => x.disabled = true);
    try {
      await setDoc(doc(col, user.uid), { voto: btn.dataset.voto, fecha: serverTimestamp() });
      await pintarSentimiento(user);
    } catch (e) {
      box.querySelectorAll("[data-voto]").forEach(x => x.disabled = false);
      if (msg && msg.isConnected) msg.innerHTML = `<span class="dn">No se pudo guardar el voto. Probá de nuevo en un rato.</span>`;
    }
  });
};

// ── Los números: tarjetas ratio / valor / comparación con la mediana de su
// familia en el radar (verde si está mejor, ámbar si pide atención) ──
const mediana = xs => {
  const v = xs.filter(x => x != null && isFinite(x)).sort((a, b) => a - b);
  if (v.length < 3) return null;   // con menos de tres pares no hay mediana que diga algo
  const m = v.length >> 1;
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
};
// la mediana de sus PARES: el propio activo no entra (si no, en una familia
// chica la "mediana del sector" podía ser su mismo número, como en AMD)
const medSector = (campo, soloPositivos) => {
  const ra = S.ra;
  if (!ra || !ra.sector) return null;
  return mediana(S.radar.filter(a => a.sector === ra.sector && a.sym !== ra.sym && a[campo] != null)
    .map(a => Number(a[campo])).filter(v => !soloPositivos || v > 0));
};
// dir < 0: cuanto más bajo, mejor (múltiplos, deuda); dir > 0: cuanto más alto
const frente = (v, med, dir, fmt, pal) => {
  if (med == null) return { s: "", c: "" };
  if (dir < 0 && v <= 0) return { s: `Negativo: no se compara · sector ${fmt(med)}`, c: "a" };
  const rel = (v - med) / Math.abs(med || 1);
  if (Math.abs(rel) < 0.05) return { s: `Sector ${fmt(med)} · en línea`, c: "" };
  const mejor = dir < 0 ? v < med : v > med;
  return { s: `Sector ${fmt(med)} · ${mejor ? pal[0] : pal[1]}`, c: mejor ? "b" : "a" };
};
const tarjeta = n => `<div class="va-num"><div class="l" title="${esc(n.l)}">${esc(n.l)}</div><div class="v">${n.v}</div>${n.s ? `<div class="s${n.c ? " " + n.c : ""}">${n.s}</div>` : ""}</div>`;
const SALUD = [null, "Entre las más bajas", "Por debajo del medio", "En el medio", "Por encima del medio", "Entre las más altas"];
const saludHtml = n => n ? `<div class="salud n${n}">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</div>` : "";
const RECO = { strong_buy: "Compra fuerte", buy: "Compra", hold: "Mantener", sell: "Venta", strong_sell: "Venta fuerte" };
const dy = v => (v > 0 && v < 1 ? nf : n1).format(v) + "%";
const usdM = v => "US$" + n0.format(v / 1e6) + " M";
// las que salen del radar público: capitalización, dividendo, calidad y consenso
function numerosPublicos(ra, add) {
  if (!ra) return;
  if (Number(ra.mktcap) > 0) {
    const med = medSector("mktcap", true);
    add("Capitalización", usdM(ra.mktcap), med ? `Mediana del sector ${usdM(med)}` : "", "");
  }
  if (ra.divYield != null && isFinite(ra.divYield)) {
    const med = medSector("divYield");
    const f = med == null ? { s: ra.divYield > 0 ? "Dividendo anual sobre el precio" : "No paga dividendos", c: "" }
      : { s: `Sector ${dy(med)}${ra.divYield > med * 1.05 ? " · paga más" : ra.divYield < med * 0.95 ? " · paga menos" : " · en línea"}`, c: ra.divYield > med * 1.05 ? "b" : "" };
    add("Rendimiento por dividendo", dy(ra.divYield), f.s, f.c);
  }
  const nivel = ra.calidadNivel >= 1 && ra.calidadNivel <= 5 ? Math.round(ra.calidadNivel) : null;
  if (nivel) add("Calidad relativa", `${SALUD[nivel]}${saludHtml(nivel)}`,
    `Deuda, crecimiento y margen frente al radar${S.pro && ra.calidadScore != null ? ` · ${Math.round(ra.calidadScore)}/100` : ""}`,
    nivel >= 4 ? "b" : nivel <= 2 ? "a" : "");
  if (RECO[ra.reco]) add("Consenso de analistas", RECO[ra.reco],
    S.pro && ra.nAnalistas && ra.target ? `${ra.nAnalistas} analistas · objetivo US$${nf.format(ra.target)} (${signo(ra.upside)})`
      : "Promedio de analistas de terceros, no de Valtia", "");
}
