<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de activo — Valtia Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Ficha de activo: todo lo del activo en un solo lugar ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#101010;--sub:#57534A;--mut:#8B8375;--navy:#0E1830;--gold:#B08A3E;--gold2:#8A6A2F;--line:#E7E3DA;--marfil:#F6F3EC;--up:#1F7A4D;--dn:#B23A3A}
html{scroll-behavior:smooth}
body{background:#fff;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink)}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}
img{max-width:100%}

nav{position:sticky;top:0;z-index:200;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;background:rgba(14,24,48,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,206,150,.14)}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:.06em;color:#fff}
.nav-name em{color:#E8CE96;font-style:italic}
.nav-sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.nav-links{display:flex;align-items:center;gap:26px}
.nav-links a{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.nav-links a:hover,.nav-links a.active{color:#E8CE96}
.nav-cta{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#0E1830;background:#E8CE96;padding:9px 22px;border-radius:8px;text-decoration:none}
.nav-cta:hover{background:#fff;color:#0E1830}
@media(max-width:880px){.nav-links{display:none}}

.wrap{max-width:1240px;margin:0 auto;padding:26px 52px 60px}

/* barra superior: volver + buscador de activos */
.top-row{display:flex;gap:16px;align-items:center;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.volver{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);white-space:nowrap;cursor:pointer}
.volver:hover{color:var(--gold)}
.bx{position:relative;flex:1;max-width:430px}
.bx input{width:100%;padding:11px 14px;border:1px solid var(--line);background:#fff;font:400 13.5px 'IBM Plex Sans',sans-serif;color:var(--ink);outline:none}
.bx input:focus{border-color:var(--gold)}
.bx-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);box-shadow:0 14px 40px rgba(16,16,16,.12);max-height:380px;overflow-y:auto;z-index:150;display:none}
.bx-panel.open{display:block}
.bx-g{font:700 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);padding:10px 14px 5px;background:var(--marfil)}
.bx-it{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;cursor:pointer;font:400 13px 'IBM Plex Sans',sans-serif}
.bx-it:hover{background:var(--marfil)}
.bx-it .tk{font:600 11px 'IBM Plex Mono',monospace;color:var(--mut)}

/* cabecera del activo */
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:24px}
.head .sec{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-bottom:8px}
.head h1{font:700 clamp(30px,3.4vw,42px) 'Playfair Display',serif;line-height:1.05}
.head h1 span{font:600 18px 'IBM Plex Mono',monospace;color:var(--mut);margin-left:12px}
.head .px{text-align:right}
.head .px .p{font:600 34px 'IBM Plex Sans',sans-serif;font-variant-numeric:tabular-nums}
.head .px .d{font:600 15px 'IBM Plex Sans',sans-serif;font-variant-numeric:tabular-nums}
.head .px .h{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--mut);margin-top:3px}
.up{color:var(--up)}.dn{color:var(--dn)}

/* ── ficha v2: estado, dos columnas, puntuación, rendimientos ── */
.head-meta{font:400 11.5px 'IBM Plex Sans',sans-serif;color:var(--mut);margin-top:8px}
.head .px .p{font-size:40px;line-height:1}
.head .px .d{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:4px;font-size:14px}
.head .px .d.up{background:#E4F3EA}.head .px .d.dn{background:#F8E5E5}
.estado{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:22px}
.estado .et{background:#fff;padding:14px 18px;min-width:0;position:relative;overflow:hidden}
.estado .l{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.estado .v{font:600 15px 'IBM Plex Sans',sans-serif;margin-top:7px;font-variant-numeric:tabular-nums}
.estado .s{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--sub);margin-top:5px;line-height:1.5}
.barra{position:relative;height:6px;background:var(--marfil);border-radius:3px;margin:11px 0 6px}
.barra i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:linear-gradient(90deg,#B23A3A,#B08A3E 50%,#1F7A4D)}
.barra i.neutra{background:linear-gradient(90deg,#E7E3DA,#B08A3E)}
.barra b{position:absolute;top:-4px;width:3px;height:14px;background:var(--navy);transform:translateX(-50%);border-radius:1px}
.barra-l{display:flex;justify-content:space-between;gap:6px;font:500 9.5px 'IBM Plex Mono',monospace;color:var(--mut)}
.ficha-grid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
.col-main>.card-w+.card-w,.col-side>.card-w+.card-w{margin-top:22px}
.rend{display:grid;grid-template-columns:repeat(8,1fr);border-top:1px solid var(--line)}
.rend .r{padding:10px 6px;text-align:center;border-right:1px solid var(--line);min-width:0}
.rend .r:last-child{border-right:none}
.rend .rl{font:600 8.5px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.rend .rv{font:600 13px 'IBM Plex Mono',monospace;margin-top:4px;font-variant-numeric:tabular-nums}
.rend-nota{padding:8px 18px 12px;font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--mut);line-height:1.5;border-top:1px solid var(--line)}
.punt{padding:4px 18px 8px;position:relative}
.punt .pr{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.punt .lock .pr:last-child{border-bottom:none}
.punt .pl{font:600 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.punt .pv{font:600 15px 'IBM Plex Sans',sans-serif;margin-top:3px}
.punt .ps{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--sub);margin-top:2px;line-height:1.45}
.gauge{width:84px;height:50px;display:block}
.stg{border-top:1px solid var(--line)}
.stg:first-child{border-top:none}
.stg-t{font:700 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);padding:12px 18px 8px}
.lock{position:relative}
@media(max-width:960px){.ficha-grid{grid-template-columns:1fr}.rend{grid-template-columns:repeat(4,1fr)}.rend .r:nth-child(4){border-right:none}.estado{grid-template-columns:1fr}}

/* tu posición (solo cliente logueado con tenencia) */
.mi-pos{background:var(--marfil);border:1px solid var(--line);border-left:3px solid var(--gold);padding:15px 20px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:10px 36px;align-items:baseline}
.mi-pos .tt{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);width:100%}
.mi-pos .l{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.mi-pos .v{font:600 17px 'IBM Plex Mono',monospace;margin-top:3px;font-variant-numeric:tabular-nums}
.mi-pos .s{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--sub);margin-top:2px}

/* tarjetas */
.card-w{background:#fff;border:1px solid var(--line)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.card-h .t{font:700 12px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.card-h .s{font:400 10.5px 'IBM Plex Sans',sans-serif;color:var(--mut)}

/* gráfico */
.chart-box{height:330px;position:relative;padding:16px}
.rangos{display:flex;gap:6px}
.rangos button{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;cursor:pointer;padding:5px 12px;border:1px solid var(--line);background:#fff;color:var(--sub)}
.rangos button.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* grilla radar + informe */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.dp-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin:18px 0}
.dp-t{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.dp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:12px}
.dp-chip{text-align:center}
.dp-l{font-size:10.5px;color:var(--muted);margin-bottom:4px}
.dp-v{font-family:'Cormorant Garamond',serif;font-size:21px;line-height:1}
.dp-v.pos{color:#4caf50}.dp-v.neg{color:#ef5350}
.dp-nota{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.stats .st{background:#fff;padding:14px 16px}
.stats .l{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.stats .v{font:600 16px 'IBM Plex Mono',monospace;margin-top:5px;font-variant-numeric:tabular-nums}
.stats .z{font:400 10px 'IBM Plex Sans',sans-serif;color:var(--sub);margin-top:2px}
.veredicto{position:relative;border-top:1px solid var(--line)}
.veredicto .inner{padding:18px}
.ver-tag{display:inline-block;font:700 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;color:#fff;background:var(--gold2)}
.ver-tag.infra{background:var(--up)}.ver-tag.cara{background:var(--dn)}
.scores{display:flex;gap:22px;margin-top:14px}
.scores .sc{flex:1}
.scores .n{font:600 20px 'IBM Plex Mono',monospace}
.scores .e{font:400 10px 'IBM Plex Sans',sans-serif;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.entrada{margin-top:12px;font:600 12px 'IBM Plex Sans',sans-serif;color:var(--up)}
.preview-blur{filter:blur(6px);pointer-events:none;user-select:none}
.pro-overlay{position:absolute;inset:0;background:rgba(246,243,236,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:5}
.pro-overlay h4{font:400 19px 'Playfair Display',serif}
.pro-overlay p{font-size:12px;color:var(--sub);max-width:250px;text-align:center;line-height:1.5}
.pro-overlay .btn{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#fff;padding:9px 20px}

/* informe */
.inf-cover{display:block}
.inf-cover img{width:100%;display:block}
.inf-body{padding:16px 18px}
.inf-body h3{font:700 19px 'Playfair Display',serif;line-height:1.25;margin-bottom:8px}
.inf-body p{font:400 12.5px 'IBM Plex Sans',sans-serif;color:var(--sub);line-height:1.65;margin-bottom:12px}
.inf-meta{font:500 10px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.inf-desde{font:600 13px 'IBM Plex Sans',sans-serif;margin-bottom:14px;font-variant-numeric:tabular-nums}
.btn-leer{display:inline-block;font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;background:#0E1830;color:#fff;padding:11px 22px}
.btn-leer:hover{background:var(--gold);color:#fff}
.badge{font:700 9px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px}
.b-free{background:#E4F3EA;color:var(--up)}.b-cli{background:#0E1830;color:#E8CE96}

/* noticias del activo */
.act-news{margin-top:22px}
.act-news a{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);color:var(--ink);align-items:center}
.act-news a:last-child{border-bottom:none}
.act-news .im{aspect-ratio:16/10;background:linear-gradient(135deg,#14213D,#B08A3E);background-size:cover;background-position:center}
.act-news .tt{font:600 14px 'IBM Plex Sans',sans-serif;line-height:1.4}
.act-news a:hover .tt{text-decoration:underline;text-decoration-color:rgba(176,138,62,.55);text-underline-offset:3px}
.act-news .f{font:500 10px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.vacio{padding:22px 18px;font:400 12.5px 'IBM Plex Sans',sans-serif;color:var(--mut)}

.empty-state{padding:80px 52px;text-align:center;font:400 15px 'IBM Plex Sans',sans-serif;color:var(--sub)}


/* ── estilos del lector de informes (compartidos con informes.html) ── */
.fsr-badge{font:600 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;background:var(--gold);color:#fff;padding:4px 10px;text-transform:uppercase}
.fsr-tag{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;border:1px solid var(--line);padding:3px 8px;color:var(--sub);text-transform:uppercase}
.fsr-state{border:1px dashed var(--line);text-align:center;padding:44px 20px;color:var(--sub);line-height:1.9;font-size:14px}
/* lector de registros (research completo) — clases usadas por el módulo */
.fsr-crumb{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-bottom:22px}
.fsr-crumb a{color:var(--sub)}
.fsr-crumb a:hover{color:var(--gold)}
.fsr-reader{background:#fff;border:1px solid var(--line);padding:clamp(24px,4vw,50px);max-width:860px;margin:0 auto}
.fsr-rhead{border-bottom:2px solid var(--gold);padding-bottom:22px;margin-bottom:8px}
.fsr-rhead h1{font:700 clamp(28px,4vw,40px) 'Playfair Display',serif;line-height:1.15;color:var(--ink)}
.fsr-rhead .meta{font:500 11px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:12px}
.fsr-reader h2{font:700 26px 'Playfair Display',serif;margin:42px 0 14px;padding-top:26px;border-top:1px solid var(--line);color:var(--ink)}
.fsr-reader h3{font:600 15.5px 'IBM Plex Sans',sans-serif;margin:24px 0 8px;color:var(--ink)}
.fsr-reader p{margin:11px 0;font-size:14.5px;line-height:1.85;color:#2E2A24}
.fsr-reader p strong,.fsr-reader li strong{color:var(--ink);font-weight:600}
.fsr-reader ul{margin:10px 0 10px 22px}
.fsr-reader li{margin:7px 0;font-size:14px;line-height:1.8;color:#2E2A24}
.fsr-reader .kicker{color:var(--mut);font-style:italic}
.fsr-reader .tag{display:inline-block;font:600 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--gold);padding:3px 9px;margin:18px 0 4px}
.fsr-reader .tag.bull{background:#1F7A4D}
.fsr-reader .tag.bear{background:#B23A3A}
.fsr-reader .tag.neutral{background:#b7791f}
.fsr-reader .fecha{font:500 11px 'IBM Plex Sans',sans-serif;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.fsr-reader table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px;display:block;overflow-x:auto}
.fsr-reader th{text-align:left;background:var(--marfil);color:var(--ink);padding:10px 12px;font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.fsr-reader td{padding:10px 12px;border-bottom:1px solid var(--line);color:#2E2A24;vertical-align:top;line-height:1.7;min-width:130px}
.fsr-reader td strong{color:var(--ink)}
.fsr-reader .card{background:var(--marfil);border:1px solid var(--line);border-left:3px solid var(--gold);padding:16px 20px;margin:18px 0;font-size:13.5px;line-height:1.8;color:#2E2A24}
.fsr-reader .card.warn{border-left-color:#b7791f}
.fsr-reader .card.risk{border-left-color:#B23A3A}
.fsr-reader .card.ok{border-left-color:#1F7A4D}
.fsr-reader .card strong{color:var(--ink)}
.fsr-reader .disclaimer{margin-top:44px;padding:18px 22px;background:var(--marfil);font-size:11.5px;color:var(--mut);line-height:1.7}
/* KPIs del informe (tiles) */
.fsr-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 8px}
.fsr-kpi{background:var(--marfil);border:1px solid var(--line);padding:12px 14px;min-width:0}
.fsr-kpi .l{font:600 8.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.fsr-kpi .v{font:600 15.5px 'IBM Plex Mono',monospace;color:var(--ink);white-space:nowrap}
.fsr-kpi .s{font-size:10px;color:var(--sub);margin-top:3px;line-height:1.4}
@media(max-width:700px){.fsr-kpis{grid-template-columns:repeat(2,1fr)}}

/* barras de valuación por año */
.fsr-bars{display:flex;gap:12px;align-items:flex-end;height:130px;margin:18px 0 4px;padding:0 2px}
.fsr-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.fsr-bar .col{width:100%;max-width:66px;background:#B08A3E;min-height:4px}
.fsr-bar.est .col{background:repeating-linear-gradient(45deg,#B08A3E,#B08A3E 5px,#D9BE85 5px,#D9BE85 10px)}
.fsr-bar .n{font:600 11px 'IBM Plex Mono',monospace;color:var(--ink)}
.fsr-bar .y{font:600 9.5px 'IBM Plex Sans',sans-serif;color:var(--mut)}
.fsr-caption{font-size:10.5px;color:var(--mut);margin:6px 0 18px}

/* rango de precios objetivos del consenso */
.fsr-rango{margin:20px 0 8px}
.fsr-rango .track{position:relative;height:8px;background:linear-gradient(90deg,#E7E3DA,#B08A3E)}
.fsr-rango .mark{position:absolute;top:-6px;width:3px;height:20px;background:#0E1830}
.fsr-rango .mark span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:700 10px 'IBM Plex Mono',monospace;color:#0E1830;white-space:nowrap}
.fsr-rango .labels{display:flex;justify-content:space-between;font:500 10px 'IBM Plex Mono',monospace;color:var(--sub);margin-top:8px}

/* FODA 2×2 */
.fsr-foda{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.fsr-foda .q{border:1px solid var(--line);border-top:3px solid var(--c);padding:14px 16px;min-width:0}
.fsr-foda h4{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin:0 0 8px;border:none;padding:0}
.fsr-foda ul{margin:0 0 0 16px}
.fsr-foda li{font-size:12.5px;line-height:1.65;color:#2E2A24;margin:6px 0}
@media(max-width:700px){.fsr-foda{grid-template-columns:1fr}}

footer{background:#0B1327;padding:28px 52px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:46px}
.footer-copy{font:400 11px 'IBM Plex Sans',sans-serif;color:rgba(255,255,255,.35)}
.footer-links{display:flex;gap:20px}
.footer-links a{font:500 11px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.55);text-transform:uppercase}
.wa-float{position:fixed;bottom:28px;left:28px;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:100;transition:transform .2s;text-decoration:none}
.wa-float:hover{transform:scale(1.1)}

@media(max-width:960px){.dos{grid-template-columns:1fr}}
@media(max-width:880px){.wrap,footer{padding-left:20px;padding-right:20px}}
@media(max-width:600px){.head .px{text-align:left}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<script type="module">
/* ── Ficha de activo: precio + gráfico + radar + informe + noticias ── */
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, getDoc, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { EMPRESAS, SECTORES } from './empresas.js?v=3';
import { radarSym, tickerFicha, mergeRadar } from './activos.js?v=6';

const app = getApps().length ? getApp() : initializeApp({
  apiKey: 'AIzaSyCxKNw0995b8a7XXyENiMjDQbfRCe9IBlw',
  authDomain: 'valtia-analytics.firebaseapp.com',
  projectId: 'valtia-analytics',
});
const db = getFirestore(app);

// símbolo del radar: radarSym() de activos.js (PAM -> PAMP, YPF -> YPFD)
const t = (new URLSearchParams(location.search).get("t") || "NVDA").toUpperCase();
const emp = EMPRESAS.find(e => e.ticker === t);
const ficha = document.getElementById("ficha");
if (!emp) location.replace("informes.html");

const nf = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const n1 = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const compacto = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const signo = v => (v > 0 ? "+" : "") + n1.format(v) + "%";
const clase = v => v > 0 ? "up" : v < 0 ? "dn" : "";
const venc = v => v ? `${String(v).slice(8, 10)}/${String(v).slice(5, 7)}/${String(v).slice(2, 4)}` : "";
const fdate = v => v && v.toDate ? v.toDate().toISOString().slice(0, 10) : String(v || "").slice(0, 10);

document.title = `${emp.nombre} (${t}) — Valtia Analytics`;
const sectorN = (SECTORES.find(s => s.k === emp.sector) || {}).n || "";

try {
  const [pxSnap, histSnap, radarSnap, radarProSnap, infSnap, notSnap, desgSnap] = await Promise.all([
    getDoc(doc(db, "preciosInformes", "latest")).catch(() => null),
    getDoc(doc(db, "historialInformes", t)).catch(() => null),
    getDoc(doc(db, "radar", "latest")).catch(() => null),
    getDoc(doc(db, "radarPro", "latest")).catch(() => null),   // 403 si no es cliente
    emp.slug ? getDoc(doc(db, "informes", emp.slug)).catch(() => null) : Promise.resolve(null),
    getDocs(query(collection(db, "noticias"), where("estado", "==", "publicado"))).catch(() => null),
    getDoc(doc(db, "desglosePeriodos", "latest")).catch(() => null),
  ]);

  // precio en vivo
  const precios = pxSnap && pxSnap.exists() ? JSON.parse(pxSnap.data().json || "{}") : {};
  const px = precios[t] || {};
  const ts = pxSnap && pxSnap.exists() ? pxSnap.data().actualizado_utc : null;
  const hora = ts && ts.toDate ? ts.toDate().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false }) : "";

  // radar: lo público (veredicto, precio, RSI) más lo PRO (múltiplos y
  // fundamentals) cuando las reglas dejaron leerlo
  const radarPub = radarSnap && radarSnap.exists() ? JSON.parse(radarSnap.data().json || "{}") : {};
  const radarProDoc = radarProSnap && radarProSnap.exists() ? JSON.parse(radarProSnap.data().json || "{}") : null;
  const _m = mergeRadar(radarPub, radarProDoc);
  const radar = { ..._m, activos: _m.activos };
  const conRatios = _m.pro;
  const ra = (radar.activos || []).find(a => a.sym === radarSym(t));

  // informe (si las reglas lo dejan leer; si no, tarjeta genérica bloqueada)
  const inf = infSnap && infSnap.exists() ? infSnap.data() : null;
  const cover = `img/${emp.slug}.svg`;
  const desde = inf && inf.precio_pub && px.p ? (px.p / inf.precio_pub - 1) * 100 : null;


  // histórico de cierres (2 años): gráfico, rango de 52 semanas y rendimiento a 6 meses
  const serie = histSnap && histSnap.exists() ? JSON.parse(histSnap.data().json || "[]") : [];
  const ult52 = serie.slice(-252).map(p => Number(p[1])).filter(v => isFinite(v) && v > 0);
  const r52 = ult52.length >= 20 ? (() => {
    const min = Math.min(...ult52), max = Math.max(...ult52);
    return { min, max, pos: px.p && max > min ? Math.max(0, Math.min(100, (px.p - min) / (max - min) * 100)) : null };
  })() : null;
  const cierre = i => serie.length > i ? Number(serie[serie.length - 1 - i][1]) : null;
  const seisM = cierre(0) && cierre(126) ? (cierre(0) / cierre(126) - 1) * 100 : null;

  // estadísticas, agrupadas como se leen: mercado (gratis), y con PRO la
  // valuación, la rentabilidad y la solidez. Sin PRO esos números NO
  // viajaron al navegador: se explica el límite, no se tapa con blur.
  const fila = (l, v, z) => `<div class="st"><div class="l">${l}</div><div class="v">${v}</div>${z ? `<div class="z">${z}</div>` : ""}</div>`;
  const grupo = (tit, filas) => filas.length ? `<div class="stg"><div class="stg-t">${tit}</div><div class="stats">${filas.join("")}</div></div>` : "";
  const pct1 = v => v == null ? "—" : (v >= 0 ? "+" : "") + n1.format(v) + "%";
  const statsHtml = ra ? grupo("Precio y mercado", [
      fila("Último precio", px.p ? "US$" + nf.format(px.p) : "—", hora ? "actualizado " + hora + " hs" : ""),
      fila("Hoy", px.d != null ? `<span class="${clase(px.d)}">${signo(px.d)}</span>` : "—", "contra el cierre anterior"),
      fila("52 semanas", r52 ? `${nf.format(r52.min)} – ${nf.format(r52.max)}` : "—", "mínimo y máximo, en dólares"),
      fila("Market cap", ra.mktcap ? "US$" + compacto.format(ra.mktcap) : "—", ""),
      fila("Div. yield", ra.divYield != null ? n1.format(ra.divYield) + "%" : "—", ""),
      fila("RSI (14)", ra.rsi != null ? n1.format(ra.rsi) : "—", esc(ra.rsiZona || "")),
    ]) + (conRatios ? grupo("Valuación", [
      fila("P/E", ra.per != null ? n1.format(ra.per) + "x" : "—", "precio / ganancias"),
      fila("P/Libro", ra.pb != null ? n1.format(ra.pb) + "x" : "—", ""),
      fila("P/Ventas", ra.ps != null ? n1.format(ra.ps) + "x" : "—", ""),
      fila("EV/EBITDA", ra.evebitda != null ? n1.format(ra.evebitda) + "x" : "—", "valor empresa / EBITDA"),
      fila("FCF yield", ra.fcfy != null ? n1.format(ra.fcfy) + "%" : "—", "caja libre / market cap"),
      fila("Puntaje de valor", ra.valorScore != null ? Math.round(ra.valorScore) + "/100" : "—", "múltiplos frente a su familia"),
    ]) + grupo("Rentabilidad y crecimiento", [
      fila("ROE", ra.roe != null ? n1.format(ra.roe) + "%" : "—", "ganancia / patrimonio"),
      fila("ROA", ra.roa != null ? n1.format(ra.roa) + "%" : "—", "ganancia / activos"),
      fila("Margen operativo", ra.margen != null ? n1.format(ra.margen) + "%" : "—", ""),
      fila("Margen neto", ra.margenNeto != null ? n1.format(ra.margenNeto) + "%" : "—", ""),
      fila("Crec. ingresos", pct1(ra.growth), "interanual"),
      fila("Calidad", ra.calidadScore != null ? Math.round(ra.calidadScore) + "/100" : "—", "deuda, crecimiento y margen"),
    ]) + grupo("Solidez y riesgo", [
      fila("Deuda / EBITDA", ra.deudaEbitda != null ? n1.format(ra.deudaEbitda) + "x" : "—", "años de EBITDA para cancelar la deuda"),
      fila("Liquidez", ra.liquidez != null ? n1.format(ra.liquidez) + "x" : "—", "activo corriente / pasivo corriente"),
      // beta: SIEMPRE con su R2 al lado. Una beta que explica el 3% de la
      // variación no dice nada, y sin el R2 se lee como si dijera todo.
      fila("Beta (2 años)",
        ra.beta != null && ra.betaR2 != null && ra.betaR2 >= 0.10 ? n1.format(ra.beta) : "—",
        ra.beta == null ? "" : ra.betaR2 < 0.10
          ? "no sigue al S&P (explica " + Math.round(ra.betaR2 * 100) + "%)"
          : "el S&P explica el " + Math.round(ra.betaR2 * 100) + "%"),
      fila("Volatilidad", ra.volAnual != null ? n1.format(ra.volAnual) + "%" : "—", "anualizada, 2 años"),
      fila("Consenso", pct1(ra.upside), ra.nAnalistas ? "objetivo de " + ra.nAnalistas + " analistas" : ""),
    ]) + (ra.monedaBalance === "ARS" ? `<div class="stg"><div class="vacio">Balance en pesos: P/Ventas, EV/EBITDA y crecimiento no se publican porque mezclarían un precio en dólares con números en pesos.</div></div>` : "")
    : "") : "";

  // sin acceso PRO los múltiplos NO están en la página: no hay blur que
  // sacar con devtools ni JSON que pedir por REST — el dato no viajó
  const proHtml = `<div class="stg" style="text-align:center;padding:22px 18px">
      <div style="font:400 20px 'Playfair Display',serif;color:var(--text)">Los números detrás de la lectura son PRO</div>
      <p style="font-size:12.5px;color:var(--sub);max-width:420px;margin:6px auto 12px;line-height:1.6">
        El veredicto, la zona de compra, el puntaje y el precio son gratis. Con PRO ves PER, P/Libro, EV/EBITDA,
        FCF yield, ROE, ROA, deuda sobre EBITDA, beta y el consenso de analistas.</p>
      <a class="btn" href="planes.html" style="display:inline-block;font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#fff;padding:10px 22px;text-decoration:none;border-radius:4px">Ver planes</a>
    </div>`;

  const verClase = ra && ra.veredicto === "Infravalorada" ? " infra" : ra && ra.veredicto === "Estirada" ? " cara" : "";
  const conVer = !!(ra && ra.veredicto && ra.veredicto !== "Sin cobertura");

  // medidor de medio arco: el punto marca dónde cae el valor entre 0 y 100
  const gauge = v => {
    const arco = `<path d="M8 50 A42 42 0 0 1 92 50" fill="none" stroke-width="7" stroke-linecap="round"`;
    if (v == null || !isFinite(v)) return `<svg class="gauge" viewBox="0 0 100 56">${arco} stroke="#E7E3DA"/></svg>`;
    const p = Math.max(0, Math.min(1, v / 100)), a = Math.PI * (1 - p);
    const x = 50 + 42 * Math.cos(a), y = 50 - 42 * Math.sin(a);
    return `<svg class="gauge" viewBox="0 0 100 56"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#B23A3A"/><stop offset=".5" stop-color="#B08A3E"/><stop offset="1" stop-color="#1F7A4D"/></linearGradient></defs>
      ${arco} stroke="url(#gg)" opacity=".4"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" fill="#0E1830" stroke="#fff" stroke-width="2"/></svg>`;
  };
  const rsiTxt = r => r == null ? "—" : r < 30 ? "Sobrevendido" : r > 70 ? "Sobrecomprado" : r < 45 ? "Zona de compra" : "Neutral";

  // ── estado: la lectura, dónde está el precio en el año y el consenso ──
  const estadoHtml = `<div class="estado">
    <div class="et"><div class="l">Lectura Valtia</div>
      ${conVer ? `<div class="v"><span class="ver-tag${verClase}">${esc(ra.veredicto)}</span>${ra.entrada ? '<span class="entrada" style="margin:0 0 0 10px">● zona de compra</span>' : ""}${ra.pierdePlata ? ' <span class="ver-tag" style="background:rgba(224,169,62,.15);color:#E0A93E;margin-left:6px" title="El puntaje mide qué tan barata cotiza, no si gana dinero">no gana plata</span>' : ""}</div>
        <div class="barra"><i style="width:100%"></i>${ra.score != null ? `<b style="left:${Math.max(0, Math.min(100, ra.score))}%"></b>` : ""}</div>
        <div class="barra-l"><span>estirada</span><span>puntaje ${ra.score != null ? Math.round(ra.score) : "—"}/100</span><span>barata</span></div>
        <div class="s">Qué tan barata cotiza frente a su familia sectorial. Lectura propia de Valtia, diaria; no es una recomendación.</div>`
      : `<div class="v">Sin cobertura</div><div class="s">Este activo todavía no está en el radar de valuación de Valtia.</div>`}
    </div>
    <div class="et"><div class="l">Rango de 52 semanas</div>
      ${r52 ? `<div class="v">US$${nf.format(r52.min)} – US$${nf.format(r52.max)}</div>
        <div class="barra"><i class="neutra" style="width:100%"></i>${r52.pos != null ? `<b style="left:${r52.pos.toFixed(1)}%"></b>` : ""}</div>
        <div class="barra-l"><span>mínimo</span><span>${px.p ? "hoy US$" + nf.format(px.p) : ""}</span><span>máximo</span></div>
        <div class="s">${px.p ? `${signo((px.p / r52.min - 1) * 100)} desde el mínimo · ${signo((px.p / r52.max - 1) * 100)} desde el máximo` : "Cierres diarios de los últimos 12 meses."}</div>`
      : `<div class="v">—</div><div class="s">El histórico de precios se está generando.</div>`}
    </div>
    <div class="et lock"><div class="l">Consenso de analistas</div>
      ${conRatios
        ? `<div class="v ${ra && ra.upside != null ? clase(ra.upside) : ""}">${ra && ra.upside != null ? signo(ra.upside) + " al objetivo" : "—"}</div>
           <div class="s">${ra && ra.nAnalistas ? `Precio objetivo promedio de ${ra.nAnalistas} analistas, contra el precio de hoy.` : "Sin consenso publicado para este activo."}</div>`
        : `<div class="preview-blur"><div class="v">Objetivo de los analistas</div><div class="s">Distancia al precio objetivo promedio y cuántos analistas lo cubren.</div></div>
           <div class="pro-overlay" style="gap:4px"><a href="planes.html" class="btn">PRO</a></div>`}
    </div>
  </div>`;

  // ── puntuación: cinco lecturas, cada una con su medidor ──
  const filaP = (l, v, z, g) => `<div class="pr"><div><div class="pl">${l}</div><div class="pv">${v}</div>${z ? `<div class="ps">${z}</div>` : ""}</div>${g}</div>`;
  const puntHtml = ra ? `<div class="punt">
      ${filaP("Puntaje Valtia", ra.score != null ? Math.round(ra.score) + "/100" : "—", "compuesto de valor y calidad, frente a su familia sectorial", gauge(ra.score))}
      ${filaP("Técnico", rsiTxt(ra.rsi), ra.rsi != null ? `RSI (14) ${n1.format(ra.rsi)}${ra.rsiZona ? " · " + esc(ra.rsiZona) : ""}` : "sin RSI publicado", gauge(ra.rsi != null ? 100 - ra.rsi : null))}
      <div class="lock">${conRatios
        ? filaP("Valor", ra.valorScore != null ? Math.round(ra.valorScore) + "/100" : "—", "P/E, P/Libro, P/Ventas, EV/EBITDA y FCF yield normalizados", gauge(ra.valorScore))
          + filaP("Calidad", ra.calidadScore != null ? Math.round(ra.calidadScore) + "/100" : "—", "deuda, crecimiento y margen operativo", gauge(ra.calidadScore))
          + filaP("Consenso", pct1(ra.upside), ra.nAnalistas ? `objetivo de ${ra.nAnalistas} analistas` : "sin consenso publicado", gauge(ra.upside != null ? (ra.upside + 30) / 90 * 100 : null))
        : `<div class="preview-blur">${filaP("Valor", "· ·", "múltiplos normalizados por familia", gauge(null))}${filaP("Calidad", "· ·", "deuda, crecimiento y margen", gauge(null))}${filaP("Consenso", "· ·", "objetivo de los analistas", gauge(null))}</div>
           <div class="pro-overlay"><h4>Con PRO</h4><p>Valor, calidad y consenso, con los números detrás.</p><a href="planes.html" class="btn">Ver planes →</a></div>`}
      </div>
    </div>` : '<div class="vacio">Este activo todavía no está en el radar de valuación.</div>';

  ficha.innerHTML = `
  <div class="top-row">
    <span class="volver" id="volver">← Volver</span>
    <div class="bx">
      <input id="bx-input" type="search" placeholder="Buscar activo — NVDA, Apple, Bitcoin…" autocomplete="off">
      <div class="bx-panel" id="bx-panel"></div>
    </div>
  </div>
  <div class="head">
    <div>
      <div class="sec">${esc(sectorN)}</div>
      <h1>${esc(emp.nombre)}<span>${t}</span></h1>
      <div class="head-meta">Cotiza en dólares${emp.slug ? " · con informe Valtia" : ""}${conVer ? " · en el radar de valuación" : ""}</div>
    </div>
    <div class="px">
      <div class="p">${px.p ? "US$" + nf.format(px.p) : "—"}</div>
      ${px.d != null ? `<div class="d ${clase(px.d)}">${signo(px.d)} hoy</div>` : ""}
      ${hora ? `<div class="h">Actualizado ${hora} hs · cada 15 min en rueda</div>` : ""}
    </div>
  </div>

  <div id="mi-pos"></div>
  ${estadoHtml}

  <div class="ficha-grid">
  <div class="col-main">
    <div class="card-w">
      <div class="card-h"><span class="t">Evolución del precio</span>
        <div class="rangos" id="rangos">
          <button data-d="22">1M</button><button data-d="63">3M</button><button data-d="126">6M</button><button data-d="252" class="on">1A</button><button data-d="9999">Máx</button>
        </div>
      </div>
      <div class="chart-box"><canvas id="chart"></canvas></div>
      <div id="desglose-periodos"></div>
    </div>
    <div class="card-w">
      <div class="card-h"><span class="t">Estadísticas clave</span><span class="s">Radar de valuación Valtia · diario</span></div>
      ${ra ? statsHtml + (conRatios ? "" : proHtml) : '<div class="vacio">Este activo todavía no está en el radar de valuación.</div>'}
    </div>
  </div>
  <div class="col-side">
    <div class="card-w">
      <div class="card-h"><span class="t">Puntuación Valtia</span><span class="s">Lectura propia</span></div>
      ${puntHtml}
    </div>
    <div class="card-w">
      <div class="card-h"><span class="t">Informe Valtia</span>
        ${!emp.slug ? '<span class="badge" style="background:var(--marfil);color:var(--mut)">Próximamente</span>'
          : inf ? (inf.visibilidad === "publico" ? '<span class="badge b-free">Gratis</span>' : '<span class="badge b-cli">Clientes</span>')
          : '<span class="badge b-cli">Clientes</span>'}
      </div>
      ${emp.slug ? `<a class="inf-cover" href="#informe"><img src="${cover}" alt="${esc(emp.nombre)}" onerror="this.remove()"></a>` : ""}
      <div class="inf-body" id="inf-card-body">
        ${!emp.slug ? `
          <h3>Todavía no publicamos el informe de ${esc(emp.nombre)}</h3>
          <p>El equipo va sumando análisis fundamentales a pedido de los clientes: tesis, KPIs, valuación por año, FODA y riesgos. Si querés que ${esc(emp.nombre)} sea el próximo, decínoslo.</p>
          <a class="btn-leer" href="mailto:valtyaanalytics@gmail.com?subject=Quiero%20el%20informe%20de%20${encodeURIComponent(emp.nombre)}">Pedir este análisis →</a>
          <a class="btn-leer" href="informes.html" style="background:#fff;color:var(--ink);border:1px solid var(--line);margin-left:8px">Ver los publicados</a>
        ` : `
          <h3>Análisis fundamental de ${esc(emp.nombre)}</h3>
          <p>Tesis, KPIs, valuación por año, FODA y riesgos — el informe completo es exclusivo para clientes de Valtia.</p>
          <a class="btn-leer" href="#informe">Leer más abajo ↓</a>
        `}
      </div>
    </div>
  </div></div>

  <div id="informe-full"></div>

  <div class="card-w act-news">
    <div class="card-h"><span class="t">Noticias de ${esc(emp.nombre)}</span><a class="s" href="noticias.html">Ver todas →</a></div>
    <div id="act-news-list"><div class="vacio">Buscando noticias…</div></div>
  </div>`;

  // ── cuánto rindió, por período (debajo del gráfico) ──
  // Es la variación del PRECIO, no "lo que ganaste": eso depende de cuándo
  // compraste y va en "Tu posición". El día sale del precio en vivo y los 6
  // meses del histórico; el resto lo calcula el sync a diario.
  (() => {
    const box = document.getElementById("desglose-periodos");
    const dp = desgSnap && desgSnap.exists() ? JSON.parse(desgSnap.data().json || "{}") : {};
    const d = dp[t] || {};
    if (!box) return;
    const P = [["dia", "1 día", px.d], ["semana", "1 semana", d.semana], ["mes", "1 mes", d.mes], ["tresM", "3 meses", d.tresM],
               ["seisM", "6 meses", seisM], ["ytd", "En el año", d.ytd], ["anio", "1 año", d.anio], ["dosA", "2 años", d.dosA]];
    if (!P.some(([, , v]) => v != null)) return;
    box.innerHTML = `<div class="rend">${P.map(([k, l, v]) => `<div class="r"><div class="rl">${l}</div>
        <div class="rv ${v == null ? "" : v >= 0 ? "up" : "dn"}">${v == null ? "—" : (v >= 0 ? "+" : "") + n1.format(v) + "%"}</div></div>`).join("")}</div>
      <div class="rend-nota">Variación del precio en dólares${d.desde ? `, con datos desde el ${String(d.desde).split("-").reverse().join("/")}` : ""}.
        Si lo tenés en pesos (CEDEAR o acción local), el porcentaje de tu posición es otro: lo ves en Mi cartera.</div>`;
  })();

  // ── informe embebido en la ficha (una sola página por activo) ──
  const renderInforme = d => {
    const full = document.getElementById("informe-full");
    if (!full || !d) return;
    const dsd = d.precio_pub && px.p ? (px.p / d.precio_pub - 1) * 100 : null;
    document.getElementById("inf-card-body").innerHTML = `
      <h3>${esc(d.titulo)}</h3>
      <div class="inf-meta">${venc(fdate(d.fecha))} · Valtia Research</div>
      <p>${esc(d.resumen || "")}</p>
      ${dsd != null ? `<div class="inf-desde ${clase(dsd)}">${signo(dsd)} desde la publicación <span style="color:var(--mut);font-weight:400">(salió a US$${nf.format(d.precio_pub)})</span></div>` : ""}
      <a class="btn-leer" href="#informe">Leer el informe completo ↓</a>`;
    full.innerHTML = `<div class="fsr-reader" id="informe" style="margin-top:26px">
      <div class="fsr-rhead">
        <div style="display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap"><span class="fsr-badge">${esc(d.tipo || "Informe")}</span>${d.categorias ? `<span class="fsr-tag">${esc(d.categorias)}</span>` : ""}</div>
        <h1>${esc(d.titulo)}</h1>
        <div class="inf-meta" style="margin:12px 0 0">${venc(fdate(d.fecha))} · ${esc(d.autor || "Lautaro Cuitiño · Valtia Analytics")}</div>
      </div>
      ${d.contenido_html || ""}
    </div>`;
    if (location.hash === "#informe") full.scrollIntoView();
  };
  if (inf) renderInforme(inf);
  else if (emp.slug) document.getElementById("informe-full").innerHTML =
    `<div class="fsr-state" id="informe" style="margin-top:26px">El informe completo de ${esc(emp.nombre)} es exclusivo para clientes de Valtia.<br>
     <a href="index.html?login=1">Ingresá con tu cuenta</a> para leerlo — o conocé los <a href="planes.html">planes</a>.</div>`;

  // ── volver + buscador de activos ──
  document.getElementById("volver").addEventListener("click", () => {
    if (document.referrer && document.referrer.startsWith(location.origin) && history.length > 1) history.back();
    else location.href = "informes.html";
  });
  const bxInput = document.getElementById("bx-input");
  const bxPanel = document.getElementById("bx-panel");
  // bonos y letras en el buscador: se cargan del panel público la primera vez
  let BONOS_BX = null;
  async function cargarBonosBx() {
    if (BONOS_BX) return;
    BONOS_BX = [];
    try {
      const snap = await getDoc(doc(db, "bonosPanel", "latest"));
      if (!snap.exists()) return;
      const p = JSON.parse(snap.data().json || "{}");
      const meter = (arr, nom) => (arr || []).forEach(b =>
        BONOS_BX.push({ t: b.s, n: nom + (b.vence ? " · vence " + String(b.vence).slice(0, 10) : "") }));
      meter(p.soberanos, "Soberano USD");
      meter(p.bopreal, "Bopreal USD");
      meter(p.tasa_fija, "Lecap / Boncap $");
      meter(p.cer, "Bono CER $");
      meter(p.dolar_linked, "Dólar linked $");
    } catch (e) {}
  }
  const pintarLista = q => {
    q = (q || "").trim().toLowerCase();
    const items = EMPRESAS.filter(e => !q || e.ticker.toLowerCase().includes(q) || e.nombre.toLowerCase().includes(q));
    const empHtml = SECTORES.map(s => {
      const del = items.filter(e => e.sector === s.k);
      if (!del.length) return "";
      return `<div class="bx-g">${s.n}</div>` + del.map(e =>
        `<div class="bx-it" data-t="${e.ticker}"><span>${esc(e.nombre)}</span><span class="tk">${e.ticker}</span></div>`).join("");
    }).join("");
    const bonosDel = (BONOS_BX || []).filter(b => !q || b.t.toLowerCase().includes(q));
    const lim = q ? bonosDel : bonosDel.slice(0, 8);
    const bonosHtml = lim.length
      ? `<div class="bx-g">Bonos y letras</div>` + lim.map(b =>
        `<div class="bx-it" data-b="${b.t}"><span>${esc(b.n)}</span><span class="tk">${b.t}</span></div>`).join("")
      : "";
    bxPanel.innerHTML = (empHtml + bonosHtml) || '<div class="bx-it">Sin resultados — probá con el ticker (AL30, S30O6…)</div>';
    bxPanel.querySelectorAll(".bx-it[data-t]").forEach(it => it.addEventListener("mousedown", ev => {
      ev.preventDefault();
      location.href = "activo.html?t=" + it.dataset.t;
    }));
    bxPanel.querySelectorAll(".bx-it[data-b]").forEach(it => it.addEventListener("mousedown", ev => {
      ev.preventDefault();
      location.href = "bono.html?e=" + it.dataset.b;
    }));
  };
  const abrirLista = () => {
    pintarLista(bxInput.value);
    bxPanel.classList.add("open");
    cargarBonosBx().then(() => { if (bxPanel.classList.contains("open")) pintarLista(bxInput.value); });
  };
  bxInput.addEventListener("focus", abrirLista);
  bxInput.addEventListener("input", abrirLista);
  bxInput.addEventListener("blur", () => setTimeout(() => bxPanel.classList.remove("open"), 160));
  bxInput.addEventListener("keydown", ev => {
    if (ev.key === "Enter") {
      const it = bxPanel.querySelector(".bx-it[data-t], .bx-it[data-b]");
      if (it) location.href = it.dataset.t ? "activo.html?t=" + it.dataset.t : "bono.html?e=" + it.dataset.b;
    }
    if (ev.key === "Escape") bxPanel.classList.remove("open");
  });

  // noticias del activo
  const lista = document.getElementById("act-news-list");
  const notas = notSnap ? notSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(nn => {
      const txt = (String(nn.titulo) + " " + String(nn.resumen)).toLowerCase();
      return emp.claves.some(k => txt.includes(k));
    })
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))).slice(0, 5) : [];
  lista.innerHTML = notas.length ? notas.map(nn => `
    <a href="nota.html?n=${encodeURIComponent(nn.id)}">
      <div class="im" style="${nn.imagen ? `background-image:url('${esc(nn.imagen)}')` : ""}"></div>
      <div><div class="tt">${esc(nn.titulo)}</div>
      <div class="f">${venc(String(nn.fecha))}${nn.fuente ? " · " + esc(nn.fuente) : ""}</div></div>
    </a>`).join("")
    : '<div class="vacio">Sin noticias recientes de esta empresa. El bot publica a toda hora — volvé pronto.</div>';

  // gráfico (la serie se leyó arriba: también alimenta el rango de 52 semanas)
  const canvas = document.getElementById("chart");
  if (serie.length && typeof Chart !== "undefined") {
    let chart;
    const dibujar = dias => {
      const datos = serie.slice(-dias);
      const primera = datos.length ? datos[0][1] : 0;
      const ultima = datos.length ? datos[datos.length - 1][1] : 0;
      const color = ultima >= primera ? "#1F7A4D" : "#B23A3A";
      if (chart) chart.destroy();
      chart = new Chart(canvas, {
        type: "line",
        data: { labels: datos.map(p => p[0]), datasets: [{
          data: datos.map(p => p[1]), borderColor: "#B08A3E", borderWidth: 1.8,
          pointRadius: 0, pointHitRadius: 8, fill: true,
          backgroundColor: "rgba(176,138,62,.07)", tension: 0.15 }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false },
            tooltip: { callbacks: {
              title: items => venc(items[0].label),
              label: ctx => "US$" + nf.format(ctx.raw) } } },
          scales: {
            x: { grid: { display: false }, ticks: { color: "#8B8375", maxTicksLimit: 7,
                 callback: function (v) { return venc(this.getLabelForValue(v)); }, font: { size: 10 } } },
            y: { grid: { color: "#EFECE4" }, ticks: { color: "#8B8375", font: { size: 10 },
                 callback: v => "US$" + compacto.format(v) } } },
        },
      });
    };
    dibujar(252);
    document.querySelectorAll("#rangos button").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll("#rangos button").forEach(x => x.classList.toggle("on", x === b));
      dibujar(Number(b.dataset.d));
    }));
  } else if (canvas) {
    canvas.parentElement.innerHTML = '<div class="vacio">El histórico de precios se está generando — volvé en unos minutos.</div>';
  }

  // ── tu posición (cliente logueado con tenencia en este activo) ──
  onAuthStateChanged(getAuth(app), async user => {
    // destape PRO: los candados de esta ficha se crean DESPUÉS de que
    // nav-auth pinta (los datos llegan async), así que acá se re-aplica
    if (user) {
      const esperar = ms => new Promise(r => setTimeout(r, ms));
      for (let i = 0; i < 20 && !window.valtiaEsPro; i++) await esperar(150);
      try {
        if (window.valtiaEsPro && await window.valtiaEsPro(user)) {
          document.querySelectorAll(".pro-overlay").forEach(o => o.style.display = "none");
          document.querySelectorAll(".preview-blur").forEach(b => {
            b.style.filter = "none"; b.style.pointerEvents = ""; b.style.userSelect = "";
          });
        }
      } catch (e) {}
      // el getDoc inicial corre sin sesión: si el informe estaba vedado,
      // reintentar ahora que Firestore conoce al usuario
      if (emp.slug && !inf && !document.querySelector("#informe-full .fsr-reader")) {
        try {
          const s2 = await getDoc(doc(db, "informes", emp.slug));
          if (s2.exists()) renderInforme(s2.data());
        } catch (e) {}
      }
    }
    const cont = document.getElementById("mi-pos");
    if (!user || !user.email || !cont) return;
    try {
      const snap = await getDocs(collection(db, "inversores", user.email, "cartera"));
      // lotes de este activo en cualquier forma (BTC / BTC-USD, PAM / PAMP);
      // los .BA cotizan en pesos y no se valúan con el precio en dólares
      const lotes = snap.docs.map(x => x.data())
        .filter(p => tickerFicha(p.ticker) === t && !String(p.ticker || "").toUpperCase().endsWith(".BA"));
      if (!lotes.length) return;
      const cant = lotes.reduce((a, p) => a + (Number(p.cantidad) || 0), 0);
      const conCosto = lotes.filter(p => Number(p.precioCompra) > 0);
      const cantCosto = conCosto.reduce((a, p) => a + Number(p.cantidad), 0);
      const costo = conCosto.reduce((a, p) => a + Number(p.cantidad) * Number(p.precioCompra), 0);
      const ppc = cantCosto ? costo / cantCosto : null;
      const valor = px.p ? cant * px.p : null;
      const pnlPct = ppc && px.p ? (px.p / ppc - 1) * 100 : null;
      const pnlUsd = ppc && px.p ? (px.p - ppc) * cantCosto : null;
      const item = (l, v, s) => `<div><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
      cont.innerHTML = `<div class="mi-pos">
        <div class="tt">Tu posición en ${esc(emp.nombre)}</div>
        ${item("Tenencia", nf.format(cant) + " u.", "")}
        ${valor != null ? item("Valor hoy", "US$" + nf.format(valor), "al último precio") : ""}
        ${ppc != null ? item("Precio promedio", "US$" + nf.format(ppc), cantCosto < cant ? "sobre los lotes con costo cargado" : "") : ""}
        ${pnlPct != null ? item("Resultado", `<span class="${clase(pnlPct)}">${signo(pnlPct)}</span>`,
          (pnlUsd >= 0 ? "+" : "−") + "US$" + nf.format(Math.abs(pnlUsd))) : ""}
      </div>`;
    } catch (e) {}
  });
} catch (e) {
  ficha.innerHTML = '<div class="empty-state">No pudimos cargar la ficha. <a href="informes.html">Volver a Informes</a></div>';
}
</script>
<script type="module" src="nav-auth.js?v=6"></script>
<script src="nav-menu.js?v=4"></script>
</body>
</html>
