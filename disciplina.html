<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidatas del mes — Valtia Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Candidatas del mes — mismo lenguaje editorial que Noticias / Informes:
     página blanca, nav y masthead navy, acentos dorados, hairlines y
     esquinas rectas. Solo claro. ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0E1830;--navy2:#0B1327;--navy3:#14213D;
  --gold:#B08A3E;--gold2:#8A6A2F;--gold-claro:#E8CE96;  /* gold-claro: SOLO sobre fondo navy */
  --bg:#fff;--bg2:#F6F3EC;--bg3:#F6F3EC;
  --text:#101010;--sub:#57534A;--muted:#8B8375;
  --border:#E7E3DA;--card:#fff;
  --ink:#101010;--mut:#8B8375;--line:#E7E3DA;--marfil:#F6F3EC;
  --up:#1F7A4D;--dn:#B23A3A;--greenTx:#1F7A4D;--redTx:#B23A3A;
  --green:#1F7A4D;--red:#B23A3A;
}
body{background:#fff;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}

/* nav global (navy, igual a Noticias) */
nav{position:sticky;top:0;z-index:200;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;background:rgba(14,24,48,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,206,150,.14)}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:.06em;color:#fff}
.nav-name em{color:#E8CE96;font-style:italic}
.nav-sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.nav-links{display:flex;align-items:center;gap:26px}
.nav-links a{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.nav-links a:hover,.nav-links a.active{color:#E8CE96}
.nav-cta{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#0E1830;background:#E8CE96;padding:9px 22px;border-radius:8px;text-decoration:none}
.nav-cta:hover{background:#fff;color:#0E1830}
@media(max-width:1100px){.nav-links{display:none}}

/* masthead centrado sobre la franja navy */
.masthead{background:#0E1830;padding:26px 52px 20px;text-align:center}
.masthead .t{font:700 clamp(30px,3.6vw,44px) 'Playfair Display',serif;color:#fff;letter-spacing:.01em;line-height:1}
.masthead .t em{color:#E8CE96;font-style:italic}
.masthead .d{font:500 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(232,206,150,.75);margin-top:12px}

main{max-width:1160px;margin:0 auto;padding:22px 52px 60px;min-height:52vh}
.eye{font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-bottom:12px}
/* volver a la página que define la regla: es un enlace, no un segundo kicker */
.volver{display:inline-block;font-size:12.5px;letter-spacing:.02em;text-transform:none;color:var(--sub);text-decoration:none;margin-bottom:10px}
.volver:hover{color:var(--gold)}
h1{font:700 clamp(28px,3.4vw,40px) 'Playfair Display',serif;color:var(--ink);line-height:1.12;margin-bottom:14px;text-wrap:pretty}
h1 em{font-style:italic;color:var(--gold)}
.sub{color:var(--sub);font-size:15px;line-height:1.75;max-width:720px;margin-bottom:8px}
/* título de sección: patrón .sec-h de Informes (Playfair + hairline que se
   estira). El JS pinta solo texto adentro, así que la hairline es un ::after
   en línea; queda en bloque para que ::first-letter capitalice el mes. */
.sec{margin:38px 0 16px;font:700 17px 'Playfair Display',serif;line-height:1.3;color:var(--ink);overflow:hidden}
.sec::first-letter{text-transform:uppercase}
.sec::after{content:'';display:inline-block;vertical-align:middle;width:100%;height:1px;background:var(--line);margin-left:14px;margin-right:-100%}
.card{background:#fff;border:1px solid var(--line);padding:22px 24px}
.pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:26px}
.paso{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);padding:18px 20px}
.paso .n{font:600 20px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:var(--gold2);line-height:1;margin-bottom:10px}
.paso b{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}
.paso p{font-size:12.5px;color:var(--sub);line-height:1.6}
.regla{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.regla .campo label{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin-bottom:6px}
.regla input{width:130px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:0;color:var(--ink);font:500 14px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;outline:none}
.regla input:focus{border-color:var(--gold)}
/* botones: primario navy, secundario con borde de tinta e inversión al pasar */
.btn{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);border:1px solid var(--navy);border-radius:0;padding:10px 19px;cursor:pointer}
.btn:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.sec2{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.sec2:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.regla-txt{font-size:14px;color:var(--sub);line-height:1.6;font-variant-numeric:tabular-nums}
.regla-txt b{color:var(--ink);font-weight:600}
.mes-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dots{display:flex;gap:7px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.dot.on{background:var(--gold);border-color:var(--gold)}
.estado-mes{font-size:14px;margin-top:10px;color:var(--sub)}
.estado-mes b{color:var(--ink)}
.racha{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);margin-top:14px;flex-wrap:wrap}
.racha b{color:var(--ink)}
.racha .fuego{font-size:16px}
.mchip{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:0;padding:3px 9px;letter-spacing:.04em}
.mchip.ok{color:var(--up);border-color:rgba(31,122,77,.35)}
.mchip.no{color:var(--sub)}
/* tablas: encabezado con línea de tinta, números en Plex Mono */
.panel{background:#fff;border:1px solid var(--line);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;font:700 10px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:12px 16px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
td.num{font:500 12.5px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--marfil)}
.num{text-align:right}
.pos{color:var(--up)!important}.neg{color:var(--dn)!important}.mut{color:var(--mut)!important}
.tk a{font:600 13px 'IBM Plex Mono',monospace;color:var(--gold2);text-decoration:none;border-bottom:1px dotted var(--gold)}
.tk a:hover{color:var(--ink)}
.tk b{font:600 13px 'IBM Plex Mono',monospace;color:var(--ink)}
.nom{font:400 11px 'IBM Plex Sans',sans-serif;color:var(--sub)}
/* enlaces dentro de notas chicas: el dorado oscuro, que sí llega a AA (el inline trae --gold) */
.nom a{color:var(--gold2)!important;text-decoration:underline;text-decoration-color:rgba(176,138,62,.55);text-underline-offset:2px}
.ver{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:2px;white-space:nowrap}
.ver.infra{color:var(--up);background:rgba(31,122,77,.12)}
.ver.precio{color:var(--gold2);background:rgba(176,138,62,.14)}
.ver.cara{color:var(--dn);background:rgba(178,58,58,.1)}
.zona{font-size:9.5px;font-weight:700;color:var(--gold2);border:1px solid var(--gold);border-radius:2px;padding:2.5px 7px;letter-spacing:.05em;white-space:nowrap}
.compra-form{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.compra-form input{width:92px;padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:0;color:var(--ink);font:500 13px 'IBM Plex Mono',monospace;outline:none}
.compra-form input[list]{font-family:'IBM Plex Sans',system-ui,sans-serif}
.compra-form input:focus{border-color:var(--gold)}
.btn.mini{padding:8px 13px;font-size:10px}
.msg{font-size:12px;margin-top:10px}
.otra{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;margin-top:12px}
.otra label{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin-bottom:6px}
.otra input{width:100%;padding:9px 11px;background:#fff;border:1px solid var(--line);border-radius:0;color:var(--ink);font:400 14px 'IBM Plex Sans',system-ui,sans-serif;outline:none}
.otra input[type="number"]{font:500 14px 'IBM Plex Mono',monospace}
.otra input:focus{border-color:var(--gold)}
.state{border:1px dashed var(--line);text-align:center;padding:60px 20px;color:var(--sub);font-size:14px;margin-top:30px}
/* el botón "← Volver" de arriba; el enlace .volver de la intro es otra cosa */
.top-volver{max-width:1160px;margin:0 auto;padding:20px 52px 0}
.top-volver .volver{display:inline-block;font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);background:none;border:none;padding:0;margin:0;cursor:pointer}
.top-volver .volver:hover{color:var(--gold)}
.gate{background:var(--marfil);border:1px solid var(--line);border-left:3px solid var(--gold);padding:22px 24px;margin-top:26px}
.gate>b{font:600 17px 'Playfair Display',serif;color:var(--ink)}
.gate p b{color:var(--ink);font-weight:600}
.gate p{font-size:13px;color:var(--sub);line-height:1.7;margin:8px 0 14px}
/* footer de Noticias (navy2), a sangre: el JS lo pinta adentro de <main> */
footer{margin:48px calc(50% - 50vw) -60px;background:#0B1327;padding:28px calc(50vw - 50%);font:400 11px 'IBM Plex Sans',sans-serif;line-height:1.9;color:rgba(255,255,255,.55)}
footer a:hover{color:#E8CE96}
@media(max-width:880px){.masthead,main,.top-volver{padding-left:20px;padding-right:20px}}
@media(max-width:600px){.regla input{width:100%}.regla .campo{flex:1}}
</style>
</head>

<nav>
  <a href="index.html" class="nav-brand">

<div class="masthead">
  <div class="t">Candidatas <em>del mes</em></div>
  <div class="d">Tu plan de compras, mes a mes</div>
</div>

<!-- cotizaciones en vivo (módulo único del sitio: cotizaciones.js) -->
<div id="valtia-cot"></div>
<div class="top-volver"><button class="volver" onclick="volver()">← Volver</button></div>
<main id="main">
  <div class="state">Cargando tu plan…</div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, getDoc, setDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { EMPRESAS } from './empresas.js?v=3';
import { radarSym, tickerFicha } from './activos.js?v=7';

const app = initializeApp({
  apiKey: 'AIzaSyCxKNw0995b8a7XXyENiMjDQbfRCe9IBlw',
  authDomain: 'valtia-analytics.firebaseapp.com',
  projectId: 'valtia-analytics',
});
const db = getFirestore(app);

// volver: atrás si venís de adentro de la web; si no, a la home
window.volver = () => {
  try {
    if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
      history.back();
      return;
    }
  } catch (e) {}
  location.href = 'index.html';
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const fmtUSD = n => "US$" + Number(n).toLocaleString("es-AR", { maximumFractionDigits: Math.abs(n) < 10 ? 2 : 2 });
const fmtPct = n => (n >= 0 ? "+" : "") + n.toFixed(2).replace(".", ",") + "%";
const cls = n => n > 0.004 ? "pos" : n < -0.004 ? "neg" : "mut";
const verCls = v => v === "Infravalorada" ? "infra" : v === "Estirada" ? "cara" : "precio";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const BROKERS = ["IOL", "PPI", "Balanz", "Bull Market", "Cocos", "Binance", "Lemon", "Belo", "Otro"];
const brokerPref = () => { try { return localStorage.getItem("valtia-mc-broker") || ""; } catch (e) { return ""; } };
const guardarBrokerPref = b => { try { if (b) localStorage.setItem("valtia-mc-broker", b); } catch (e) {} };
const hoyISO = () => new Date(Date.now() - 3 * 3600 * 1000).toISOString().slice(0, 10);   // hora argentina (UTC-3)
const mesDe = f => String(f || "").slice(0, 7);
const mesNombre = m => { const [a, mm] = m.split("-"); return MESES[Number(mm) - 1] + " " + a; };
const mesAnterior = m => { let [a, mm] = m.split("-").map(Number); mm--; if (!mm) { mm = 12; a--; } return a + "-" + String(mm).padStart(2, "0"); };

// símbolo del radar (local BYMA) ↔ ticker de las fichas (ADR, empresas.js)
// (mapa único en activos.js)
const norm = t => radarSym(t);
const fichaDe = sym => tickerFicha(sym) || sym;
const linkTk = sym => {
  const tk = fichaDe(sym);
  return EMPRESAS.some(e => e.ticker === tk)
    ? `<a href="activo.html?t=${tk}">${tk}</a>` : `<b>${esc(tk)}</b>`;
};

/* ── datos públicos: radar (diario) + precios en vivo (15 min en rueda) ── */
let _radar = [], _px = {};
async function cargarMercado() {
  try {
    const snap = await getDoc(doc(db, "radar", "latest"));
    if (snap.exists()) _radar = JSON.parse(snap.data().json || "{}").activos || [];
  } catch (e) {}
  try {
    const snap = await getDoc(doc(db, "preciosInformes", "latest"));
    if (snap.exists()) _px = JSON.parse(snap.data().json || "{}");
  } catch (e) {}
}
const precioDe = sym => {
  const vivo = _px[fichaDe(sym)];
  if (vivo && vivo.p != null) return vivo.p;
  const ra = _radar.find(a => a.sym === sym);
  return ra ? ra.precio : null;
};

/* ── datos del usuario ── */
let _user = null, _config = null, _log = [], _tengoSet = new Set();
async function cargarUsuario() {
  _config = null; _log = []; _tengoSet = new Set();
  if (!_user) return;
  const [discSnap, cartSnap] = await Promise.all([
    getDocs(collection(db, "inversores", _user.email, "disciplina")),
    getDocs(collection(db, "inversores", _user.email, "cartera")),
  ]);
  discSnap.docs.forEach(d => {
    if (d.id === "config") _config = d.data();
    else if (d.data().tipo === "compra") _log.push({ id: d.id, ...d.data() });
  });
  _log.sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  cartSnap.docs.forEach(d => _tengoSet.add(norm(d.data().ticker)));
}

const comprasEn = mes => _log.filter(c => mesDe(c.fecha) === mes).length;
const objetivo = () => Math.max(1, Number(_config && _config.compras) || 1);
function racha() {
  if (!_config) return 0;
  let n = 0, m = mesDe(hoyISO());
  if (comprasEn(m) >= objetivo()) n++;
  m = mesAnterior(m);
  for (let i = 0; i < 120 && comprasEn(m) >= objetivo(); i++) { n++; m = mesAnterior(m); }
  return n;
}
function chipsMeses() {
  if (!_log.length) return "";
  const meses = [...new Set(_log.map(c => mesDe(c.fecha)))].sort().reverse().slice(0, 8);
  return meses.map(m => {
    const c = comprasEn(m), ok = c >= objetivo();
    return `<span class="mchip ${ok ? "ok" : "no"}">${mesNombre(m).slice(0, 3)} ${m.slice(0, 4)} · ${c}/${objetivo()}${ok ? " ✓" : ""}</span>`;
  }).join(" ");
}

/* ── escrituras: la compra queda en Mi Cartera Y en el plan (una sola carga) ── */
async function registrarCompra(tickerFicha, cantidad, precio, broker = "") {
  const f = hoyISO(), ahora = new Date().toISOString();
  const suf = Date.now().toString(36);
  guardarBrokerPref(broker);
  await setDoc(doc(db, "inversores", _user.email, "cartera", tickerFicha + "-" + suf), {
    ticker: tickerFicha, cantidad, precioCompra: precio, fecha: f, broker, creado: ahora,
  });
  await setDoc(doc(db, "inversores", _user.email, "disciplina", "c-" + suf), {
    tipo: "compra", ticker: tickerFicha, cantidad, precio, fecha: f, mes: mesDe(f), broker, creado: ahora,
  });
}

/* ── vistas ── */
function intro(publico) {
  return `
    <a class="volver" href="inversion-mensual.html">← Inversión mensual</a>
    <div class="eye">Candidatas del mes · el método del inversor constante</div>
    <h1>Invertí todos los meses.<br>Nosotros te <em>marcamos</em> el ritmo.</h1>
    <p class="sub">El secreto del largo plazo no es acertarle al momento: es aportar siempre y comprar lo que está barato.
    Definís tu regla —cuánto aportás por mes y en cuántas compras—, el radar te propone los activos mejor puntuados
    que todavía no tenés, y cada compra que marcás se agrega sola a Mi Cartera. Tu constancia queda a la vista.</p>
    <div class="pasos">
      <div class="paso"><div class="n">01</div><b>Tu regla, una vez</b><p>Elegí tu aporte mensual en dólares y en cuántas compras lo repartís. Es tu contrato con vos mismo.</p></div>
      <div class="paso"><div class="n">02</div><b>Candidatas del radar</b><p>Cada mes te mostramos lo mejor puntuado por la lectura Valtia que falta en tu cartera, con precio del día.</p></div>
      <div class="paso"><div class="n">03</div><b>"La compré" y listo</b><p>Un click registra la compra en tu plan y en Mi Cartera al precio del día. Sin doble carga, sin planillas.</p></div>
    </div>
    ${publico ? `<div class="gate"><b>Armá tu plan con tu cuenta</b>
      <p>El plan, la racha y el historial son tuyos y viajan con tu cuenta. Entrá para definir tu regla y arrancar este mes.</p>
      <a class="btn" href="index.html?login=crear" style="text-decoration:none;display:inline-block">Ingresá con tu cuenta →</a></div>` : ""}`;
}

function candidatas(max) {
  return _radar
    .filter(a => a.score != null && !_tengoSet.has(a.sym))
    .sort((x, y) => (y.score || 0) - (x.score || 0) || (x.rsi || 99) - (y.rsi || 99))
    .slice(0, max);
}

function filaCandidata(a) {
  const px = precioDe(a.sym);
  const monto = _config ? (Number(_config.aporte) || 0) / objetivo() : 0;
  const sug = px && monto ? Math.max(0.0001, +(monto / px).toFixed(4)) : "";
  return `<tr data-sym="${a.sym}">
    <td class="tk">${linkTk(a.sym)}<div class="nom">${esc(a.nombre)} · ${esc(a.sector || "")}</div></td>
    <td class="num"><b>${a.score}</b><div class="nom">puntaje valor</div></td>
    <td><span class="ver ${verCls(a.veredicto)}">${esc(a.veredicto)}</span>${a.entrada ? ' <span class="zona">◎ zona de compra</span>' : ""}</td>
    <td class="num">${a.per != null ? a.per.toFixed(1) + "x" : "—"}</td>
    <td class="num">${a.rsi != null ? a.rsi.toFixed(0) : "—"}<div class="nom">${esc(a.rsiZona || "")}</div></td>
    <td class="num">${px != null ? fmtUSD(px) : "—"}</td>
    <td class="num">
      <div class="compra-form" data-form="${a.sym}" style="display:none">
        <input type="number" step="any" min="0" value="${sug}" data-cant="${a.sym}" title="Cantidad">
        <input list="d-brokers" data-brk="${a.sym}" value="${esc(brokerPref())}" placeholder="Broker" title="Broker / cuenta" maxlength="24" style="width:104px">
        <button class="btn mini" data-ok="${a.sym}">Confirmar</button>
      </div>
      <button class="btn mini sec2" data-compre="${a.sym}" ${px == null ? "disabled" : ""}>La compré ✓</button>
    </td></tr>`;
}

function vistaPlan() {
  const mesAct = mesDe(hoyISO());
  const hechas = comprasEn(mesAct), obj = objetivo();
  const faltan = Math.max(0, obj - hechas);
  const r = racha();
  const dots = Array.from({ length: obj }, (_, i) => `<span class="dot ${i < hechas ? "on" : ""}"></span>`).join("");
  const cands = candidatas(5);

  const histRows = _log.slice(0, 24).map(c => {
    const px = precioDe(norm(c.ticker));
    const ret = px != null && c.precio > 0 ? (px / c.precio - 1) * 100 : null;
    return `<tr>
      <td style="white-space:nowrap">${esc(c.fecha)}</td>
      <td class="tk">${linkTk(norm(c.ticker))}</td>
      <td class="num">${Number(c.cantidad).toLocaleString("es-AR", { maximumFractionDigits: 4 })}</td>
      <td class="num">${fmtUSD(c.precio)}</td>
      <td class="num">${px != null ? fmtUSD(px) : "—"}</td>
      <td class="num">${ret != null ? `<span class="${cls(ret)}">${fmtPct(ret)}</span>` : "—"}</td></tr>`;
  }).join("");

  $("#main").innerHTML = `
    ${intro(false)}
    <div class="sec">Tu regla</div>
    <div class="card">
      ${_config ? `<div class="regla-txt" id="regla-vista">Tu contrato: <b>${fmtUSD(Number(_config.aporte) || 0)} por mes</b> repartidos en <b>${obj} compra${obj > 1 ? "s" : ""}</b> (${fmtUSD((Number(_config.aporte) || 0) / obj)} por compra). <button class="btn mini sec2" id="editar" style="margin-left:10px">Cambiar</button></div>` : ""}
      <div class="regla" id="regla-form" style="${_config ? "display:none" : ""}">
        <div class="campo"><label>Aporte mensual (USD)</label><input id="in-aporte" type="number" min="1" step="any" value="${_config ? Number(_config.aporte) || 200 : 200}"></div>
        <div class="campo"><label>Compras por mes</label><input id="in-compras" type="number" min="1" max="6" step="1" value="${obj}"></div>
        <button class="btn" id="guardar">Guardar mi regla</button>
      </div>
      <div class="msg" id="msg-regla"></div>
    </div>

    ${_config ? `
    <div class="sec">${mesNombre(mesAct)}</div>
    <div class="card">
      <div class="mes-head">
        <div class="estado-mes" style="margin-top:0">${faltan
          ? `Este mes: <b>te falta${faltan > 1 ? "n" : ""} ${faltan} compra${faltan > 1 ? "s" : ""}</b> de ${obj}.`
          : `<b>Plan cumplido este mes ✓</b> — ${hechas} de ${obj} compras hechas.`}</div>
        <div class="dots">${dots}</div>
      </div>
      ${r ? `<div class="racha"><span class="fuego">🔥</span> <b>${r} mes${r > 1 ? "es" : ""}</b>&nbsp;seguido${r > 1 ? "s" : ""} cumpliendo tu plan &nbsp; ${chipsMeses()}</div>` : (_log.length ? `<div class="racha">${chipsMeses()}</div>` : "")}
    </div>

    <div class="sec">Candidatas del mes · lo mejor del radar que no tenés</div>
    <div class="panel"><table>
      <thead><tr><th>Activo</th><th class="num">Score</th><th>Lectura Valtia</th><th class="num">P/E</th><th class="num">RSI</th><th class="num">Precio hoy</th><th class="num"></th></tr></thead>
      <tbody>${cands.map(filaCandidata).join("") || '<tr><td colspan="7" class="mut" style="text-align:center">Ya tenés todo lo puntuado por el radar — constancia de acero.</td></tr>'}</tbody>
    </table></div>
    <div class="msg" id="msg-compra"></div>
    <p class="nom" style="margin-top:10px">El puntaje y la lectura salen del <a href="herramientas.html" style="color:var(--gold)">radar de valuación Valtia</a> (valor relativo dentro del radar, no recomendación). Precio del día con actualización de rueda.</p>

    <datalist id="d-brokers">${BROKERS.map(b => `<option value="${b}">`).join("")}</datalist>
    <div class="card" style="margin-top:18px">
      <b style="font-size:13.5px">¿Compraste otra cosa o reforzaste una posición?</b>
      <div class="nom" style="margin-top:3px">Contala igual para tu plan del mes — también se agrega a Mi Cartera.</div>
      <div class="otra">
        <div><label>Ticker</label><input id="o-tk" placeholder="AAPL" maxlength="12"></div>
        <div><label>Cantidad</label><input id="o-cant" type="number" step="any" min="0" placeholder="2"></div>
        <div><label>Precio pagado (USD)</label><input id="o-px" type="number" step="any" min="0" placeholder="315.50"></div>
        <div><label>Broker / cuenta</label><input id="o-brk" list="d-brokers" value="${esc(brokerPref())}" placeholder="IOL, PPI…" maxlength="24"></div>
        <div><button class="btn" id="o-ok" style="width:100%">Registrar compra</button></div>
      </div>
      <div class="msg" id="msg-otra"></div>
    </div>

    ${_log.length ? `
    <div class="sec">Tu historial · cada compra, fechada</div>
    <div class="panel"><table>
      <thead><tr><th>Fecha</th><th>Activo</th><th class="num">Cantidad</th><th class="num">Pagaste</th><th class="num">Hoy</th><th class="num">Retorno</th></tr></thead>
      <tbody>${histRows}</tbody></table></div>` : ""}
    ` : ""}
    <footer>Candidatas del mes es una herramienta de organización personal de Valtia: registra las compras que vos decidís y hacés en tu broker.
    Valtia no ejecuta operaciones ni custodia fondos. La lectura del radar es análisis de carácter general y educativo,
    no constituye asesoramiento financiero personalizado. Invertir implica riesgo de pérdida del capital. · <a href="terminos.html" style="color:inherit;text-decoration:underline">Términos</a> · <a href="privacidad.html" style="color:inherit;text-decoration:underline">Privacidad</a></footer>`;

  enganchar();
}

function enganchar() {
  const ed = $("#editar");
  if (ed) ed.onclick = () => { $("#regla-vista").style.display = "none"; $("#regla-form").style.display = "flex"; };
  const g = $("#guardar");
  if (g) g.onclick = async () => {
    const aporte = parseFloat($("#in-aporte").value), compras = parseInt($("#in-compras").value, 10);
    const msg = $("#msg-regla");
    if (!(aporte > 0) || !(compras >= 1)) { msg.innerHTML = '<span class="neg">Completá el aporte y las compras por mes.</span>'; return; }
    try {
      await setDoc(doc(db, "inversores", _user.email, "disciplina", "config"), {
        aporte, compras: Math.min(6, compras),
        creado: (_config && _config.creado) || new Date().toISOString(),
        actualizado: new Date().toISOString(),
      });
      await cargarUsuario(); vistaPlan();
    } catch (e) { msg.innerHTML = `<span class="neg">No se pudo guardar: ${esc(String(e).slice(0, 90))}</span>`; }
  };
  document.querySelectorAll("[data-compre]").forEach(b => b.onclick = () => {
    const f = document.querySelector(`[data-form="${b.dataset.compre}"]`);
    if (f) { f.style.display = "flex"; b.style.display = "none"; f.querySelector("input").focus(); }
  });
  document.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => {
    const sym = b.dataset.ok;
    const cant = parseFloat(document.querySelector(`[data-cant="${sym}"]`).value);
    const px = precioDe(sym), msg = $("#msg-compra");
    if (!(cant > 0)) { msg.innerHTML = '<span class="neg">Poné la cantidad que compraste.</span>'; return; }
    b.disabled = true;
    try {
      const brk = ((document.querySelector(`[data-brk="${sym}"]`) || {}).value || "").trim();
      await registrarCompra(fichaDe(sym), cant, px, brk);
      await cargarUsuario(); vistaPlan();
      $("#msg-compra").innerHTML = `<span class="pos">${fichaDe(sym)} registrada en tu plan y en Mi Cartera al precio del día (${fmtUSD(px)}).</span>`;
    } catch (e) { b.disabled = false; msg.innerHTML = `<span class="neg">No se pudo registrar: ${esc(String(e).slice(0, 90))}</span>`; }
  });
  const o = $("#o-ok");
  if (o) o.onclick = async () => {
    const tk = (($("#o-tk").value) || "").trim().toUpperCase().replace(/[^A-Z0-9.\-]/g, "");
    const cant = parseFloat($("#o-cant").value);
    let px = parseFloat($("#o-px").value);
    const msg = $("#msg-otra");
    if ((!isFinite(px) || px <= 0) && !tk.endsWith(".BA")) px = precioDe(norm(tk));   // .BA cotiza en pesos: el radar no tiene ese precio
    if (!tk || !(cant > 0)) { msg.innerHTML = '<span class="neg">Completá ticker y cantidad.</span>'; return; }
    if (!(px > 0)) { msg.innerHTML = '<span class="neg">No tenemos precio de ese activo: poné el precio que pagaste.</span>'; return; }
    try {
      await registrarCompra(tk, cant, px, (($("#o-brk") || {}).value || "").trim());
      await cargarUsuario(); vistaPlan();
      $("#msg-otra") && ($("#msg-otra").innerHTML = "");
      $("#msg-compra").innerHTML = `<span class="pos">${tk} registrada en tu plan y en Mi Cartera.</span>`;
    } catch (e) { msg.innerHTML = `<span class="neg">No se pudo registrar: ${esc(String(e).slice(0, 90))}</span>`; }
  };
}

async function render() {
  try {
    await cargarMercado();
    if (!_user) {
      $("#main").innerHTML = intro(true) + `
        <div class="sec">Así se ve un mes del plan</div>
        <div class="panel"><table>
          <thead><tr><th>Activo</th><th class="num">Score</th><th>Lectura Valtia</th><th class="num">P/E</th><th class="num">Precio hoy</th></tr></thead>
          <tbody>${candidatas(3).map(a => {
            const px = precioDe(a.sym);
            return `<tr><td class="tk">${linkTk(a.sym)}<div class="nom">${esc(a.nombre)}</div></td>
              <td class="num"><b>${a.score}</b></td>
              <td><span class="ver ${verCls(a.veredicto)}">${esc(a.veredicto)}</span></td>
              <td class="num">${a.per != null ? a.per.toFixed(1) + "x" : "—"}</td>
              <td class="num">${px != null ? fmtUSD(px) : "—"}</td></tr>`;
          }).join("")}</tbody></table></div>
        <p class="nom" style="margin-top:10px">Muestra libre: las tres mejor puntuadas del radar hoy. Con tu cuenta ves cinco candidatas filtradas contra tu propia cartera.</p>
        <footer>Disciplina Valtia es una herramienta de organización personal. La lectura del radar es análisis de carácter general y educativo, no constituye asesoramiento financiero personalizado.</footer>`;
      return;
    }
    if (!_user.emailVerified) {
      // sin verificar, las reglas de Firestore bloquean el plan del usuario
      $("#main").innerHTML = intro(false) + `
        <div class="gate"><b>Verificá tu email para activar tu plan</b>
        <p>Al crear la cuenta te mandamos un mail de verificación a <b>${esc(_user.email)}</b>.
        Abrilo, tocá el link y volvé — tu plan, tu racha y Mi Cartera se activan al instante. Revisá también spam.</p>
        <button class="btn" onclick="location.reload()">Ya la verifiqué</button></div>`;
      return;
    }
    await cargarUsuario();
    vistaPlan();
  } catch (e) {
    $("#main").innerHTML = `<div class="state">No se pudo cargar el plan (${esc(String(e).slice(0, 140))})</div>`;
  }
}
onAuthStateChanged(getAuth(app), u => { _user = u; render(); });
</script>
