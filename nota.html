<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias — Valtia Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Nota individual — página propia estilo Bloomberg Línea ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#101010;--sub:#57534A;--mut:#8B8375;--navy:#0E1830;--gold:#B08A3E;--gold2:#8A6A2F;--line:#E7E3DA;--up:#1F7A4D;--dn:#B23A3A}
html{scroll-behavior:smooth}
body{background:#fff;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink)}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}
img{max-width:100%}

/* nav global (navy, igual al resto del sitio) */
nav{position:sticky;top:0;z-index:200;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;background:rgba(14,24,48,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,206,150,.14)}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:.06em;color:#fff}
.nav-name em{color:#E8CE96;font-style:italic}
.nav-sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.nav-links{display:flex;align-items:center;gap:26px}
.nav-links a{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.nav-links a:hover,.nav-links a.active{color:#E8CE96}
.nav-cta{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#0E1830;background:#E8CE96;padding:9px 22px;border-radius:8px;text-decoration:none}
.nav-cta:hover{background:#fff;color:#0E1830}
@media(max-width:880px){.nav-links{display:none}}

/* layout nota + rail */
.wrap{max-width:1240px;margin:0 auto;padding:34px 52px 60px}
.layout{display:grid;grid-template-columns:1fr 330px;gap:54px}

.art-chip{display:inline-block;font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0E1830;background:#E8CE96;padding:6px 12px;margin-bottom:16px}
.art-title{font:700 clamp(28px,3.4vw,42px) 'Playfair Display',serif;line-height:1.12;color:var(--ink);margin-bottom:14px;text-wrap:pretty}
.art-bajada{font:400 17px 'IBM Plex Sans',sans-serif;color:var(--sub);line-height:1.6;margin-bottom:22px;text-wrap:pretty}
.art-img{background:linear-gradient(135deg,#14213D,#B08A3E)}
.art-img img{width:100%;display:block;max-height:560px;object-fit:cover}
.art-caption{font:400 11.5px 'IBM Plex Sans',sans-serif;color:var(--mut);padding:9px 0 0;border-bottom:1px solid var(--line);padding-bottom:14px}
.art-byline{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:26px}
.art-byline .por{font:600 13px 'IBM Plex Sans',sans-serif;color:var(--ink)}
.art-byline .fecha{font:500 11px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.art-content{font:400 16px 'IBM Plex Sans',sans-serif;line-height:1.9;color:#2E2A24;max-width:70ch}
.art-content p{margin-bottom:18px}
.art-content h3{font:600 21px 'Playfair Display',serif;color:var(--navy);margin:28px 0 12px}
.art-content strong{color:var(--ink)}
.art-tags{display:flex;flex-wrap:wrap;gap:8px;margin:30px 0 0;padding-top:22px;border-top:1px solid var(--line)}
.art-tag{font:600 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);border:1px solid var(--line);padding:6px 12px;cursor:pointer}
.art-tag:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

/* anterior / siguiente (estilo Bloomberg) */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}
.pn a{display:flex;gap:12px;align-items:flex-start;color:var(--ink)}
.pn .flecha{font:700 20px 'Playfair Display',serif;color:var(--gold);line-height:1.2}
.pn .lbl{font:700 10px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.pn .tt{font:600 13.5px 'IBM Plex Sans',sans-serif;line-height:1.4}
.pn a:hover .tt{text-decoration:underline;text-decoration-color:rgba(176,138,62,.55);text-underline-offset:3px}
.pn .sig{text-align:right;justify-content:flex-end}

/* rail derecho (mismo lenguaje que noticias.html) */
.rail{display:flex;flex-direction:column;gap:30px}
.rail-h{align-self:flex-start;font:700 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;background:#0E1830;color:#fff;padding:7px 13px}
.ml-item{display:grid;grid-template-columns:1fr 82px;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.ml-item:last-child{border-bottom:none}
.cimg{aspect-ratio:16/9;background:linear-gradient(135deg,#14213D,#B08A3E);background-size:cover;background-position:center}
.ml-item .cimg{aspect-ratio:4/3;margin:0}
.ml-item .t{font:600 13.5px 'IBM Plex Sans',sans-serif;color:var(--ink);line-height:1.4}
.ml-item:hover .t{text-decoration:underline;text-decoration-color:rgba(176,138,62,.55);text-underline-offset:3px}
.ccat{font:700 10px 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-bottom:8px}
.ml-item .ccat{margin-bottom:5px}
.nl-box{background:#0E1830;padding:28px 26px}
.nl-box h3{font:700 23px 'Playfair Display',serif;color:#fff;line-height:1.2;margin-bottom:8px}
.nl-box h3 em{color:#E8CE96;font-style:italic}
.nl-box p{font:400 12.5px 'IBM Plex Sans',sans-serif;color:rgba(255,255,255,.72);line-height:1.6;margin-bottom:16px}
.nl-box input{width:100%;padding:12px 13px;border:1px solid rgba(232,206,150,.35);background:rgba(255,255,255,.07);color:#fff;font:400 13px 'IBM Plex Sans',sans-serif;outline:none}
.nl-box input::placeholder{color:rgba(255,255,255,.4)}
.nl-box input:focus{border-color:#E8CE96}
.nl-box button{width:100%;margin-top:10px;font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#0E1830;background:#E8CE96;border:none;padding:12px;cursor:pointer}
.nl-box button:hover{background:#fff}
.nl-msg{font:500 12px 'IBM Plex Sans',sans-serif;margin-top:10px;color:#7FD8A4;display:none}

/* más noticias al pie (grilla estilo Bloomberg) */
.more-sec{max-width:1240px;margin:0 auto;padding:0 52px 70px}
.more-h2{font:700 26px 'Playfair Display',serif;color:var(--ink);margin-bottom:22px;padding-top:34px;border-top:1px solid var(--line)}
.more-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.mcard{cursor:pointer}
.mcard .cimg{margin-bottom:10px}
.mcard h4{font:600 15.5px 'Playfair Display',serif;line-height:1.3;color:var(--ink);text-wrap:pretty}
.mcard:hover h4{text-decoration:underline;text-decoration-color:rgba(176,138,62,.55);text-underline-offset:3px}
.mcard .ccat{margin:0 0 6px}
.ver-todas{text-align:center;margin-top:34px}
.ver-todas a{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);border:1px solid var(--ink);padding:12px 32px;display:inline-block}
.ver-todas a:hover{background:var(--ink);color:#fff}

.empty-state{padding:80px 52px;text-align:center;font:400 15px 'IBM Plex Sans',sans-serif;color:var(--sub)}

/* footer + mail */
footer{background:#0B1327;padding:28px 52px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.footer-copy{font:400 11px 'IBM Plex Sans',sans-serif;color:rgba(255,255,255,.35)}
.footer-links{display:flex;gap:20px}
.footer-links a{font:500 11px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.55);text-transform:uppercase}
.wa-float{position:fixed;bottom:28px;left:28px;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:100;transition:transform .2s;text-decoration:none}
.wa-float:hover{transform:scale(1.1)}

@media(max-width:1080px){.layout{grid-template-columns:1fr}.more-grid{grid-template-columns:1fr 1fr}}
@media(max-width:880px){.wrap,.more-sec,footer{padding-left:20px;padding-right:20px}}
@media(max-width:600px){.more-grid{grid-template-columns:1fr}.pn{grid-template-columns:1fr}.pn .sig{text-align:left;justify-content:flex-start}}
</style>
</head>

<div class="wrap">

  </div>
</div>

<!-- más noticias -->

<a href="mailto:valtyaanalytics@gmail.com?subject=Consulta%20desde%20valtia.tech" class="wa-float" aria-label="Escribinos por mail" style="background:#B08A3E;box-shadow:0 4px 16px rgba(176,138,62,.4)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1830" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 6l9 6 9-6"/></svg></a>

<script type="module">
/* ── Nota individual desde Firestore ── */
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, query, where, doc, updateDoc, increment, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = getApps().length ? getApp() : initializeApp({
  apiKey: 'AIzaSyCxKNw0995b8a7XXyENiMjDQbfRCe9IBlw',
  authDomain: 'valtia-analytics.firebaseapp.com',
  projectId: 'valtia-analytics',
});
const db = getFirestore(app);

const CATS = { local: "Mercado local", wall: "Wall Street", cripto: "Cripto", bonos: "Bonos y acciones" };
const catName = c => CATS[c] || c;
const GRADS = ["linear-gradient(135deg,#14213D,#B08A3E)","linear-gradient(135deg,#1F7A4D,#14213D)",
  "linear-gradient(135deg,#2B5FB0,#0c1730)","linear-gradient(135deg,#1B2C55,#5B3FA8)"];
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const bg = (a,i) => a.imagen ? `background-image:url('${esc(a.imagen)}')` : `background:${GRADS[i % GRADS.length]}`;
const MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fLong = s => {
  const p = String(s || "").slice(0, 10).split("-");
  return p.length === 3 ? `${Number(p[2])} de ${MES[Number(p[1]) - 1]} de ${p[0]}` : "";
};
const irA = id => { location.href = "nota.html?n=" + encodeURIComponent(id); };
window.irA = irA;

const layout = document.getElementById("layout");
try {
  const snap = await getDocs(query(collection(db, "noticias"), where("estado", "==", "publicado")));
  const docs = snap.docs.map(d => ({ docId: d.id, ...d.data() }))
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));

  const id = new URLSearchParams(location.search).get("n");
  const idx = docs.findIndex(d => d.docId === id);
  if (idx < 0) { location.replace("noticias.html"); throw new Error("nota inexistente"); }
  const a = docs[idx];
  document.title = a.titulo + " — Valtia Analytics";

  const cats = (a.categorias && a.categorias.length) ? a.categorias : ["local"];
  const palabras = String(a.contenido || "").split(/\s+/).length;
  const lectura = Math.max(2, Math.round(palabras / 200));
  const anterior = idx > 0 ? docs[idx - 1] : null;          // más nueva
  const siguiente = idx < docs.length - 1 ? docs[idx + 1] : null;

  const masLeidas = docs.filter(d => d.docId !== a.docId)
    .sort((x, y) => ((Number(y.vistas) || 0) - (Number(x.vistas) || 0)) || String(y.fecha).localeCompare(String(x.fecha)))
    .slice(0, 5);

  layout.innerHTML = `
  <article>
    <a class="art-chip" href="noticias.html">${esc(catName(cats[0]))}</a>
    <h1 class="art-title">${esc(a.titulo)}</h1>
    <p class="art-bajada">${esc(a.resumen || "")}</p>
    ${a.imagen ? `<div class="art-img"><img src="${esc(a.imagen)}" alt="${esc(a.titulo)}" onerror="this.parentElement.remove()"></div>
    <div class="art-caption">${esc(a.titulo)}${a.fuente ? " · Imagen: " + esc(a.fuente) : ""}</div>` : ""}
    <div class="art-byline">
      <span class="por">Por Redacción Valtia</span>
      <span class="fecha">${fLong(a.fecha)} · ${lectura} min de lectura</span>
    </div>
    <div class="art-content">${a.contenido || ""}</div>
    <div class="art-tags">${cats.map(c => `<span class="art-tag" onclick="location.href='noticias.html'">${esc(catName(c))}</span>`).join("")}</div>
    ${(anterior || siguiente) ? `<div class="pn">
      <div>${anterior ? `<a href="nota.html?n=${encodeURIComponent(anterior.docId)}"><span class="flecha">‹</span><span><div class="lbl">Noticia anterior</div><div class="tt">${esc(anterior.titulo)}</div></span></a>` : ""}</div>
      <div>${siguiente ? `<a class="sig" href="nota.html?n=${encodeURIComponent(siguiente.docId)}"><span><div class="lbl">Noticia siguiente</div><div class="tt">${esc(siguiente.titulo)}</div></span><span class="flecha">›</span></a>` : ""}</div>
    </div>` : ""}
  </article>
  <aside class="rail">
    <div><div class="rail-h">Las más leídas</div>
      ${masLeidas.map((m, i) => `<div class="ml-item" onclick="irA('${esc(m.docId)}')">
        <div><div class="ccat">${esc(catName((m.categorias || ["local"])[0]))}</div><div class="t">${esc(m.titulo)}</div></div>
        <div class="cimg" style="${bg(m, i)}"></div>
      </div>`).join("")}</div>
    <div class="nl-box">
      <h3>Recibí el análisis de <em>Valtia</em></h3>
      <p>Las claves de los mercados, la economía argentina y cripto — directo a tu casilla, sin ruido.</p>
      <input type="email" id="nl-email" placeholder="tu@email.com" autocomplete="email">
      <button onclick="suscribirNews()">Suscribirme</button>
      <div class="nl-msg" id="nl-msg"></div>
    </div>
  </aside>`;

  // más noticias al pie: las 8 más recientes, sin la actual
  const mas = docs.filter(d => d.docId !== a.docId).slice(0, 8);
  if (mas.length) {
    document.getElementById("more-sec").style.display = "";
    document.getElementById("more-grid").innerHTML = mas.map((m, i) => `
      <div class="mcard" onclick="irA('${esc(m.docId)}')">
        <div class="cimg" style="${bg(m, i)}"></div>
        <div class="ccat">${esc(catName((m.categorias || ["local"])[0]))}</div>
        <h4>${esc(m.titulo)}</h4>
      </div>`).join("");
  }

  // contador de vistas (las reglas solo permiten vistas = vistas + 1)
  updateDoc(doc(db, "noticias", a.docId), { vistas: increment(1) }).catch(() => {});
} catch (e) {
  if (!layout.innerHTML.includes("art-title")) {
    layout.innerHTML = '<div class="empty-state">No encontramos esta nota. <a href="noticias.html">Volver a Noticias</a></div>';
  }
}

/* suscripción al newsletter */
window.suscribirNews = async () => {
  const inp = document.getElementById('nl-email');
  const msg = document.getElementById('nl-msg');
  const email = (inp.value || "").trim();
  msg.style.display = 'block';
  const valido = email.includes("@") && (email.split("@")[1] || "").includes(".");
  if (!valido) {
    msg.style.color = '#F5A5A5'; msg.textContent = 'Escribí un email válido.';
    return;
  }
  try {
    await addDoc(collection(db, "newsletter"), { email, fecha: serverTimestamp() });
    msg.style.color = '#7FD8A4'; msg.textContent = '¡Listo! Te vas a enterar primero.';
    inp.value = '';
  } catch (e) {
    msg.style.color = '#F5A5A5'; msg.textContent = 'No se pudo guardar, probá de nuevo.';
  }
};
</script>
