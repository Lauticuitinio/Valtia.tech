<head>

<title>Carteras — Valtia Analytics</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/favicon-180.png">

<style>
/* ── Carteras — mismo lenguaje editorial que Noticias (navy + dorado):
     página blanca, Playfair + IBM Plex, hairlines, esquinas rectas. Solo claro. ── */
:root{
  --navy:#0E1830;--navy2:#0B1327;
  --gold:#B08A3E;--gold2:#8A6A2F;--gold-claro:#E8CE96;
  --bg:#fff;--bg3:#F6F3EC;
  --text:#101010;--sub:#57534A;--muted:#8B8375;
  --border:#E7E3DA;--card:#fff;
  --ink:#101010;--mut:#8B8375;--line:#E7E3DA;--marfil:#F6F3EC;
  --up:#1F7A4D;--dn:#B23A3A;--greenTx:#1F7A4D;--redTx:#B23A3A;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}

/* nav global (navy, igual a Noticias) */
nav{position:sticky;top:0;z-index:200;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;background:rgba(14,24,48,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(232,206,150,.14)}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:.06em;color:#fff}
.nav-name em{color:#E8CE96;font-style:italic}
.nav-sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.nav-links{display:flex;align-items:center;gap:26px}
.nav-links a{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.nav-links a:hover,.nav-links a.active{color:#E8CE96}
.nav-cta{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#0E1830;background:#E8CE96;padding:9px 22px;border-radius:8px;text-decoration:none}
.nav-cta:hover{background:#fff;color:#0E1830}
@media(max-width:1100px){.nav-links{display:none}}

/* masthead centrado sobre la franja navy, con el título de la página */
.masthead{background:#0E1830;padding:26px 52px 20px;text-align:center}
.masthead .t{font:700 clamp(30px,3.6vw,44px) 'Playfair Display',serif;color:#fff;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
.masthead .t em{color:#E8CE96;font-style:italic}
.masthead .d{font:500 10.5px 'IBM Plex Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(232,206,150,.75);margin-top:12px}

/* columna de contenido de 1136px. El <footer> lo pinta el JS DENTRO de <main>: la grilla
   de tres pistas lo deja ir a sangre. Ojo: entre ítems de grilla los márgenes verticales
   no colapsan (se suman), por eso los ajustes con "+" más abajo. */
main{display:grid;grid-template-columns:minmax(52px,1fr) minmax(0,1136px) minmax(52px,1fr);padding-top:30px}
main>*{grid-column:2;min-width:0}

/* rótulo (eyebrow) */
.eye{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font:700 10.5px/1.5 'IBM Plex Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-bottom:12px}
/* nombre de la cartera en el detalle (como .head h1 de la ficha de activo) */
main h1,main .dnom{font:700 clamp(26px,3.4vw,38px) 'Playfair Display',serif;font-variant-numeric:lining-nums;line-height:1.1;letter-spacing:.01em;color:var(--ink);text-wrap:balance}
.sub{color:var(--sub);font-size:15px;line-height:1.75;max-width:720px;margin-bottom:8px}
.honest{display:inline-flex;justify-self:start;align-items:center;gap:8px;margin:14px 0 0;border:1px solid var(--line);border-left:3px solid var(--gold);background:var(--marfil);padding:10px 14px;font-size:12.5px;color:var(--sub);line-height:1.5}
.honest b{color:var(--ink);font-weight:600}

/* catálogo: tarjetas rectas con hairline y filete dorado arriba (como .fsr-card de Informes) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:18px;margin-top:32px}
.ccard{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);padding:22px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s;position:relative;min-width:0}
.ccard:hover{border-color:var(--gold)}
.ccard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font:700 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;background:var(--gold);color:#0E1830;padding:4px 9px}
.tagx{font:600 9px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);padding:3px 8px;color:var(--sub)}
.ccard h3{font:700 20px 'Playfair Display',serif;font-variant-numeric:lining-nums;line-height:1.2;color:var(--ink);text-wrap:pretty}
.ccard p{font-size:13px;color:var(--sub);line-height:1.65;flex:1}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini .mi{border:1px solid var(--line);padding:10px 12px;min-width:0}
.mini .l{font:600 9px/1.45 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.mini .v{font:600 15px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.spark{height:56px;position:relative}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.cta .go{color:var(--gold2);white-space:nowrap}
.cta .go:hover{color:var(--ink)}
.cta .meta{color:var(--sub);font-weight:500;font-size:10px;letter-spacing:.08em;line-height:1.5}
.pos{color:var(--up)!important}.neg{color:var(--dn)!important}.mut{color:var(--mut)!important}

/* detalle */
.crumb{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-bottom:22px}
.crumb a{color:var(--sub);text-decoration:none}
.crumb a:hover{color:var(--gold)}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dmeta{font:500 10.5px/2 'IBM Plex Sans',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:10px 0 0;max-width:900px}
.dmeta+.kpis{margin-top:26px}

/* tiles de métricas: tarjeta recta con hairline y acento dorado arriba */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px;margin:0 0 24px}
.kpi{background:#fff;border:1px solid var(--line);padding:15px 16px 14px;position:relative;min-width:0}
.kpi::before{content:'';position:absolute;top:-1px;left:16px;width:22px;height:2px;background:var(--gold)}
.kpi .l{font:600 9px/1.45 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.kpi .v{font:600 clamp(16px,1.5vw,20px) 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.kpi .s{font-size:10.5px;color:var(--sub);margin-top:7px;line-height:1.45}

/* título de sección: patrón .sec-h de Informes (Playfair + hairline que se estira) */
.sec{display:flex;align-items:center;gap:14px;margin:34px 0 16px;font:700 17px 'Playfair Display',serif;font-variant-numeric:lining-nums;line-height:1.25;color:var(--ink)}
.sec::after{content:'';flex:1;min-width:24px;height:1px;background:var(--line)}
.kpis+.sec{margin-top:10px}
.sub+.sec{margin-top:26px}

/* gráfico de evolución */
.chart-box{background:#fff;border:1px solid var(--line);padding:18px 20px;height:340px;position:relative}
.chart-box .inner{position:absolute;inset:56px 18px 16px}
.chart-box .leg{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:11.5px;line-height:1.5;color:var(--sub)}
.leg b{font:600 11.5px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.dotl{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}

/* tablas: encabezado con filete de tinta, filas con hairline, números en Plex Mono */
.panel{background:#fff;border:1px solid var(--line);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
th{text-align:left;font:700 10px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:12px 16px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top;color:var(--ink)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--marfil)}
.num{text-align:right}
td.num{font:500 12.5px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
td.num div{font-family:'IBM Plex Sans',sans-serif;font-weight:400}
td:not(.razon):not(.tesis-row)>b{font:600 12.5px 'IBM Plex Mono',monospace;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:4px;font:700 9.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;white-space:nowrap}
td.num .pill{font:600 11.5px 'IBM Plex Mono',monospace;letter-spacing:0;text-transform:none;padding:2px 7px}
.pill.p{color:var(--up);background:rgba(31,122,77,.1)}
.pill.n{color:var(--dn);background:rgba(178,58,58,.1)}
.pill.m{color:var(--sub);background:var(--marfil)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;padding:6px 12px;font:500 12px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;display:inline-flex;gap:8px;align-items:center}
.chip b{font-weight:600;letter-spacing:.02em;color:var(--ink)}
/* las columnas de texto no se aplastan cuando la tabla scrollea de costado en el celular */
.razon{color:var(--sub);font-size:12px;line-height:1.6;max-width:520px;min-width:280px}
.razon b{color:var(--ink);display:block;font-size:12.5px;margin-bottom:2px}
.tesis-row{color:var(--sub);font-size:12px;line-height:1.55;max-width:340px;min-width:260px}
td:not(.num)>b+div{min-width:120px}

/* footer de Noticias (navy2). Lo pinta el JS dentro de <main>: va a sangre, con el texto
   alineado a la columna de contenido y un ancho de lectura de ~900px */
footer{margin-top:48px;background:#0B1327;padding:28px max(52px,calc(50% - 332px)) 28px max(52px,calc(50% - 568px));font:400 11px/1.9 'IBM Plex Sans',sans-serif;color:rgba(255,255,255,.55)}
main>footer{grid-column:1/-1}
footer b{color:rgba(255,255,255,.85);font-weight:600}
footer a{color:inherit;text-decoration:underline}
footer a:hover{color:#E8CE96}

.state{border:1px dashed var(--line);text-align:center;padding:60px 20px;color:var(--sub);font-size:14px;line-height:1.9;margin-top:30px}
main>.state{margin:10px 0 70px}
.grid>.state{grid-column:1/-1;margin-top:0}
.state a{text-decoration:underline;text-underline-offset:3px}

/* botón de mail flotante abajo a la izquierda (el mismo de activo.html / noticias.html) */
.wa-float{position:fixed;bottom:28px;left:28px;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:100;transition:transform .2s;text-decoration:none}
.wa-float:hover{transform:scale(1.1)}

@media(max-width:880px){
  .masthead{padding-left:20px;padding-right:20px}
  main{grid-template-columns:minmax(20px,1fr) minmax(0,1136px) minmax(20px,1fr)}
  footer{padding-left:20px;padding-right:20px}
}
@media(max-width:760px){.chart-box{height:300px}.chart-box .inner{top:74px}}
</style>
</head>

<!-- masthead: el título de la página sobre la franja navy (antes lo pintaba el JS en el catálogo) -->
<div class="masthead">
  <h1 class="t">Carteras <em>Valtia</em></h1>
  <div class="d">Gestionadas y con seguimiento verificable</div>
</div>

<!-- cotizaciones en vivo (módulo único del sitio: cotizaciones.js) -->
<div id="valtia-cot"></div>
<main id="main">
  <div class="state">Cargando carteras…</div>
</main>

<a href="mailto:soporte@valtia.tech?subject=Consulta%20desde%20valtia.tech" class="wa-float" aria-label="Escribinos por mail" style="background:#B08A3E;box-shadow:0 4px 16px rgba(176,138,62,.4)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1830" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 6l9 6 9-6"/></svg></a>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy, where }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { tickerFicha, linkDe } from './activos.js?v=7';
import { EMPRESAS } from './empresas.js?v=3';

const app = initializeApp({
  apiKey: 'AIzaSyCxKNw0995b8a7XXyENiMjDQbfRCe9IBlw',
  authDomain: 'valtia-analytics.firebaseapp.com',
  projectId: 'valtia-analytics',
});
const db = getFirestore(app);

const $ = s => document.querySelector(s);
// las lecaps valuadas en dolares son centavos por 100 VN: mas decimales
const fmtUSD = n => n == null || !isFinite(Number(n)) ? "—" : "US$" + Number(n).toLocaleString("es-AR",
  { maximumFractionDigits: Math.abs(Number(n)) > 0 && Math.abs(Number(n)) < 1 ? 4 : 2 });
const fmtPct = n => n == null || !isFinite(n) ? "—" : (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
const cls = n => n > 0.004 ? "pos" : n < -0.004 ? "neg" : "mut";
const pill = (n, t) => `<span class="pill ${n>0.004?"p":n<-0.004?"n":"m"}">${n>0.004?"▲":n<-0.004?"▼":"—"} ${t}</span>`;
const tok = name => getComputedStyle(document.body).getPropertyValue(name).trim();
const RIESGO = { conservador: "Riesgo bajo", moderado: "Riesgo medio", agresivo: "Riesgo alto" };
const PERFIL = { "renta-fija": "Renta fija", "renta-mixta": "Renta mixta", "renta-variable": "Renta variable" };
// fechas: acepta string ISO o Timestamp de Firestore
const fdate = v => !v ? "—" : (v.toDate ? v.toDate().toISOString().slice(0,10) : String(v).slice(0,10));

let charts = [];
// tipografía de los gráficos (ejes y tooltip): la del sitio
if (window.Chart) Chart.defaults.font.family = "'IBM Plex Sans',system-ui,sans-serif";
let cache = null, cacheAuth = null;

// acceso PRO: admin, alta manual (usuariosPro) o cliente del fondo (inversores)
async function esPro(user) {
  if (!user || !user.email) return false;
  if (user.email === 'valtyaanalytics@gmail.com') return true;
  for (const col of ['usuariosPro', 'inversores']) {
    try { if ((await getDoc(doc(db, col, user.email))).exists()) return true; } catch (e) {}
  }
  return false;
}

async function loadAll(user) {
  if (cache && cacheAuth === !!user) return cache;
  // sin acceso PRO solo se listan las públicas (la regla exige el filtro);
  // con acceso se ven todas, incluidas las de suscriptores
  const pro = await esPro(user);
  const admin = !!user && user.email === "valtyaanalytics@gmail.com";
  // el admin ve tambien los borradores (propuestas sin aprobar); PRO ve
  // publicas + de suscriptores (la regla exige el filtro); anonimo solo publicas
  const cartSnap = await getDocs(admin
    ? collection(db, "carterasModelo")
    : pro ? query(collection(db, "carterasModelo"), where("visibilidad", "in", ["publico", "clientes"]))
          : query(collection(db, "carterasModelo"), where("visibilidad", "==", "publico")));
  const carteras = [];
  for (const d of cartSnap.docs) {
    const c = { id: d.id, ...d.data() };
    if (c.estado !== "activa") continue;
    const [posSnap, valSnap, histSnap] = await Promise.all([
      getDocs(collection(db, "carterasModelo", d.id, "posiciones")),
      getDocs(query(collection(db, "carterasModelo", d.id, "valores"), orderBy("fecha"))),
      getDocs(query(collection(db, "carterasModelo", d.id, "historial"), orderBy("fecha", "desc"))),
    ]);
    c.posiciones = posSnap.docs.map(p => p.data()).filter(p => p.estado === "activa")
      .sort((a, b) => (b.mcapEntrada || 0) - (a.mcapEntrada || 0));
    c.valores = valSnap.docs.map(v => v.data());
    c.historial = histSnap.docs.map(h => h.data());
    carteras.push(c);
  }
  cache = carteras; cacheAuth = !!user;
  return carteras;
}

function retorno(c) {
  const last = c.valores[c.valores.length - 1];
  return last ? last.indice - 100 : null;
}
function retornoBench(c) {
  const last = c.valores[c.valores.length - 1];
  return last && last.benchmark != null ? last.benchmark - 100 : null;
}

/* métricas sobre la serie diaria (base 100) */
function diasCalendario(c) {
  const v = c.valores;
  if (v.length < 2) return 0;
  return Math.max(1, Math.round((new Date(v[v.length - 1].fecha) - new Date(v[0].fecha)) / 86400000));
}
function anualizada(c) {
  const last = c.valores[c.valores.length - 1];
  const dias = diasCalendario(c);
  // menos de un año no se anualiza: elevar 61 días a la 365/61 convierte un
  // +12% en "+101% anual", que es una extrapolación, no una medición
  if (!last || dias < 365) return null;
  return (Math.pow(last.indice / 100, 365 / dias) - 1) * 100;
}
function volatilidad(c) {
  const v = c.valores;
  if (v.length < 15) return null;
  const rets = [];
  for (let i = 1; i < v.length; i++) rets.push(v[i].indice / v[i - 1].indice - 1);
  const m = rets.reduce((a, x) => a + x, 0) / rets.length;
  const varza = rets.reduce((a, x) => a + (x - m) * (x - m), 0) / (rets.length - 1);
  return Math.sqrt(varza) * Math.sqrt(252) * 100;   // anualizada, en %
}
function calRiesgo(vol) {
  return vol == null ? null : vol < 15 ? "Baja" : vol < 25 ? "Media" : "Alta";
}

/* radar: P/E y veredicto por ticker (doc público) */
let _radar = null;
async function radarMapa() {
  if (_radar) return _radar;
  _radar = {};
  try {
    const snap = await getDoc(doc(db, "radar", "latest"));
    if (snap.exists()) {
      const alias = sym => tickerFicha(sym) || sym;   // símbolo local → ADR (activos.js)
      (JSON.parse(snap.data().json || "{}").activos || []).forEach(a => {
        _radar[alias(a.sym)] = a;
      });
    }
  } catch (e) {}
  return _radar;
}
// acciones a su ficha, bonos y letras a bono.html (activos.js decide).
// activos.js todavía devuelve la ruta con .html ('activo.html?t=NVDA'): acá se
// sirve sin extensión, como el resto de los links internos del sitio.
const sinHtml = h => h.replace(/\.html(?=\?|#|$)/, '');
const linkFicha = tk => { const h = linkDe(tk); return h
  ? `<a href="/${sinHtml(h)}" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--gold)">${tk}</a>` : tk; };

/* vidriera: las carteras PRO no se pueden LEER sin acceso (regla de
   Firestore), pero sus agregados —retorno real, curva, última rotación—
   son públicos vía carterasTeaser (fondo_sync). El retorno a la vista es
   el argumento de venta; lo que se paga es composición, tesis e historial. */
let _teaserCache = null;
// TIR publicada por el sync para la parte en bonos de cada cartera
let _teaserTir = {}, _teaserPorId = {};
const tirDe = id => (_teaserTir[id] || {}).tir ?? null;
const tirPesoDe = id => (_teaserTir[id] || {}).tirPeso ?? null;
/* métricas que el sync ya calculó para esta cartera (vol, drawdown, composición) */
const tsr = id => _teaserPorId[id] || null;

async function teaserMapa() {
  if (_teaserCache) return _teaserCache;
  _teaserCache = [];
  try {
    const snap = await getDoc(doc(db, "carterasTeaser", "latest"));
    if (snap.exists()) _teaserCache = JSON.parse(snap.data().json || "{}").carteras || [];
    _teaserCache.forEach(t => {
      _teaserTir[t.id] = { tir: t.tir ?? null, tirPeso: t.tirPeso ?? null };
      _teaserPorId[t.id] = t;
    });
  } catch (e) {}
  return _teaserCache;
}

function lockedCard(t) {
  const r = t.retorno, rb = t.retornoBench;
  return `
    <div class="ccard">
      <div class="top"><span class="badge">${t.codigo || t.id}</span>
        <span class="tagx">${RIESGO[t.nivelRiesgo] || t.nivelRiesgo || ""}</span>
        <span class="tagx" style="color:var(--gold2);border-color:var(--gold)">🔒 PRO</span></div>
      <h3>${t.nombre}</h3>
      <p>El retorno real, a la vista. La composición, la tesis por posición y cada rotación con su razonamiento se destapan con Valtia PRO.</p>
      <div class="mini">
        <div class="mi"><div class="l">Desde inicio (${t.fechaInicio || "—"})</div><div class="v ${r != null ? cls(r) : "mut"}">${r != null ? fmtPct(r) : "—"}</div></div>
        <div class="mi"><div class="l">${rb != null ? "Benchmark " + (t.benchmark || "SPY") : "Posiciones"}</div><div class="v">${rb != null ? `<span class="${cls(rb)}">${fmtPct(rb)}</span>` : t.posiciones}</div></div>
      </div>
      <div class="spark"><canvas id="sp-t-${t.id}"></canvas></div>
      <div class="cta"><span class="meta">${t.posiciones} posiciones${t.ultimaRotacion ? " · última rotación " + t.ultimaRotacion.fecha : ""}</span>
        <a class="go" href="/planes">Ver planes →</a></div>
    </div>`;
}

/* ── catálogo ── */
function renderCatalogo(carteras, user, teaser) {
  const bloqueadas = (teaser || []).filter(t => !carteras.some(c => c.id === t.id));
  const cards = carteras.map(c => {
    const r = retorno(c), rb = retornoBench(c);
    const priv = c.visibilidad && c.visibilidad !== "publico";
    return `
    <div class="ccard">
      <div class="top"><span class="badge">${c.codigo || c.slug}</span>
        <span class="tagx">${RIESGO[c.nivelRiesgo] || c.nivelRiesgo || ""}</span>
        ${PERFIL[c.perfil] ? `<span class="tagx">${PERFIL[c.perfil]}</span>` : ""}
        ${c.rebalanceo ? `<span class="tagx">Rebalanceo ${c.rebalanceo}</span>` : ""}
        ${c.visibilidad === "borrador" ? '<span class="tagx" style="color:#B45309;border-color:rgba(180,83,9,.45)">Borrador · sin publicar</span>'
          : priv ? '<span class="tagx" style="color:var(--gold2);border-color:var(--gold)">Suscriptores</span>' : ''}</div>
      <h3>${c.nombre}</h3>
      <p>${c.descripcionCorta || ((c.tesis || "").slice(0, 150) + ((c.tesis||"").length > 150 ? "…" : ""))}</p>
      <div class="mini">
        <div class="mi"><div class="l">Desde inicio (${fdate(c.fechaInicio)})</div><div class="v ${r!=null?cls(r):"mut"}">${r!=null?fmtPct(r):"—"}</div></div>
        ${tirDe(c.id) != null
          ? `<div class="mi"><div class="l">TIR a hoy${tirPesoDe(c.id) != null && tirPesoDe(c.id) < 99 ? ` (${tirPesoDe(c.id)}% en bonos)` : ""}</div><div class="v">${tirDe(c.id).toFixed(1).replace(".", ",")}%</div></div>`
          : `<div class="mi"><div class="l">${rb != null ? "Benchmark " + c.benchmark : "Posiciones"}</div><div class="v">${rb != null ? `<span class="${cls(rb)}">${fmtPct(rb)}</span>` : c.posiciones.length}</div></div>`}
      </div>
      <div class="spark"><canvas id="sp-${c.id}"></canvas></div>
      <div class="cta"><span class="meta">${c.posiciones.length} posiciones · historial real desde el lanzamiento</span>
        <a class="go" href="/cartera?c=${c.id}">Ver cartera →</a></div>
    </div>`;
  }).join("");
  // el rótulo y el <h1> del catálogo viven ahora en el .masthead estático de la página
  $("#main").innerHTML = `
    <p class="sub">Cada cartera se actualiza a diario: posiciones con tesis, precio de entrada registrado el día que entra, y cada rotación fechada con su razonamiento. El rendimiento se mide desde el lanzamiento.</p>
    <div class="honest">🔎 <span><b>Transparencia primero:</b> el historial se construye día a día con precios reales. Lo que ves es lo que fue.</span></div>
    <div class="grid">${cards || '<div class="state">Sin carteras activas todavía.</div>'}${bloqueadas.map(lockedCard).join("")}</div>
    <footer>Valtia Analytics no brinda asesoramiento financiero personalizado a través de estas carteras. La información es de carácter general y educativo; los rendimientos pasados no garantizan resultados futuros. Invertir en renta variable implica riesgo de pérdida del capital.</footer>`;
  charts.forEach(ch => ch.destroy()); charts = [];
  const spark = (el, labels, data) => charts.push(new Chart(el, { type: "line",
    data: { labels, datasets: [{ data, borderColor: "#B08A3E",
      backgroundColor: "rgba(176,138,62,.12)", fill: true, borderWidth: 2, pointRadius: 0, tension: .3 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false } } } }));
  carteras.forEach(c => {
    const el = document.getElementById("sp-" + c.id);
    if (el && c.valores.length >= 2) spark(el, c.valores.map(v => v.fecha), c.valores.map(v => v.indice));
  });
  bloqueadas.forEach(t => {
    const el = document.getElementById("sp-t-" + t.id);
    if (el && (t.serie || []).length >= 2) spark(el, t.serie.map(p => p[0]), t.serie.map(p => p[1]));
  });
}

/* ── detalle ── */
async function renderDetalle(c) {
  document.title = c.nombre + " — Valtia Analytics";
  const radar = await radarMapa();
  const r = retorno(c), rb = retornoBench(c);
  const dif = rb != null && r != null ? r - rb : null;
  const anual = anualizada(c), vol = volatilidad(c), riesgo = calRiesgo(vol);
  const inicio = fdate(c.fechaInicio);
  const posRows = c.posiciones.map(p => {
    const ret = p.precioEntrada ? (p.precioActual / p.precioEntrada - 1) * 100 : 0;
    const ra = radar[p.ticker];
    return `<tr><td><b>${linkFicha(p.ticker)}</b><div style="font-size:11px;color:var(--sub)">${p.empresa || ""}</div></td>
      <td class="num">${((p.pesoObjetivo || 0) * 100).toFixed(0)}%</td>
      <td class="num">${fmtUSD(p.precioEntrada)}<div style="font-size:10px;color:var(--muted)">${fdate(p.fechaIncorporacion)}</div></td>
      <td class="num">${fmtUSD(p.precioActual)}</td>
      <td class="num">${ra && ra.per != null ? ra.per.toFixed(1) + "x" : "—"}${ra && ra.veredicto && ra.veredicto !== "Sin cobertura" ? `<div style="font-size:10px;color:var(--muted)">${ra.veredicto}</div>` : ""}</td>
      <td class="num">${pill(ret, fmtPct(ret))}</td>
      <td class="tesis-row">${p.tesisPosicion || ""}</td></tr>`;
  }).join("");
  const destacadas = c.posiciones.map(p => ({ t: p.ticker, r: p.precioEntrada ? (p.precioActual / p.precioEntrada - 1) * 100 : 0 }))
    .sort((a, b) => b.r - a.r).slice(0, 6)
    .map(x => `<span class="chip"><b>${x.t}</b> <span class="${cls(x.r)}">${fmtPct(x.r)}</span></span>`).join("");
  const histRows = c.historial.map(h => {
    const added = String(h.accion || "").includes("añad");
    return `<tr><td style="white-space:nowrap">${h.fecha}</td>
      <td><b>${linkFicha(h.ticker)}</b><div style="font-size:11px;color:var(--sub)">${h.empresa || ""}</div></td>
      <td>${added ? '<span class="pill p">Añadido</span>' : '<span class="pill n">Eliminado</span>'}</td>
      <td class="num">${h.precio != null ? fmtUSD(h.precio) : "—"}</td>
      <td class="num">${h.retornoSalida != null ? `<span class="${cls(h.retornoSalida)}">${fmtPct(h.retornoSalida)}</span>` : "—"}</td>
      <td class="razon">${h.razonamiento || ""}</td></tr>`;
  }).join("");

  $("#main").innerHTML = `
    <div class="crumb"><a href="/cartera">← Todas las carteras</a></div>
    <div class="dhead">
      <div><div class="eye" style="margin-bottom:10px"><span class="badge">${c.codigo || c.slug}</span> ${RIESGO[c.nivelRiesgo] || ""}${PERFIL[c.perfil] ? " · " + PERFIL[c.perfil] : ""}${c.visibilidad === "borrador" ? ' · <span style="color:#B45309">Borrador · sin publicar</span>' : ""}</div>
        <h2 class="dnom" style="margin-bottom:6px">${c.nombre}</h2></div>
    </div>
    <div class="dmeta">Lanzada ${inicio} · Rebalanceo ${c.rebalanceo || "mensual"} · ${c.modo === "automatico" ? "Reglas automáticas" : "Curada por el equipo"} · Benchmark ${c.benchmark || "—"}<br>${c.criterio || ""}</div>
    ${(() => {
      // la composición vive en el doc de la cartera (hereda su visibilidad),
      // ya no en el teaser público
      let k = null;
      try { k = c.composicion ? JSON.parse(c.composicion) : null; } catch (e) {}
      if (!k || (k.per == null && k.roe == null)) return "";
      const it = (l, v, cob, suf) => v == null ? "" :
        `<div class="kpi"><div class="l">${l}</div><div class="v">${typeof v === "number" ? v.toFixed(v >= 100 ? 0 : 1).replace(".", ",") : v}${suf || ""}</div>` +
        `<div class="s">${cob != null && cob < 100 ? "sobre el " + cob + "% de la cartera" : "de las posiciones de hoy"}</div></div>`;
      return `<div class="eye" style="margin:26px 0 10px">Composición · cómo se ven sus posiciones hoy</div>
        <div class="kpis">
          ${it("P/E ponderado", k.per, k.perCobertura, "x")}
          ${it("ROE", k.roe, k.roeCobertura, "%")}
          ${it("ROA", k.roa, k.roaCobertura, "%")}
          ${it("Beta vs S&P", k.beta, k.betaCobertura, "")}
        </div>
        <p style="font-size:12px;color:var(--sub);line-height:1.7;margin:-14px 0 22px">Promedio ponderado por peso objetivo de los activos que la cartera tiene hoy (el P/E es media armónica). No depende del historial: es la foto de la composición actual.</p>`;
    })()}
    <div class="kpis">
      <div class="kpi"><div class="l">Retorno desde inicio</div><div class="v ${r!=null?cls(r):"mut"}">${r!=null?fmtPct(r):"—"}</div><div class="s">desde ${inicio}</div></div>
      ${rb != null ? `<div class="kpi"><div class="l">${c.benchmark} en igual período</div><div class="v ${cls(rb)}">${fmtPct(rb)}</div><div class="s">misma ventana temporal</div></div>` : ""}
      ${dif != null ? `<div class="kpi"><div class="l">Diferencia vs benchmark</div><div class="v ${cls(dif)}">${fmtPct(dif)}</div><div class="s">acumulada desde el lanzamiento</div></div>` : ""}
      ${anual != null ? `<div class="kpi"><div class="l">Rentabilidad anualizada</div><div class="v ${cls(anual)}">${fmtPct(anual)}</div><div class="s">extrapolada · cartera de ${diasCalendario(c)} días</div></div>` : ""}
      ${riesgo != null ? `<div class="kpi"><div class="l">Calificación de riesgo</div><div class="v">${riesgo}</div><div class="s">volatilidad anualizada ${vol.toFixed(0)}%</div></div>` : ""}
      ${tsr(c.id) && tsr(c.id).maxDD != null ? `<div class="kpi"><div class="l">Peor caída</div><div class="v neg">${fmtPct(tsr(c.id).maxDD)}</div><div class="s">desde su máximo · ${tsr(c.id).nPuntos} ruedas</div></div>` : ""}
      <div class="kpi"><div class="l">Posiciones</div><div class="v">${c.posiciones.length}</div><div class="s">${c.rebalanceo || "mensual"} · pesos equitativos</div></div>
    </div>
    <div class="sec">Evolución · base 100 al lanzamiento</div>
    <div class="chart-box">
      <div class="leg"><span><span class="dotl" style="background:#B08A3E"></span>${c.nombre} <b class="${cls(r)}">${fmtPct(r)}</b></span>
      ${rb != null ? `<span><span class="dotl" style="background:#0E1830"></span>${c.benchmark} <b class="${cls(rb)}">${fmtPct(rb)}</b></span>` : ""}</div>
      <div class="inner"><canvas id="chEvo"></canvas></div>
    </div>
    <div class="sec">Tesis</div>
    <p class="sub" style="max-width:860px">${c.tesis || ""}</p>
    <div class="sec">Acciones destacadas · retorno desde entrada</div>
    <div class="chips">${destacadas}</div>
    <div class="sec">Composición actual</div>
    <div class="panel"><table>
      <thead><tr><th>Activo</th><th class="num">Peso</th><th class="num">Entrada</th><th class="num">Último</th><th class="num">P/E · Radar</th><th class="num">Retorno</th><th>Tesis</th></tr></thead>
      <tbody>${posRows}</tbody></table></div>
    <div class="sec">Historial de selecciones · cada decisión, fechada</div>
    <div class="panel"><table>
      <thead><tr><th>Fecha</th><th>Activo</th><th>Acción</th><th class="num">Precio</th><th class="num">Ret. a la salida</th><th>Razonamiento</th></tr></thead>
      <tbody>${histRows || '<tr><td colspan="6" class="mut" style="text-align:center">Sin rotaciones todavía</td></tr>'}</tbody></table></div>
    <footer><b>Metodología:</b> el índice de la cartera arranca en base 100 el día del lanzamiento (${inicio}) y se actualiza a diario con precios de mercado. No usamos backtests: todo el historial es posterior al lanzamiento y cada rotación queda registrada con fecha, precio y razonamiento. Esta información es de carácter general y no constituye asesoramiento financiero personalizado. Los rendimientos pasados no garantizan resultados futuros.</footer>`;

  charts.forEach(ch => ch.destroy()); charts = [];
  const subC = tok("--sub"), borderC = tok("--border");
  const dsets = [{ label: c.nombre, data: c.valores.map(v => v.indice), borderColor: "#B08A3E",
    backgroundColor: "rgba(176,138,62,.10)", fill: true, borderWidth: 2.2, pointRadius: c.valores.length < 25 ? 3.5 : 0,
    pointBackgroundColor: "#B08A3E", tension: .3 }];
  if (c.valores.some(v => v.benchmark != null)) {
    dsets.push({ label: c.benchmark, data: c.valores.map(v => v.benchmark ?? null), borderColor: "#0E1830",
      borderWidth: 1.8, pointRadius: 0, tension: .3, fill: false });
  }
  charts.push(new Chart(document.getElementById("chEvo"), { type: "line",
    data: { labels: c.valores.map(v => v.fecha), datasets: dsets },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false } },
      scales: { y: { grid: { color: borderC }, ticks: { color: subC, font: { size: 11 }, callback: v => Number(v).toFixed(1) } },
                x: { grid: { display: false }, ticks: { color: subC, font: { size: 10.5 }, maxTicksLimit: 10 } } } } }));
}

let _user = null;
async function render() {
  try {
    const [carteras, teaser] = await Promise.all([loadAll(_user), teaserMapa()]);
    const slug = new URLSearchParams(location.search).get("c");
    if (slug) {
      const c = carteras.find(x => x.id === slug || x.slug === slug);
      if (c) return renderDetalle(c);
      // no la puede leer: si está en la vidriera es PRO — se vende con el
      // retorno real a la vista; si no está, no existe
      const t = teaser.find(x => x.id === slug);
      if (t) {
        $("#main").innerHTML = `<div class="state">
          <div style="font-family:'Playfair Display',serif;font-weight:700;font-variant-numeric:lining-nums;font-size:22px;line-height:1.2;color:var(--ink);margin-bottom:8px">${t.nombre}</div>
          ${t.retorno != null ? `<div style="margin-bottom:14px">Retorno real desde ${t.fechaInicio}: <b class="${cls(t.retorno)}" style="font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px">${fmtPct(t.retorno)}</b>${t.retornoBench != null ? ` · ${t.benchmark || "SPY"} <span style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums">${fmtPct(t.retornoBench)}</span>` : ""}</div>` : ""}
          La composición, la tesis y cada rotación con su razonamiento son de Valtia PRO.<br><br>
          <a class="go" href="/planes" style="color:var(--gold);font-weight:600">Conocé Valtia PRO →</a>
          &nbsp;·&nbsp; <a href="/cartera" style="color:var(--sub)">mirá las abiertas</a></div>`;
        return;
      }
      $("#main").innerHTML = `<div class="state">No encontramos esa cartera. <a href="/cartera" style="color:var(--gold)">Ver todas →</a></div>`;
      return;
    }
    renderCatalogo(carteras, _user, teaser);
  } catch (e) {
    $("#main").innerHTML = `<div class="state">No se pudieron cargar las carteras (${String(e).slice(0, 140)})</div>`;
  }
}
// el catálogo cambia según haya sesión: se re-renderiza al resolver el auth
onAuthStateChanged(getAuth(app), u => { _user = u; render(); });
</script>
