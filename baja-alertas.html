<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desactivar alertas — Valtia Analytics</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0E1830">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E1830;font-family:'IBM Plex Sans',system-ui,sans-serif;padding:20px}
.card{background:#fff;max-width:440px;width:100%;padding:44px 40px;text-align:center}
h1{font:700 30px 'Playfair Display',serif;color:#0E1830;margin-bottom:6px}
h1 em{color:#B08A3E;font-style:italic}
p{font-size:14px;color:#57534A;line-height:1.7;margin:14px 0 22px}
button{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;background:#0E1830;color:#E8CE96;border:none;padding:14px 30px;cursor:pointer}
button:hover{background:#B23A3A;color:#fff}
button:disabled{opacity:.6;cursor:default}
.msg{font-size:14px;font-weight:600;margin-top:18px;display:none;line-height:1.6}
a{color:#B08A3E;font-size:12px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>Valtia <em>Analytics</em></h1>
  <p id="texto">¿Querés dejar de recibir por mail las alertas sobre los activos de tu cartera?</p>
  <button id="btn">Desactivar alertas</button>
  <div class="msg" id="msg"></div>
  <p style="margin-top:26px;margin-bottom:0"><a href="/">← Volver a Valtia</a></p>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = getApps().length ? getApp() : initializeApp({
  apiKey: 'AIzaSyCxKNw0995b8a7XXyENiMjDQbfRCe9IBlw',
  authDomain: 'valtia-analytics.firebaseapp.com',
  projectId: 'valtia-analytics',
});
const db = getFirestore(app);
const t = new URLSearchParams(location.search).get('t') || '';
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
const decir = (texto, ok) => { msg.style.display = 'block'; msg.style.color = ok ? '#1F7A4D' : '#B23A3A'; msg.textContent = texto; };

// el token lo genera el pipeline (token_urlsafe): letras, números, - y _
if (!/^[A-Za-z0-9_-]{20,64}$/.test(t)) {
  document.getElementById('texto').textContent = 'El link no es válido: usá el que viene al pie del mail de alertas.';
  btn.style.display = 'none';
}

btn.addEventListener('click', async () => {
  btn.disabled = true;
  try {
    await updateDoc(doc(db, 'alertasBaja', t), { baja: serverTimestamp() });
    decir('Listo: no vas a recibir más alertas por mail. Si mañana ya estaba saliendo uno, es el último. Podés volver a activarlas desde tu panel.', true);
    btn.style.display = 'none';
  } catch (e) {
    if (e && (e.code === 'permission-denied' || e.code === 'not-found')) {
      decir('Este link no es válido. Podés revisar tus alertas desde tu panel.', false);
      btn.style.display = 'none';
    } else {
      decir('No se pudo procesar. Probá de nuevo en un rato, o desactivalas desde tu panel.', false);
      btn.disabled = false;
    }
  }
});
</script>
</body>
</html>
